# Syncthing's web page answers on this machine alone, at http://127.0.0.1:8384. STGUIADDRESS
# outranks the address in Syncthing's own settings, so a change there doesn't open it to the
# network; its scheme also decides TLS, which outranks Syncthing's "Use HTTPS for GUI", and plain
# HTTP never leaves this machine. Written by KubaOS's Syncthing app, and removed with it.
[Service]
Environment=STGUIADDRESS=http://127.0.0.1:8384
