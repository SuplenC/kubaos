# T3 Code from the .deb of its GitHub release, pinned to its sha256. nixpkgs' t3code lags far
# behind the releases. The app keeps itself current from the same releases (electron-updater,
# resources/app-update.yml in the package), so an update never puts it back to this pin.
# https://github.com/pingdotgg/t3code/releases
#
# It comes two ways, and neither is the default. The desktop app runs its own server while its
# window is open. As a service, T3's `t3` runtime comes from the same release's CLI archive, the
# one T3's own installer and `t3 update` take, its sha256 the one the release's SHA256SUMS lists,
# unpacked the way T3's installer unpacks it; its background service runs as a systemd user unit
# on this machine only (T3CODE_LAN=false in service.env), and the desktop app is its client.
# Every step is T3's own, so `t3 update` and `t3 uninstall` know what is there; `t3 update` keeps
# the runtime current.
# https://github.com/pingdotgg/t3code/blob/main/docs/user/background-service.md
name = "T3 Code"
category = "ai"
tags = ["coding agents", "agents", "claude", "codex", "threads"]
summary = "Every coding agent you pay for, in one window. Watch them burn tokens in parallel."
# Its README, MIT (github.com/pingdotgg/t3code).
description = """\
T3 Code runs the coding agents on your machine and gives them one fast interface. Start a \
thread at your desk, then approve the next step from your phone. It works with Claude Code, \
Codex, Cursor, OpenCode, Grok Build, Antigravity, Kiro, Pi, Muse Code, fx, and any ACP agent. \
If an agent is set up on your computer, T3 Code can control it."""
description_from = "https://github.com/pingdotgg/t3code"

[[action]]
name = "Install T3 Code"
kind = "deb"
package = "t3code"
version = "0.1.9"
self_updates = true
amd64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v0.1.9/T3-Code-0.1.9-amd64.deb", sha256 = "418c7825f73107b7b5ba3babae5e3b485801dc22d9dc0d518af632f7906cbdd1" }
arm64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v0.1.9/T3-Code-0.1.9-arm64.deb", sha256 = "7959976b4d7fc4443c9fb770128774d4e86f14db01044be36901e488908f3bb4" }

[setup.desktop]
name = "T3 Code"
summary = "The desktop app, which runs your agents while its window is open"

[setup.service]
name = "T3 Code as a service"
summary = "Your agents keep running in a service on this machine; the desktop app connects to it"

# HAZARD: the desktop app's own server holds the T3 home while it is open: a service started
# meanwhile restarts and fails until it quits, and the app writes its settings back over a
# removal's when it quits.
[[setup.service.ready]]
check = ["./closed"]
says = "T3 Code is open: quit it, then try again"

[[setup.service.action]]
name = "Download the t3 runtime"
kind = "download"
to = "~/.t3/runtime/versions/@VERSION@"
version = "0.1.9"
unpack = "tar-gz"
strip = 1
amd64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v0.1.9/t3-0.1.9-linux-x64.tar.gz", sha256 = "0141025335da334759cecd8db3483e09772f3600ca03674698524e7d94291362" }
arm64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v0.1.9/t3-0.1.9-linux-arm64.tar.gz", sha256 = "52023bc5728a4dee4de361ad6fef7c236f1efb2742ff25e29d5c55e2fb662eea" }

# The runtime the download unpacked, which `t3 update` replaces later: the launchers, `t3`, point
# at whichever is newest.
[[setup.service.action]]
name = "Install the t3 command"
kind = "run"
do = ["./install-t3", "@HOME@/.t3/runtime/versions/0.1.9"]
check = ["./t3-installed"]
undo = ["./uninstall-t3"]

# `t3 service install` turns lingering on; this keeps whether it was on before.
[[setup.service.action]]
name = "Keep the service running when you log out"
kind = "linger"

[[setup.service.action]]
name = "Start the service"
kind = "run"
do = ["@HOME@/.local/bin/t3", "service", "install"]
check = ["systemctl", "--user", "is-enabled", "--quiet", "t3code.service"]
undo = ["./service-away"]

[[setup.service.action]]
name = "Have the desktop app use the service"
kind = "setting"
file = "~/.t3/userdata/desktop-settings.json"
key = "localEnvironmentEnabled"
value = false

# T3 keeps its saved connections encrypted, so nothing but T3 Code can add one: a one-time
# pairing link opened in it, which it asks the user to confirm once.
[[setup.service.action]]
name = "Pair T3 Code with the service"
kind = "run"
do = ["./pair"]
check = ["./paired"]
undo = ["./unpair"]
window = "Open T3 Code and run `t3 pair` to connect it to the service on this machine"
