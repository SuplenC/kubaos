# The dkms.conf of xpadneo's DKMS source, adapted from atar-axis/xpadneo v0.10.5
# (hid-xpadneo/dkms.conf.in), GPL-3.0-or-later, as its Makefile writes it, without its
# post-install scripts, which only take away a file of xpadneo's releases for kernels before 5.12.
# AUTOINSTALL has DKMS build it for each kernel installed later, and sign it as it signs every
# module.
PACKAGE_NAME="hid-xpadneo"
PACKAGE_VERSION="@VERSION@"

BUILT_MODULE_NAME[0]="hid-xpadneo"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"

MAKE[0]="make -C '${kernel_source_dir}' M='${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src' VERSION='${PACKAGE_VERSION}' modules"

BUILD_EXCLUSIVE_KERNEL_MIN="5.12.0"
BUILD_EXCLUSIVE_CONFIG="CONFIG_HID CONFIG_INPUT_FF_MEMLESS CONFIG_POWER_SUPPLY CONFIG_CRC16"

AUTOINSTALL="yes"
