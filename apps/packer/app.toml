# Packer from HashiCorp's signed apt repository, whose key system/packages.toml pins
# ([repo.hashicorp]), shared with Terraform and Vault. Ubuntu's archive has no packer for 26.04,
# and nixpkgs builds it as unfree, as its licence is the Business Source License. Its package
# writes no source of its own.
# https://developer.hashicorp.com/packer/install
name = "Packer"
category = "devops"
tags = ["machine images", "images", "hashicorp", "hcl", "vm", "ami", "cli"]
summary = "Bakes the same machine image for every cloud from one file. Snowflake servers can fuck off."
# The opening of its README, under the Business Source License 1.1, which allows copying it
# (github.com/hashicorp/packer).
description = """\
Packer is a tool for building identical machine images for multiple platforms from a single \
source configuration. Packer is lightweight, runs on every major operating system, and is highly \
performant, creating machine images for multiple platforms in parallel."""
description_from = "https://github.com/hashicorp/packer/blob/v1.16.2/README.md"
# Packer's logo, HashiCorp's trademark, on a tile (packer.svg's header): Colloid has none.
icon = "packer.svg"
keeps = """\
The plugins packer init installed stay in ~/.config/packer, and your templates in your projects: \
install Packer again and they're all there."""

[[action]]
name = "Install Packer"
kind = "apt"
repo = "hashicorp"
packages = ["packer"]
