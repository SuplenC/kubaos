# Visual Studio Code from Microsoft's signed apt repository, whose key system/packages.toml pins
# ([repo.vscode]). VS Code's own package writes the same sources file unless another source has
# the repository, and deletes it with the key as it is removed; the one KubaOS writes is the same,
# word for word, at the same keyring path. Of what it recommends, apt's --no-install-recommends
# leaves out bubblewrap, which the agent's terminal sandbox runs commands in, so the step installs
# it; socat and libvulkan1 are on every machine already. Its package also links /usr/bin/copilot
# to the Copilot CLI shim it ships, unless another copilot is there.
# https://code.visualstudio.com/docs/setup/linux
name = "Visual Studio Code"
category = "development"
tags = ["editor", "ide", "code", "vscode", "microsoft"]
summary = "Microsoft's Electron editor. Telemetry on, and a fucking copilot in /usr/bin you never asked for."
# The opening of VS Code's README, MIT, Copyright (c) 2015 - present Microsoft Corporation
# (github.com/microsoft/vscode).
description = """\
Visual Studio Code combines the simplicity of a code editor with what developers need for their \
core edit-build-debug cycle. It provides comprehensive code editing, navigation, and \
understanding support along with lightweight debugging, a rich extensibility model, and \
lightweight integration with existing tools."""
description_from = "https://github.com/microsoft/vscode/blob/1.146.0/README.md"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "code"
keeps = """\
Your settings and sign-in stay in ~/.config/Code, and your extensions in ~/.vscode: install \
VS Code again and they're all there."""

[[action]]
name = "Install Visual Studio Code"
kind = "apt"
repo = "vscode"
packages = ["code", "bubblewrap"]
