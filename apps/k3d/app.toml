# k3d from its GitHub release, the program itself, pinned to GitHub's digest of each file.
# Upstream's build names the k3s release a new cluster starts; nixpkgs' names none, so its
# clusters start k3s 1.21, years too old for any kubectl. Ubuntu doesn't package k3d. Its
# clusters are Docker containers, so it requires Docker.
# https://k3d.io/stable/#installation
name = "k3d"
category = "devops"
tags = ["kubernetes", "k8s", "k3s", "cluster", "local", "docker"]
summary = "k3s in Docker: a Kubernetes cluster up in seconds. Faster than reading this sentence. Almost."
# k3d's README is under the MIT licence, which asks for its notice with every copy, so this is
# ours.
description = """\
k3d runs k3s, Rancher's small Kubernetes distribution, in Docker containers: a cluster of one \
or more nodes in seconds, with its own image registry and load balancer if you want them, for \
local development and CI."""
description_from = "kubaos"
# k3d's logo, MIT, on a tile (k3d.svg's header): no icon theme has k3d.
icon = "k3d"
requires = ["docker"]
keeps = """\
Your clusters are Docker containers, and keep running until `k3d cluster delete` takes them \
away; their entries stay in your kubeconfig."""

[[action]]
name = "Download k3d"
kind = "download"
to = "/usr/local/bin/k3d"
version = "5.9.0"
unpack = "file"
amd64 = { url = "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64", sha256 = "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0" }
arm64 = { url = "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-arm64", sha256 = "03cde5cf23e6e8e67de5a039ecf26e5b85aca82fba3e5d13dadf904cd218a250" }
