# Sunshine from the .deb of its GitHub release built for Ubuntu 26.04, pinned to the sha256 GitHub
# publishes for each asset. LizardByte keeps no apt repository and Ubuntu doesn't package it.
# nixpkgs has the same release, but a stream host needs what a Nix build can't have here: NVIDIA's
# encoder, the machine's VA-API drivers whatever the GPU, and capabilities on its program. The
# package's postinst gives /usr/bin/sunshine CAP_SYS_ADMIN and CAP_SYS_NICE as permitted
# capabilities, for capturing the screen through KMS (Hyprland's own screencopy needs neither),
# loads uhid, and its udev rules (/usr/lib/udev/rules.d/60-sunshine.rules) hand the logged-in user
# /dev/uinput and /dev/uhid, for the mouse, keyboard and gamepads a stream sends, for as long as the
# package is installed, Sunshine running or not: any program of the user's can type, move the
# pointer and act as a gamepad. The .deb doesn't update itself, so a release of KubaOS moves the pin
# on; it writes no source of its own. Nothing starts it at login: its menu entry starts its user
# service, app-dev.lizardbyte.app.Sunshine.service, which serves until you stop it or log out. While
# it runs, its streaming ports (47984, 47989 and 48010 over TCP, 47998 to 48000 and 48002 over UDP)
# listen on every network the machine is on, and a stream goes only to a client paired with the PIN
# you type into its web page; UPnP, which would open those ports on the router to the internet,
# stays off. Its web page (https://localhost:47990) listens on every network too, and with
# Sunshine's default it answers the LAN, whose admin account runs commands as you. A setting owns
# origin_web_ui_allowed = pc in sunshine.conf, the key = value file Sunshine itself rewrites as you
# change its settings, leaving its other lines alone, so the page and its API answer this machine
# alone. Sunshine itself gives the page's first sign-in to whoever asks for it, from any address,
# until one is set, so the install sets one before anything can start Sunshine, which nothing does
# until you pick its menu entry: Sunshine's own sunshine --creds, with your login name and a random
# 32-character password, saved readable by you alone in ~/.config/kubaos/sunshine/password, which
# the step's undo takes with the app. The page has no open first-sign-in window. A sign-in already
# there is yours: it is adopted and left alone. The removal takes the sign-in it set while it is
# still that one, keeping your paired clients; one you changed in the page stays. Sunshine takes the
# password as an argument, its one way, so it shows in the process list for the moment the command
# runs.
# https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2getting__started.html
name = "Sunshine"
category = "games"
tags = ["games", "streaming", "host", "moonlight", "remote play", "gamestream"]
summary = "Makes this machine a game streaming host for Moonlight. Your GPU, from the sofa."
# From its AppStream metainfo, CC0-1.0 (LizardByte/Sunshine), its first paragraph, the project's
# description the package's build fills in.
description = """\
Offering low latency, cloud gaming server capabilities with support for AMD, Intel, and Nvidia \
GPUs for hardware encoding. Software encoding is also available. You can connect to Sunshine \
from any Moonlight client on a variety of devices. A web UI is provided to allow configuration, \
and client pairing, from your favorite web browser. Pair from the local server or any mobile \
device."""
description_from = "https://github.com/LizardByte/Sunshine/blob/v2026.914.233613/packaging/linux/dev.lizardbyte.app.Sunshine.metainfo.xml"
# Sunshine's logo, GPL-3.0-only, on a tile (dev.lizardbyte.app.Sunshine.svg's header), put in the
# theme by the name its package's desktop entry gives.
icon = "dev.lizardbyte.app.Sunshine.svg"
keeps = """\
Your paired clients, apps and settings stay in ~/.config/sunshine: install Sunshine again and \
your clients are still paired. The sign-in KubaOS set goes, with its password in \
~/.config/kubaos/sunshine/password; one you set or changed yourself stays."""

# HAZARD: Sunshine runs /usr/bin/sunshine, which a removal takes, and keeps the uinput devices
# its streams made while it runs.
[[ready]]
check = ["./closed"]
says = "Sunshine is running: quit it from its tray icon, then try again"

[[action]]
name = "Install Sunshine"
kind = "deb"
package = "sunshine"
version = "2026.914.233613-1+ubuntu26.04"
amd64 = { url = "https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/sunshine_2026.914.233613-1+ubuntu26.04_amd64.deb", sha256 = "b8a8ceeeb2b3f30a18a994ad268c94e0c91170f33a864c7aad31eed927ad7d47" }
arm64 = { url = "https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/sunshine_2026.914.233613-1+ubuntu26.04_arm64.deb", sha256 = "174fa9123362c93eac164554a0651ecab17d64d9525fccd9974964fceec553af" }

[[action]]
name = "Keep Sunshine's web page to this machine"
kind = "setting"
file = "~/.config/sunshine/sunshine.conf"
key = "origin_web_ui_allowed"
value = "pc"

# Before anything can start Sunshine: no unit is enabled and no autostart entry is written, so
# only a click on its menu entry in the moment since its package went in could start it first.
# A sign-in already there makes the step found, and no password file is written or claimed.
[[action]]
name = "Sign Sunshine in as you before a stranger does, password in ~/.config/kubaos/sunshine/password"
kind = "run"
do = ["./sign-in"]
check = ["./signed-in"]
undo = ["./sign-out"]
