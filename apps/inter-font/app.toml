# Inter from Ubuntu's archive: fonts-inter, Inter 4.1, upstream's newest, Inter and Inter Display in
# every weight with their italics, in /usr/share/fonts/opentype/inter, under the SIL Open Font
# License 1.1. dpkg's fontconfig trigger refreshes the machine's font cache as it lands and as it
# goes.
# https://rsms.me/inter/
name = "Inter"
category = "system"
tags = ["font", "sans serif", "interface", "typeface", "inter"]
summary = "The sans-serif half the internet's interfaces are set in. Clean, legible, and now on your machine."
# Inter's own words aren't under a licence that allows copying them without their notice, so this
# is ours.
description = """\
Inter is a sans-serif typeface designed for computer screens, with tall lowercase letters for \
legibility at small sizes, tabular figures, many OpenType features and nine weights with \
italics. Inter Display, for large text, comes with it."""
description_from = "kubaos"
# Colloid's font icon, the system's icon theme (home/curated.nix), as a font has none of its own.
icon = "fonts"

[[action]]
name = "Install Inter"
kind = "apt"
packages = ["fonts-inter"]
