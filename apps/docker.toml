# Docker Engine from Docker's signed apt repository, whose key system/packages.toml pins
# ([repo.docker]). Docker's own packages, not Ubuntu's docker.io, which trails them.
# https://docs.docker.com/engine/install/ubuntu/
# Its system hooks (install_docker_access in system/lib.sh) put the user in the docker group and start
# Docker on its first use rather than at boot.
name = "Docker"
summary = "Containers and Compose"
system_hooks = "docker_access"

[apt]
repo = "docker"
packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]
