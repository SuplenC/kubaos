# LibreWolf from its signed apt repository, whose key system/packages.toml pins
# ([repo.librewolf]).
# https://librewolf.net/installation/debian/
name = "LibreWolf"
category = "browsers"
tags = ["browser", "web", "internet", "firefox", "privacy"]
summary = "Firefox with the telemetry ripped out and privacy cranked to max. Some sites will sulk."
# From its AppStream metainfo, CC0-1.0.
description = """\
This project is an independent fork of Firefox, with the primary goals of privacy security and \
user freedom. LibreWolf uses more than 500 privacy/security/performance settings, patches, \
LibreWolf-Addons (optional) and is designed to minimize data collection and telemetry as much as \
possible (updater, crashreporter and Firefox's integrated addons that don't respect privacy are \
removed). LibreWolf is NOT associated with Mozilla or its products."""
description_from = "https://github.com/flathub/io.gitlab.librewolf-community/blob/master/io.gitlab.librewolf-community.appdata.xml"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "librewolf"
keeps = """\
Your profile (bookmarks, passwords, history) stays in ~/.config/librewolf, or ~/.librewolf where \
an older LibreWolf made it: install LibreWolf again and it's all there."""

[[action]]
name = "Install LibreWolf"
kind = "apt"
repo = "librewolf"
packages = ["librewolf"]
