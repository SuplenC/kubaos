# NordVPN from NordVPN's signed apt repository, whose key system/packages.toml pins
# ([repo.nordvpn]), for amd64 and arm64: nordvpn, the daemon and the nordvpn command, and
# nordvpn-gui, its window, which the first only recommends. Its packages write no source of their
# own; NordVPN's install script and its nordvpn-release package trust its key for every repository,
# which repo setup takes away. Only the nordvpn group may talk to the daemon (its socket,
# /run/nordvpn/nordvpnd.sock): the first step makes the group and puts you in it before the
# package, whose preinst would otherwise make it and add whoever it guesses ran the install, then
# leave it behind on removal; log out and in for it to count. Its postinst enables and starts
# nordvpnd.socket and nordvpnd.service, and enables nordvpnd-killswitch.service, which puts its kill
# switch up at boot while it is on; the unit steps are those, so each update checks them as any
# step. Its firewall and kill switch are nftables rules of its own. Its removal takes its units
# and /var/lib/nordvpn away, and with it your sign-in.
# KubaOS's Proxy and NordVPN each block what leaves outside their own tunnel: with the Proxy's kill
# switch up NordVPN can't reach its servers, and with NordVPN's on the Proxy's VPN can't reach IT's.
# Use one at a time.
# https://nordvpn.com/download/linux/
name = "NordVPN"
category = "security"
tags = ["vpn", "nordlynx", "wireguard", "openvpn", "privacy", "kill switch"]
summary = "The VPN every YouTuber gets paid to love. It works, sponsor segment or not."
# NordVPN's own words aren't under a licence that allows copying them, so this is ours.
description = """\
NordVPN sends your traffic through NordVPN's servers over NordLynx, its WireGuard, or OpenVPN, \
from the nordvpn command or its window, with a kill switch, Threat Protection Lite's blocking of \
ads and malicious sites, and an allowlist of what stays outside the tunnel. It needs a NordVPN \
subscription."""
description_from = "kubaos"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "nordvpn"
keeps = """\
Your window's settings stay in ~/.config/nordvpn. NordVPN's own removal takes its sign-in and \
settings in /var/lib/nordvpn with it: sign in again when you install it again."""

[[action]]
name = "Let you control NordVPN without sudo"
kind = "group"
group = "nordvpn"

[[action]]
name = "Install NordVPN"
kind = "apt"
repo = "nordvpn"
packages = ["nordvpn", "nordvpn-gui"]

[[action]]
name = "Listen for NordVPN's daemon"
kind = "unit"
unit = "nordvpnd.socket"
scope = "system"
enable = true
start = true

[[action]]
name = "Start NordVPN's daemon"
kind = "unit"
unit = "nordvpnd.service"
scope = "system"
enable = true
start = true

[[action]]
name = "Let NordVPN keep its kill switch at boot"
kind = "unit"
unit = "nordvpnd-killswitch.service"
scope = "system"
enable = true
