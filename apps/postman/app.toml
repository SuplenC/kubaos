# Postman from nixpkgs, through the User flake, which marks it unfree. Postman keeps no apt
# repository, Ubuntu doesn't package it, and its own tarball comes with no published checksum.
# https://www.postman.com/downloads/
name = "Postman"
category = "development"
tags = ["api", "rest", "http", "graphql", "client", "testing"]
summary = "The API client your boss already pays for. Sign in, sync to the cloud, don't ask questions."
# From its AppStream metainfo, CC0-1.0 (flathub/com.getpostman.Postman), without the user counts.
description = """\
Postman is an API platform for building and using APIs. Postman simplifies each step of the API \
lifecycle and streamlines collaboration so you can create better APIs -- faster."""
description_from = "https://github.com/flathub/com.getpostman.Postman/blob/master/com.getpostman.Postman.appdata.xml"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "postman"
keeps = """\
Your sign-in and Postman's local data stay in ~/.config/Postman: install Postman again and you're \
still signed in. Your collections live in Postman's cloud anyway."""

[[action]]
name = "Install Postman"
kind = "nix"
unfree = true
packages = ["postman"]
