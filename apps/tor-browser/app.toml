# Tor Browser through Ubuntu's torbrowser-launcher, which downloads Tor Browser from
# torproject.org, checks the Tor Project's signature on it and keeps it current, as the Tor
# Project wants it to be. The browser it downloads lives in the home, with its profile. The Tor
# Project builds Tor Browser for x86-64 Linux alone, and Ubuntu builds the launcher for amd64 alone.
# https://gitlab.torproject.org/tpo/applications/torbrowser-launcher
name = "Tor Browser"
category = "browsers"
tags = ["browser", "web", "internet", "tor", "privacy", "anonymity"]
summary = "Firefox bounced through three strangers' relays. Slow as shit, and that's the point."
# From torbrowser-launcher's AppStream metainfo, CC0-1.0.
description = """\
Tor Browser Launcher is intended to make Tor Browser easier to maintain and use for GNU/Linux \
users. It downloads the same Tor Browser from torproject.org that everyone else uses, and it \
doesn't alter it in any way. But it does make it much more usable, and it makes the task of \
keeping it up-to-date more secure."""
description_from = "https://github.com/torproject/torbrowser-launcher/blob/main/share/metainfo/org.torproject.torbrowser-launcher.metainfo.xml"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "torbrowser"
keeps = """\
Tor Browser and its profile stay in ~/.local/share/torbrowser, and the launcher's settings in \
~/.config/torbrowser: delete them by hand to forget it all."""

[[action]]
name = "Install Tor Browser's launcher"
kind = "apt"
arch = "amd64"
packages = ["torbrowser-launcher"]
