# Keys only: no passwords, no keyboard-interactive prompts, and no logging in as root. sshd keeps
# the first value it reads for each setting, and this file comes first in sshd_config.d, so a
# later file there can't turn passwords back on. Written by KubaOS's OpenSSH server app, and
# removed with it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
