# Keys only: no passwords, no keyboard-interactive prompts, and no logging in as root. sshd keeps
# the first value it reads for each setting, and this file is read first, before the rest of
# sshd_config.d and sshd_config, so it outranks the same settings there. A Match block, in
# sshd_config or a later file, can still set them again for the connections it matches. Written by
# KubaOS's OpenSSH server app, and removed with it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
