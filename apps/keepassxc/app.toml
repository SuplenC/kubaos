# KeePassXC from its lead developer's signed Launchpad PPA, ppa:phoerious/keepassxc, whose key
# system/packages.toml pins ([repo.keepassxc]): 2.8.0, where Ubuntu's archive has 2.7.10. It
# builds each release for Ubuntu 26.04 on amd64 and arm64, and its package writes no source of its
# own. Of what the package recommends, the step takes Qt's image formats, which the icons it
# downloads for your entries come in; Qt's Wayland plugin is on every machine. Browser integration
# is the KeePassXC-Browser extension and a switch in its settings, which writes the browsers'
# native messaging files in your home. Its Secret Service integration is off until you turn it
# on, and it would take over from the GNOME keyring, which KubaOS keeps secrets in.
# https://keepassxc.org/download/#linux
name = "KeePassXC"
category = "security"
tags = ["passwords", "password manager", "keepass", "offline", "totp", "ssh"]
summary = "Your passwords in one encrypted file you keep yourself. No cloud, no account, no rent."
# From its AppStream metainfo, CC-BY-3.0, the KeePassXC Team (keepassxreboot/keepassxc).
description = """\
KeePassXC is a modern, secure, and open-source password manager for your most sensitive \
information. Designed for people with extremely high demands of secure personal data management. \
You can store many different types of information, such as usernames, passwords, URLs, \
attachments, and notes in an offline, encrypted file. Major features include: Auto-Type into any \
window, browser integration, password generator, advanced search, comprehensive reports, FDO \
Secret Service integration, SSH agent key management, and many more!"""
description_from = "https://github.com/keepassxreboot/keepassxc/blob/2.8.0/share/linux/org.keepassxc.KeePassXC.appdata.xml"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "keepassxc"
keeps = """\
Your password databases are files of your own, where you saved them, and KeePassXC's settings \
stay in ~/.config/keepassxc: install it again and it opens the last one."""

[[action]]
name = "Install KeePassXC"
kind = "apt"
repo = "keepassxc"
packages = ["keepassxc", "qt6-image-formats-plugins"]
