# stern from nixpkgs, through the User flake. Its authors keep no apt repository and Ubuntu
# doesn't package it.
# https://github.com/stern/stern#installation
name = "stern"
category = "devops"
tags = ["kubernetes", "k8s", "logs", "tail", "pods", "cli"]
summary = "Every pod's logs in one terminal, colour-coded. The bug is in there somewhere, scrolling past."
# The opening of its README, Apache-2.0 (github.com/stern/stern).
description = """\
Stern allows you to tail multiple pods on Kubernetes and multiple containers within the pod. \
Each result is color coded for quicker debugging."""
description_from = "https://github.com/stern/stern/blob/v1.35.0/README.md"
# Generated by `just app-icon` (stern.svg's header): the project has no logo, and no icon theme
# has it.
icon = "stern.svg"
keeps = "Your stern settings stay in ~/.config/stern: install stern again and they're there."

[[action]]
name = "Install stern"
kind = "nix"
packages = ["stern"]
