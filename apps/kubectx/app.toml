# kubectx and kubens from nixpkgs, through the User flake, at upstream's latest release; the one
# package has both. Ubuntu's kubectx is 0.9.5, two releases and three years behind.
# https://github.com/ahmetb/kubectx#installation
name = "kubectx + kubens"
category = "devops"
tags = ["kubernetes", "k8s", "context", "namespace", "kubeconfig", "cli", "switch"]
summary = "Switch clusters and namespaces in one word. Now you can run it against prod faster."
# The opening of its README, Apache-2.0 (github.com/ahmetb/kubectx).
description = """\
kubectx is a tool to switch between contexts (clusters) on kubectl faster, and launch readonly \
shells for each context. kubens is a tool to switch between Kubernetes namespaces (and \
configure them for kubectl) easily."""
description_from = "https://github.com/ahmetb/kubectx/blob/v0.11.0/README.md"
# Generated by `just app-icon` (kubectx.svg's header): the project has no logo, and no icon
# theme has it.
icon = "kubectx"
keeps = """\
Your contexts and namespaces are in your kubeconfig, which was never kubectx's, and the last \
ones you switched from in ~/.kube/kubectx and ~/.kube/kubens."""

[[action]]
name = "Install kubectx and kubens"
kind = "nix"
packages = ["kubectx"]
