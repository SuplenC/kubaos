# Google Chrome from Google's signed apt repository, whose key system/packages.toml pins
# ([repo.google-chrome]). Google builds it for amd64 only.
# https://www.google.com/linux/linux_signing_key.pub
# Its system hooks (install_chrome_theme in system/lib.sh) make its theme colour follow the wallpaper.
name = "Google Chrome"
summary = "Google's web browser"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "google-chrome"
system_hooks = "chrome_theme"

[apt]
repo = "google-chrome"
arch = "amd64"
packages = ["google-chrome-stable"]
