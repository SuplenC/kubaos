# Iosevka Nerd Font from nixpkgs, through the User flake: nerd-fonts.iosevka, Nerd Fonts 3.4.0 of
# Iosevka 33.2.1 (Iosevka is at 34.9), where Nerd Fonts is at 3.5.1. Ubuntu's archive has no
# Nerd Font. The home's switch puts it in the profile's fonts, ~/.nix-profile/share/fonts, which
# fontconfig reads for every app, apt's and Nix's, and builds the profile's font cache with it, so
# the cache is up to date as it lands and as it goes. Its fonts are under the SIL Open Font License
# 1.1, Nerd Fonts' patcher under MIT.
# https://search.nixos.org/packages?show=nerd-fonts.iosevka
name = "Iosevka Nerd Font"
category = "system"
tags = ["font", "monospace", "terminal", "nerd font", "iosevka", "narrow"]
summary = "Tall, thin and tight: more columns on the same screen, and the icons your prompt wants."
# Nerd Fonts' and the font's own words aren't under a licence that allows copying them without
# their notice, so this is ours.
description = """\
Iosevka is a narrow monospaced font for code and terminals, so more columns fit across the \
screen, with programming ligatures and many weights, in Nerd Fonts' build: the same letters with \
thousands of icons patched in (Powerline's arrows, Font Awesome, Devicons, Material Design and \
more), which shell prompts, file managers and status lines draw with. Its families are named \
Iosevka Nerd Font, Mono and Propo."""
description_from = "kubaos"
# Colloid's font icon, the system's icon theme (home/curated.nix), as a font has none of its own.
icon = "fonts"

[[action]]
name = "Install Iosevka Nerd Font"
kind = "nix"
packages = ["nerd-fonts.iosevka"]
