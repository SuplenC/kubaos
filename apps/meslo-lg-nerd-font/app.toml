# Meslo LG Nerd Font from nixpkgs, through the User flake: nerd-fonts.meslo-lg, Nerd Fonts 3.4.0 of
# Meslo LG 1.21, where Nerd Fonts is at 3.5.1. Ubuntu's archive has no Nerd Font. The home's switch
# puts it in the profile's fonts, ~/.nix-profile/share/fonts, which fontconfig reads for every app,
# apt's and Nix's, and builds the profile's font cache with it, so the cache is up to date as it
# lands and as it goes. Its fonts are under the SIL Open Font License 1.1, Nerd Fonts' patcher
# under MIT.
# https://search.nixos.org/packages?show=nerd-fonts.meslo-lg
name = "Meslo LG Nerd Font"
category = "system"
tags = ["font", "monospace", "terminal", "nerd font", "meslo", "powerlevel10k"]
summary = "Apple's Menlo, tweaked and stuffed with icons. The font every prompt theme tells you to install."
# Nerd Fonts' and the font's own words aren't under a licence that allows copying them without
# their notice, so this is ours.
description = """\
Meslo LG is a monospaced font built on Apple's Menlo, itself from Bitstream Vera, with three line \
spacings (S, M and L) and a dotted or slashed zero, in Nerd Fonts' build: the same letters with \
thousands of icons patched in (Powerline's arrows, Font Awesome, Devicons, Material Design and \
more), which shell prompts, file managers and status lines draw with. Its families are named \
MesloLGS, MesloLGM and MesloLGL Nerd Font, with DZ for the dotted zero."""
description_from = "kubaos"
# Colloid's font icon, the system's icon theme (home/curated.nix), as a font has none of its own.
icon = "fonts"

[[action]]
name = "Install Meslo LG Nerd Font"
kind = "nix"
packages = ["nerd-fonts.meslo-lg"]
