# Zoom from nixpkgs, through the User flake. Zoom's own .deb is served unversioned and without a
# published checksum, from no apt repository, so it can't be pinned. nixpkgs builds it for amd64
# alone on Linux, and marks it unfree.
# https://search.nixos.org/packages?show=zoom-us
name = "Zoom"
category = "communication"
tags = ["meetings", "video calls", "conferencing", "webinars", "screen sharing", "work"]
summary = "Video meetings. You're on mute, Dave. You've been on mute for ten minutes."
# From its AppStream metainfo, CC0-1.0 (flathub/us.zoom.Zoom), its first line without the
# "Award winning".
description = """\
Zoom brings video conferencing, online meetings, and group messaging into one easy-to-use \
application."""
description_from = "https://github.com/flathub/us.zoom.Zoom/blob/master/us.zoom.Zoom.appdata.xml"
# Colloid's, the system's icon theme (home/curated.nix), named as Zoom's own desktop entry names
# it, so the Command menu shows it before the package is installed.
icon = "Zoom"
keeps = """\
Your sign-in and Zoom's settings stay in ~/.zoom and ~/.config/zoomus.conf: install Zoom again \
and you're still signed in."""

[[action]]
name = "Install Zoom"
kind = "nix"
arch = "amd64"
unfree = true
packages = ["zoom-us"]

# Zoom ships Qt's Wayland plugin, but its launcher starts it on XWayland unless its own settings
# file says `xwayland=false` under `[General]`: ZoomLauncher reads the key as a boolean that is
# true when it is missing. Zoom rewrites the whole file as it runs, so the step finds its key by
# section and name, wherever it stands. Screen capture on Wayland is Zoom's own setting.
# https://wiki.archlinux.org/title/Zoom_Meetings#Running_on_Wayland_without_Xwayland
[[action]]
name = "Start Zoom on Wayland"
kind = "setting"
file = "~/.config/zoomus.conf"
section = "General"
key = "xwayland"
value = false
