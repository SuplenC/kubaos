# Codex CLI from nixpkgs, through the User flake. OpenAI keeps no apt repository and Ubuntu
# doesn't package it.
# https://github.com/openai/codex
name = "Codex CLI"
category = "ai"
tags = ["coding agent", "openai", "codex", "terminal"]
summary = "OpenAI's Codex in your terminal. It writes the diff, you read it. Actually read it."
# Its README is under the Apache-2.0 licence, which asks for its notice with every copy, so this
# is ours.
description = """\
Codex CLI is OpenAI's coding agent for the terminal. Started in a project, it reads the code, \
edits files and runs commands in a sandbox, asking before it goes beyond what it has been \
allowed. It signs in with a ChatGPT plan or works with an OpenAI API key."""
description_from = "kubaos"
# Colloid's OpenAI icon, the system's icon theme (home/curated.nix).
icon = "openai"
keeps = """\
Your sign-in, settings and past sessions stay in ~/.codex: install Codex again and you're still \
signed in."""

[[action]]
name = "Install Codex CLI"
kind = "nix"
packages = ["codex"]
