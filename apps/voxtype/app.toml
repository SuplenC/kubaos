# Voxtype from nixpkgs, through the User flake. Its project's .deb isn't in an apt repository and
# Ubuntu doesn't package it. nixpkgs' wrapper brings the tools it types and pastes with (wtype,
# dotool, wl-clipboard), and its x86-64 build targets x86-64-v3, so it needs AVX2 there.
# Its user service is ours, upstream's unit from `voxtype setup systemd` (src/setup/systemd.rs at
# v0.7.2) with ExecStart on the profile's wrapper: upstream's points at the unwrapped store path,
# which loses the wrapper's PATH and breaks after a garbage collection. It is installed, not
# enabled; the speech model, enabling it and the key are left to the user.
# https://github.com/peteonrails/voxtype
name = "Voxtype"
category = "ai"
tags = ["dictation", "speech to text", "voice", "whisper", "offline", "push to talk"]
summary = "Hold a key, talk, and it types what you said. Runs on your machine, so your mumbling stays here."
# KubaOS's text: its first paragraph is from Voxtype's README (its opening lines, without its
# benchmark and the default key it no longer turns on), MIT, Copyright (c) 2025 Peter Jackson
# (github.com/peteonrails/voxtype), and the rest is ours, so the description is credited to KubaOS.
description = """\
Voice-to-text for Linux. Local by default. Hold a hotkey while speaking, release to transcribe \
and output the text at your cursor position. No cloud, no subscription, no telemetry.

What's left is yours. `voxtype setup --download` fetches its speech model (base.en, 142 MB), and \
`systemctl --user enable --now voxtype` starts its service, now and at every login. Then a key, \
in ~/.config/kubaos/desktop/hypr/hyprland.lua, which records while you hold it:

hl.bind("SUPER + CTRL + D", hl.dsp.exec_cmd("voxtype record start"), { description = "Dictate" })
hl.bind("SUPER + CTRL + D", hl.dsp.exec_cmd("voxtype record stop"), { release = true, description = "Stop dictating" })

and `hyprctl reload`. If letting go of a modifier first leaves it recording, bind one press to \
`voxtype record toggle` instead: press to start, press again to stop. On an x86-64 machine it \
needs a CPU with AVX2 (x86-64-v3)."""
description_from = "kubaos"
icon = "voxtype.svg"
keeps = """\
What Voxtype made is yours and stays: its models in ~/.local/share/voxtype/models and its \
settings in ~/.config/voxtype. Install Voxtype again and they're all there."""

[[action]]
name = "Install Voxtype"
kind = "nix"
packages = ["voxtype"]

[[action]]
name = "Put Voxtype's service in place"
kind = "file"
to = "~/.config/systemd/user/voxtype.service"
from = "voxtype.service"
