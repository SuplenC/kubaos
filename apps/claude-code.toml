# Claude Code from Anthropic's signed apt repository, the stable channel, whose key
# system/packages.toml pins ([repo.claude-code]).
# https://code.claude.com/docs/en/setup#install-with-linux-package-managers
name = "Claude Code"
summary = "Anthropic's coding agent, in the terminal"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "claude"

[apt]
repo = "claude-code"
packages = ["claude-code"]
