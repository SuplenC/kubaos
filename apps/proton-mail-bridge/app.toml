# Proton Mail Bridge from the .deb Proton publishes, pinned to its sha256, which matched the
# package after its detached signature (protonmail-bridge_<version>_amd64.deb.sig) checked out
# against Proton's Bridge key, D51E64D3E63EDC3EEF7864CEE2C75D68E6234B07. Proton keeps no apt
# repository and builds no arm64 .deb; nixpkgs' Bridge is releases behind, with its updater off,
# and Proton refuses a Bridge that's too old. Bridge updates itself: it downloads each release into
# ~/.local/share/protonmail/bridge-v3/updates and its launcher starts the newest, so the pin is
# where an install starts.
# https://proton.me/download/current_version_linux.json
name = "Proton Mail Bridge"
category = "communication"
tags = ["email", "proton", "imap", "smtp", "encrypted"]
summary = "Proton Mail in any mail app over IMAP and SMTP. Paid plans only, naturally."
# From its AppStream metainfo, CC0-1.0 (flathub/ch.protonmail.protonmail-bridge).
description = """\
The Proton Mail Bridge is an application for paid users that runs on your computer in the \
background and seamlessly encrypts and decrypts your mail as it enters and leaves your computer. \
It allows for full integration of your Proton Mail account with any program that supports IMAP \
and SMTP such as Microsoft Outlook, Mozilla Thunderbird and Apple Mail."""
description_from = "https://github.com/flathub/ch.protonmail.protonmail-bridge/blob/master/ch.protonmail.protonmail-bridge.metainfo.xml"
# Colloid's, the system's icon theme (home/curated.nix), so the Command menu shows it before the
# package is installed.
icon = "protonmail-bridge"
keeps = """\
Your Bridge sign-in, its mail cache and the updates it downloaded itself stay in \
~/.config/protonmail and ~/.local/share/protonmail, and its passwords in your keyring: install \
Bridge again and it's still signed in."""

[[action]]
name = "Install Proton Mail Bridge"
kind = "deb"
package = "protonmail-bridge"
version = "3.27.2-1"
self_updates = true
amd64 = { url = "https://proton.me/download/bridge/protonmail-bridge_3.27.2-1_amd64.deb", sha256 = "cf08332dcc4a332c3592476855e2007e6daadbcdac11fab6af83470a3255a8dc" }
