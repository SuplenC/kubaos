# The Minecraft Launcher from Mojang's tarball, pinned to its sha256. Mojang keeps no apt
# repository and publishes no checksum, and its .deb can't be installed on Ubuntu 26.04: it asks
# for libgdk-pixbuf2.0-0, a name the archive no longer has. The tarball is the same program,
# 2.1.3 (the .deb's version, byte for byte). Its address is an exception to the catalog's
# versioned ones, as Mojang publishes no versioned URL: the same address serves each release, and
# the sha256 pin makes that fail safe. When Mojang replaces the file, the download refuses it and
# the install stops, until a release of KubaOS moves the pin; it can never install another file.
# nixpkgs dropped its Minecraft as broken. Mojang builds it for amd64 only. The program is a
# bootstrap: it downloads the launcher itself, a Chromium app, into ~/.minecraft and keeps it up
# to date, and the Java each Minecraft version asks for, so the first step installs what Mojang's
# .deb names for them, by Ubuntu 26.04's names, without Java, lsb-base and wget, which it doesn't
# use. The desktop entry is ours, as Mojang's package writes it, its Exec the version's program.
# https://www.minecraft.net/en-us/download
name = "Minecraft Launcher"
category = "games"
tags = ["games", "minecraft", "mojang", "java edition", "launcher"]
summary = "Mojang's own launcher for Minecraft: Java Edition. Sign in, punch a tree, lose a weekend."
# Mojang's own words aren't under a licence that allows copying them, so this is ours.
description = """\
The Minecraft Launcher is Mojang's official launcher for Minecraft: Java Edition. It signs in \
with your Microsoft account, downloads and updates the game and the Java it runs on, and keeps \
your installations, each a version of the game with its own folder, settings and mods."""
description_from = "kubaos"
# Colloid's, the system's icon theme (home/curated.nix), the name Mojang's own entry gives, so the
# Command menu shows it before the launcher is there.
icon = "minecraft-launcher"
keeps = """\
Your worlds, settings, resource packs and the launcher Mojang downloaded stay in ~/.minecraft, \
with your sign-in: install the Minecraft Launcher again and they're all there."""

[[action]]
name = "Install the libraries Mojang's launcher runs on"
kind = "apt"
arch = "amd64"
packages = [
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libatspi2.0-0t64",
  "libbz2-1.0",
  "libcairo2",
  "libcups2t64",
  "libcurl4t64",
  "libdbus-1-3",
  "libdrm2",
  "libexpat1",
  "libfontconfig1",
  "libgbm1",
  "libgdk-pixbuf-2.0-0",
  "libglib2.0-0t64",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libuuid1",
  "libx11-6",
  "libx11-xcb1",
  "libxcb-dri3-0",
  "libxcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "xdg-utils",
]

[[action]]
name = "Download the Minecraft Launcher"
kind = "download"
to = "~/.local/opt/minecraft-launcher/@VERSION@"
version = "2.1.3"
unpack = "tar-gz"
strip = 1
amd64 = { url = "https://launcher.mojang.com/download/Minecraft.tar.gz", sha256 = "695269281547bbbcf47fe74633027a0e4ddc13a61060c686a7217e85d314e45e" }

[[action]]
name = "Put the Minecraft Launcher in the Command menu"
kind = "file"
to = "~/.local/share/applications/minecraft-launcher.desktop"
from = "minecraft-launcher.desktop"
template = true
