# Echo cancellation: PipeWire's echo-cancel module (WebRTC's canceller) in a
# process of its own (home/audio.nix runs `pipewire -c` on this file from the
# kubaos-echo-cancellation unit), so turning it on or off never restarts the
# session's PipeWire.
#
# Both of its sides are WirePlumber smart filters: what apps play to the
# default output goes through its sink, which is the signal it removes, and
# what they record from the default input comes out of its source. Each side
# follows the default device, so picking another one keeps it in place. Noise
# suppression, when it is on too, sits between it and the apps
# (`filter.smart.after`), as the canceller needs the raw microphone.
#
# https://docs.pipewire.org/page_module_echo_cancel.html
# https://pipewire.pages.freedesktop.org/wireplumber/policies/smart_filters.html

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.description = "Echo cancellation"
            # Passive: the microphone runs only while an app records from
            # the source, not for as long as the filter is on.
            capture.props = {
                node.name    = "kubaos.echo-cancellation.capture"
                node.passive = true
            }
            source.props = {
                node.name = "kubaos.echo-cancellation"
                node.description = "Echo cancellation"
                filter.smart = true
                filter.smart.name = "kubaos.echo-cancellation"
                filter.smart.after = [ "kubaos.noise-suppression" ]
            }
            sink.props = {
                node.name = "kubaos.echo-cancellation.sink"
                node.description = "Echo cancellation"
                filter.smart = true
                filter.smart.name = "kubaos.echo-cancellation.sink"
            }
            playback.props = {
                node.name = "kubaos.echo-cancellation.playback"
            }
        }
    }
]
