# Noise suppression: RNNoise on the microphone, as a PipeWire filter-chain in
# a process of its own (home/audio.nix runs `pipewire -c` on this file from
# the kubaos-noise-suppression unit), so turning it on or off never restarts
# the session's PipeWire.
#
# It is a WirePlumber smart filter: apps recording from the default input are
# linked through it, and it captures from whichever microphone is the default,
# so picking another microphone keeps it in front. Echo cancellation, when it
# is on too, sits between it and the microphone (`filter.smart.before`), as
# the canceller needs the raw signal to find the echo in.
#
# https://docs.pipewire.org/page_module_filter_chain.html
# https://pipewire.pages.freedesktop.org/wireplumber/policies/smart_filters.html
# https://github.com/werman/noise-suppression-for-voice

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Noise suppression"
            media.name       = "Noise suppression"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "@rnnoise@/lib/ladspa/librnnoise_ladspa.so"
                        # One channel: a voice needs no more, and RNNoise's
                        # cost is per channel.
                        label  = noise_suppressor_mono
                        control = {
                            # The plugin's defaults, but the grace period: 200 ms
                            # keeps the ends of words that trail off quietly.
                            "VAD Threshold (%)" = 50.0
                            "VAD Grace Period (ms)" = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            # RNNoise's model is trained on 48 kHz audio and takes no other rate.
            audio.rate = 48000
            audio.position = [ MONO ]
            # Passive: the microphone runs only while an app records from
            # the filter, not for as long as the filter is on.
            capture.props = {
                node.name    = "kubaos.noise-suppression.capture"
                node.passive = true
            }
            playback.props = {
                node.name  = "kubaos.noise-suppression"
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = "kubaos.noise-suppression"
                filter.smart.before = [ "kubaos.echo-cancellation" ]
            }
        }
    }
]
