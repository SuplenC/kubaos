[package]
name = "kubaos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
kubaos-phone.workspace = true
kubaos-user-layer.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit = "0.25"
thiserror.workspace = true

[features]
# The test Suite (`suites::catalog::TEST`), for the test harness's `kubaos` build.
test-suite = []
# The tests' wall around the processes they start (`sandbox`), for other crates' tests.
sandbox = []

[dev-dependencies]
kubaos-phone = { workspace = true, features = ["fake"] }
# Its own sandbox, for its tests under `tests/`.
kubaos-core = { path = ".", features = ["sandbox"] }

[lints]
workspace = true
