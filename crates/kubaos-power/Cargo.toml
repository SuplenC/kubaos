[package]
name = "kubaos-power"
description = "KubaOS's power stops: Super Saver to Max Performance on top of power-profiles-daemon, the charge limit and the low-battery drop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-power"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
kubaos-user-layer.workspace = true
# The service's log, on stderr, which the journal keeps with each line's priority.
log = "0.4"
# Lowers background work's priority (`setpriority`) without `unsafe`.
rustix = { version = "1", features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Writes the settings file in place, keeping the user's comments, as kubaos-idle does.
toml_edit = "0.25"
# Follows power-profiles-daemon and UPower on the system bus. The blocking API keeps the service
# a plain loop of threads and a channel.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
