[package]
name = "kubaos-power"
description = "KubaOS's power stops: Super Saver to Max Performance on top of power-profiles-daemon, the charge limit and the low-battery drop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-power"
path = "src/main.rs"

[dependencies]
kubaos-user-layer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Writes the settings file in place, keeping the user's comments, as kubaos-idle does.
toml_edit = "0.25"
# Follows power-profiles-daemon and UPower on the system bus. The blocking API keeps the service
# a plain loop of threads and a channel.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
