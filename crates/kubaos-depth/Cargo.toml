[package]
name = "kubaos-depth"
description = "KubaOS's wallpaper depth: a picture's foreground cut-out, and the lock clock's place and tint on it"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-depth"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
# ONNX Runtime, loaded when the models are (src/models.rs): nixpkgs' onnxruntime 1.24, so its API 24.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "load-dynamic"] }
# The run's low priority, as a safe call.
rustix = { version = "1", features = ["process"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
