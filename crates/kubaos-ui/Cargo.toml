[package]
name = "kubaos-ui"
description = "KubaOS's iced components: the design tokens, layout on the 4 px grid and the closed component set"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kubaos-geometry.workspace = true
# Kōbō's iced and features: svg for KubaOS Symbols, image for `Media`'s pictures, canvas for the
# switch and the spinner, advanced for the focus tube's and the grid's own widgets, and crisp,
# which snaps quads to device pixels in the wgpu renderer. winit needs a windowing feature to build
# at all.
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "x11",
  "wayland",
  "canvas",
  "svg",
  "image",
  "advanced",
] }

[dev-dependencies]
# Lays views out headlessly, so the layout primitives' boxes can be measured.
iced_test = "0.14"
# Runs an operation over a laid-out view, so the probes' tree can be read.
iced_runtime = "0.14"

# The tokens module, written from design/tokens.toml by build.rs.
[build-dependencies]
kubaos-tokens.workspace = true

[lints]
workspace = true
