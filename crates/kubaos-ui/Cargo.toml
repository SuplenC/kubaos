[package]
name = "kubaos-ui"
description = "KubaOS's iced components: the design tokens, layout on the 4 px grid and the closed component set"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kubaos-geometry.workspace = true
# Kōbō's iced and features, less the image widget it draws its wallpaper with: svg for KubaOS
# Symbols, canvas for the switch and the spinner, advanced for the focus ring's and the grid's own
# widgets, and crisp, which snaps quads to device pixels in the wgpu renderer. winit needs a
# windowing feature to build at all.
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "x11",
  "wayland",
  "canvas",
  "svg",
  "advanced",
] }

[dev-dependencies]
# Lays views out headlessly, so the layout primitives' boxes can be measured.
iced_test = "0.14"

[lints]
workspace = true
