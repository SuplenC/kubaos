[package]
name = "kubaos-bluetooth"
description = "KubaOS's Bluetooth pairing agent, and the pairing and scanning the shell asks it for"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-bluetooth"
path = "src/main.rs"

[dependencies]
# The agent serves calls from bluetoothd while it waits on the shell, and answers some of them
# with an error (`org.bluez.Error.Rejected`), which `kotodama_extension::dbus` can't send. zbus
# on async-io, the smallest runtime it runs on; the async crates below are the ones it already
# pulls in, for the agent's waits and timeouts.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
async-io = "2"
futures-lite = "2"
kotodama-extension.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
