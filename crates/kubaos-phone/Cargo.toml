[package]
name = "kubaos-phone"
description = "KubaOS's phone link: KDE Connect, running only once the user sets up a phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-phone"
path = "src/main.rs"

[dependencies]
# kdeconnectd is reached through busctl, a few calls a command: no D-Bus library, no async runtime.
kubaos-user-layer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The stand-in for KDE Connect, for the tests of the crates that drive the phone link.
fake = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
