# Public holidays the clock popup and the menu know, offline, as rules that
# work for any year. `kubaos-clock` embeds this file; a country or a rule of
# your own goes in ~/.config/kubaos/desktop/clock/holidays.toml, in the same shape,
# and a country there replaces the one here whole.
#
# A table a country, by its ISO 3166 code in lowercase. Each day is one of:
#   date = "MM-DD"                        a fixed date
#   easter = N                            N days after Western Easter Sunday
#   month = M, weekday = "monday", nth = N   the Nth weekday of the month; a
#                                         negative N counts from the end
# and may take `from` and `until` (years, both counted), and `observed`:
#   "nearest"     a Saturday is kept on the Friday, a Sunday on the Monday
#   "substitute"  on a weekend, the next weekday not already a holiday is
#                 one too (a "substitute day")
#   "saturday"    a Sunday is kept on the Saturday before
#
# National holidays only: regional ones (a German state's, a Spanish
# region's) are left out, as are one-off days a government adds for a year.

[at]
name = "Austria"
days = [
  { name = "New Year's Day", date = "01-01" },
  { name = "Epiphany", date = "01-06" },
  { name = "Easter Monday", easter = 1 },
  { name = "Labour Day", date = "05-01" },
  { name = "Ascension Day", easter = 39 },
  { name = "Whit Monday", easter = 50 },
  { name = "Corpus Christi", easter = 60 },
  { name = "Assumption Day", date = "08-15" },
  { name = "National Day", date = "10-26" },
  { name = "All Saints' Day", date = "11-01" },
  { name = "Immaculate Conception", date = "12-08" },
  { name = "Christmas Day", date = "12-25" },
  { name = "St. Stephen's Day", date = "12-26" },
]

