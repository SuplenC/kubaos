[package]
name = "kubaos-kobo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kobo"
path = "src/main.rs"

[dependencies]
kubaos-core.workspace = true
kubaos-ui.workspace = true
serde_json.workspace = true
toml.workspace = true
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
# Kōbō's own warnings, written to stderr by the logger in `src/main.rs`.
log = "0.4"
# kubaos-ui's iced and features, so the two share one build, plus image for
# the wallpaper, the neon sign and the wallpaper thumbnails. Default features
# minus linux-theme-detection: there is no D-Bus on the live ISO.
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "x11",
  "wayland",
  "image",
  "canvas",
  "svg",
  "advanced",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Rasterises the done screen's hanko once, from its outline. iced's tiny-skia renderer already
# builds it, with these features.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# Lays views out headlessly, so widget sizes can be tested.
iced_test = "0.14"
# Draws the screens without a window, at any scale, for the screenshots and the geometry check.
iced_runtime = "0.14"
kubaos-geometry.workspace = true
tempfile.workspace = true

# The neon sign's tokens (src/done/neon.rs), written from design/tokens.toml by build.rs.
[build-dependencies]
kubaos-tokens.workspace = true

[lints]
workspace = true
