[package]
name = "kubaos-kobo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kobo"
path = "src/main.rs"

[dependencies]
kubaos-core.workspace = true
serde_json.workspace = true
toml.workspace = true
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
# Default features minus linux-theme-detection (no D-Bus on the live ISO),
# plus image (wallpaper), canvas (spinner, switch), svg (logo) and advanced
# (the text field is its own widget, see src/field.rs).
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "x11",
  "wayland",
  "image",
  "canvas",
  "svg",
  "advanced",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# Lays views out headlessly, so widget sizes can be tested.
iced_test = "0.14"
