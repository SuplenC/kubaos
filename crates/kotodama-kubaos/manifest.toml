# The KubaOS Extension of the Command menu. The package (package.nix)
# installs this directory as `share/kotodama/extensions/kubaos/`, with the
# `kotodama-kubaos` binary next to this file.
name = "kubaos"
description = "Wallpapers, screenshots, panels, Wi-Fi, sound and keyboard layouts. Every knob I've got"
command = ["./kotodama-kubaos"]
word = "kubaos"
title = "KubaOS"
icon = "preferences-system"
about = "KubaOS's own actions, the keyboard layouts, and Wi-Fi, Bluetooth, audio, brightness and power profiles, which work with the shell down. Date queries such as `days until christmas` are answered with the clock popup's holidays and zones. `cpu`, `ram` and `battery` are answered from the system monitor, and `kill chrome` or `end slack` finds the processes to stop, each stop confirmed first. Add your own actions and hide these in ~/.config/kubaos/menu/kotodama/user.toml."
examples = [
    { query = "wifi", result = "Turn Wi-Fi on or off" },
    { query = "volume 40", result = "Set the volume to 40%" },
    { query = "next wallpaper", result = "The next wallpaper, and its colors" },
    { query = "days until christmas", result = "The days left, as the clock popup counts them" },
    { query = "ram", result = "How full the memory is, and what holds it" },
    { query = "kill chrome", result = "End or kill every chrome process, once you confirm" },
]

# Date queries, answered by the clock popup's engine (kubaos-clock) with the
# popup's holidays and zones, and the system monitor's (kubaos-sysmon) answers
# and process search. Every keystroke is sent at once: an answer must land in
# the same frame, and only a debounce of 0 may mark one. Each trigger is a way
# one of those queries starts; the Extension answers nothing else.
[live_query]
triggers = [
    # The monitor: `cpu`, `ram`, `memory`, `battery`.
    '(?i)^\s*(cpu|ram|memory|battery)\s*$',
    # Processes to stop: `kill chrome`, `end slack`.
    '(?i)^\s*(kill|end)\s+\S',
    # A number: `24 dec`, `2027-03-01`, `15:00 tokyo`, `9am NY in Warsaw`.
    '^\s*[0-9]',
    # Counting and asking: `days until christmas`, `how long until friday 17:00`, `age 1993-05-12`.
    '(?i)^\s*(days?|weeks?|how\s+(many|long|old)|age|born|when\s+(is|was)|time\s+in)\s',
    # A day: `today + 90d`, `now + 36h`, `next friday`, `in 3 weeks`, `christmas eve`.
    '(?i)^\s*(today|tomorrow|yesterday|now|next|last|this|in\s+[0-9a]|christmas|easter|new\s+year)',
    # A weekday or a month first: `friday 17:00 - 3h`, `mar 12 to jul 4`, `dec 24`.
    '(?i)^\s*(mon|tue|wed|thu|fri|sat|sun|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s',
    # A place's time: `tokyo time`, `new york now`.
    '(?i)\s(time|now)\s*$',
]
debounce_ms = 0
