[package]
name = "kubaos-automount"
description = "KubaOS's automount: removable drives mounted as they're plugged in, ejected from the menu, and photos imported from cameras and cards"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-automount"
path = "src/main.rs"

[dependencies]
# udisks2 on the system bus and notifications on the session one, both followed for signals at
# once: zbus on async-io, the runtime kubaos-bluetooth already builds it with.
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
futures-lite = "2"
# The photo import's capture dates. Pure Rust; reads JPEG, HEIF, PNG, WebP and TIFF-based raws.
kamadak-exif = "0.6"
kotodama-extension.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
