[package]
name = "kubaos-sysmon"
description = "KubaOS's system monitor: CPU, memory, GPU, disks, network, power, fans and processes from /proc and /sys"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos-sysmon"
path = "src/main.rs"

[dependencies]
kubaos-user-layer.workspace = true
# Signals, disk space and the page size, as safe calls: the monitor spawns no process to read or
# to end one.
rustix = { version = "1", features = ["fs", "param", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Writes the settings file in place, keeping the user's comments.
toml_edit = "0.25"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
