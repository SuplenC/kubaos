[package]
name = "kubaos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos"
path = "src/main.rs"

[features]
# The test Suite, for the test harness (test/run builds the CLI with it).
test-suite = ["kubaos-core/test-suite"]

[dependencies]
kubaos-core.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
