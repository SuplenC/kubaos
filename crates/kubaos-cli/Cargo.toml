[package]
name = "kubaos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubaos"
path = "src/main.rs"

[features]
# The test Suite, for the test harness (test/run builds the CLI with it).
test-suite = ["kubaos-core/test-suite"]

[dependencies]
kubaos-core.workspace = true
kubaos-cursor.workspace = true
kubaos-user-layer.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
# `termios` for the terminal's width, which the update's live view cuts its lines to.
rustix = { version = "1", features = ["process", "fs", "termios"] }
signal-hook = "0.3"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
