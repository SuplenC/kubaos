# KubaOS's apt packages, by group. The system scripts install their groups
# from here (`group_install` in `system/manifest.sh`), and every `kubaos
# update` installs what an active group lists and the machine lacks, so a
# package added here reaches every machine with no migration. A package
# dropped from every group is removed by the next update, but only when
# KubaOS installed it (`/var/lib/kubaos/apt-installed`) and nothing else on
# the machine needs it. `kubaos packages status` shows how the machine
# compares; docs/CONTRACTS.md, "The package manifest", has the whole contract.
#
# A [group.<name>] takes:
#   summary   what the group is for, as `kubaos packages status` shows it
#   packages  the apt packages, installed with --no-install-recommends
#   arch      "amd64": only on that architecture
#   repo      the [repo.<name>] its packages come from
#   hold      true: apt-mark hold, so apt never moves them
#   if_available  true: a package without an install candidate is skipped
#   optional  "on" or "off": the user can turn the group off or on
#             (`kubaos packages enable|disable`, or the scripts' flags), and
#             this is what it is until they do
#   when_on, when_off  the script, with its arguments, that sets up or takes
#             down what the group needs beyond its packages, when the user
#             turns it on or off
#
# A [repo.<name>] is a vendor's apt repository, for a group's packages or an
# app of the catalog's (apps/<id>/app.toml). Its sources file is
# `system/files/apt/sources.list.d/<name>.sources` (`@ARCH@` becomes the
# machine's architecture), signed by the key at `key_url`, which must have
# exactly the primary key `fingerprint`, stored in `keyring`. A repository whose
# vendor is moving to a new key also pins that one, with `next_key_url`,
# `next_fingerprint` and `next_keyring`, and its sources file names both keyrings.
#
# Keep to this much TOML: tables, strings without escapes, true and false,
# and arrays of strings. The scripts read it with awk.

# ---------------------------------------------------------------------------
# Vendor repositories

# Docker's repository, for the app of the catalog (apps/docker/).
[repo.docker]
key_url = "https://download.docker.com/linux/ubuntu/gpg"
fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
keyring = "/etc/apt/keyrings/docker.gpg"

# Google's repository, for the app of the catalog (apps/google-chrome/).
# Chrome's own postinst writes google-chrome.sources with exactly this key
# path and URI; the same values mean it won't fight the file.
[repo.google-chrome]
key_url = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprint = "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"
keyring = "/usr/share/keyrings/google-chrome.gpg"

# Anthropic's repository of Claude Code, the stable channel, for the app of the
# catalog (apps/claude-code/). Anthropic's own instructions write
# claude-code.list, signed by claude-code.asc; repo setup turns that line off
# for this source (disable_other_sources in system/lib.sh).
[repo.claude-code]
key_url = "https://downloads.claude.ai/keys/claude-code.asc"
fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
keyring = "/etc/apt/keyrings/claude-code.gpg"

# Mozilla's repository of Firefox, for the app of the catalog (apps/firefox/).
# Mozilla's own instructions write mozilla.list; repo setup turns that line off.
[repo.mozilla]
key_url = "https://packages.mozilla.org/apt/repo-signing-key.gpg"
fingerprint = "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3"
keyring = "/etc/apt/keyrings/mozilla.gpg"

# Microsoft's repository of Edge, for the app of the catalog
# (apps/microsoft-edge/). Edge's own postinst rewrites microsoft-edge.sources on
# every upgrade; ours is byte-identical to what it writes, its doubled
# Architectures line included, so the two never fight over the file. The postinst
# writes its own copy of the key at the same keyring path, which matches the
# pinned one by fingerprint, not byte for byte, so repo setup keeps it. Built for
# amd64 only.
[repo.microsoft-edge]
key_url = "https://packages.microsoft.com/keys/microsoft.asc"
fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"
keyring = "/usr/share/keyrings/microsoft-edge.gpg"

# Vivaldi's repository, for the app of the catalog (apps/vivaldi/). Built for
# amd64 only. Its key (16BD9233) expires on 2027-02-07; Vivaldi's postinst
# already puts its next one (5220E3E9, until 2028-02-15) at the next keyring's
# path. Our vivaldi.sources names both keyrings, and differs from Vivaldi's own
# only in that line, until Vivaldi's postinst rewrites it: every install and
# upgrade of vivaldi-stable writes the file again, naming the one key that build
# signs with (16BD9233 today), and /etc/default/vivaldi's repo_add_once doesn't
# stop it once the file exists. Once Vivaldi rotates, its postinst writes the
# new key itself; KubaOS's repo setup always writes both, never the expired key
# alone. Vivaldi publishes the next key only inside its .deb: the fingerprint is
# the one its postinst carries, fetched from Ubuntu's key server.
[repo.vivaldi]
key_url = "https://repo.vivaldi.com/archive/linux_signing_key.pub"
fingerprint = "8D1FA52AEF58A09D889DD4221256C34716BD9233"
keyring = "/usr/share/keyrings/vivaldi-16BD9233.gpg"
next_key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x7C7CB2D56F7D2A950BCCAB4EBCE0DE545220E3E9"
next_fingerprint = "7C7CB2D56F7D2A950BCCAB4EBCE0DE545220E3E9"
next_keyring = "/usr/share/keyrings/vivaldi-5220E3E9.gpg"

# LibreWolf's repository, for the app of the catalog (apps/librewolf/).
[repo.librewolf]
key_url = "https://repo.librewolf.net/pubkey.gpg"
fingerprint = "662E3CDD6FE329002D0CA5BB40339DD82B12EF16"
keyring = "/etc/apt/keyrings/librewolf.gpg"

# Anthropic's repository of Claude Desktop, for the app of the catalog
# (apps/claude-desktop/), signed by the same key as Claude Code's. Claude
# Desktop's postinst writes claude-desktop.list only while no other source has
# the repository, so it leaves this one alone.
[repo.claude-desktop]
key_url = "https://downloads.claude.ai/claude-desktop/key.asc"
fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
keyring = "/etc/apt/keyrings/claude-desktop.gpg"

# Anysphere's repository of Cursor, for the app of the catalog (apps/cursor/).
# Cursor's postinst rewrites cursor.sources on every upgrade, and its postrm
# deletes it and the key; ours is byte-identical to what it writes, at the same
# keyring path, so the two never fight over the file. The postinst writes the
# key only where there is none, so the pinned one stays.
[repo.cursor]
key_url = "https://downloads.cursor.com/keys/anysphere.asc"
fingerprint = "380FF4BCDC34A4BD92A3565342A1772E62E492D6"
keyring = "/usr/share/keyrings/anysphere.gpg"

# Cognition's repository of Devin Desktop, which was Windsurf, for the app of
# the catalog (apps/devin-desktop/). Built for amd64 only. Its package writes
# no source of its own.
[repo.windsurf]
key_url = "https://windsurf-stable.codeiumdata.com/wVxQEIWkwPUEAGf3/windsurf.gpg"
fingerprint = "EE2C46CC44E1578C23135B0E9E608A1B9FD62A3F"
keyring = "/etc/apt/keyrings/windsurf.gpg"

# ppa:cppiber/hyprland, the Launchpad PPA of Constantin Piber.
[repo.cppiber-hyprland]
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0xA54D23B62FF3FCC76EFF71E8FDBAAA1CF0CCF48E"
fingerprint = "A54D23B62FF3FCC76EFF71E8FDBAAA1CF0CCF48E"
keyring = "/etc/apt/keyrings/cppiber-hyprland.gpg"

[repo.tuxedo]
key_url = "https://deb.tuxedocomputers.com/0x54840598.pub.asc"
fingerprint = "E5D0C320BBCE8D21CDF60DD5120ED28D54840598"
keyring = "/etc/apt/keyrings/tuxedo.gpg"

# ---------------------------------------------------------------------------
# The base system (system/20-base.sh)

# openssh-client is for git over SSH: on a minimized server only cloud-init
# pulled it in, and 10-strip.sh purges that.
[group.tools]
summary = "What the system scripts themselves use"
packages = ["ca-certificates", "curl", "gnupg", "unzip", "file", "git", "openssh-client"]

[group.network]
summary = "NetworkManager and Wi-Fi"
packages = ["network-manager", "wpasupplicant", "iw"]

# NetworkManager's OpenVPN plugin runs an OpenVPN VPN (it pulls in openvpn),
# wg reads a WireGuard VPN's last handshake, nft holds the kill switch,
# openssl checks the company CA before it reaches the trust store
# (crates/kubaos-proxy).
[group.proxy]
summary = "The Proxy's OpenVPN plugin, VPN status, kill switch and certificate check"
packages = ["network-manager-openvpn", "wireguard-tools", "nftables", "openssl"]

[group.audio]
summary = "PipeWire and Bluetooth"
packages = [
  "pipewire", "pipewire-pulse", "pipewire-alsa", "pipewire-audio", "wireplumber",
  "libspa-0.2-bluetooth", "bluez", "rtkit",
]

# zenity is how apps ask a question when they can't draw a window of their
# own: Chrome's profile-in-use prompt, Steam, Wine, scripts. Without it they
# exit with only a log line.
[group.session]
summary = "Session plumbing: D-Bus, polkit, XWayland, portals, the keyring, app dialogs"
packages = [
  "dbus-user-session", "xdg-user-dirs", "xdg-utils", "polkitd", "pkexec",
  "xwayland", "qt6-wayland", "qtwayland5",
  "xdg-desktop-portal", "xdg-desktop-portal-gtk",
  "gnome-keyring", "libsecret-1-0", "zenity",
]

# mesa-libgallium carries the VA-API drivers in 26.04; the old
# mesa-va-drivers package no longer exists.
[group.graphics]
summary = "Firmware and Mesa"
packages = [
  "linux-firmware", "firmware-sof-signed",
  "mesa-vulkan-drivers", "mesa-libgallium", "libgl1-mesa-dri", "libegl-mesa0", "vainfo", "mesa-utils",
  "fwupd",
]

[group.microcode]
summary = "AMD CPU microcode"
arch = "amd64"
packages = ["amd64-microcode"]

[group.laptop]
summary = "Laptop hardware: backlight, monitors over DDC, power profiles"
packages = ["brightnessctl", "ddcutil", "upower", "power-profiles-daemon", "pciutils", "usbutils"]

[group.dock]
summary = "USB4 and Thunderbolt docks (bolt)"
packages = ["bolt"]

[group.fingerprint]
summary = "The fingerprint reader (fprintd)"
packages = ["fprintd", "libpam-fprintd"]

# systemd-oomd kills what has stalled the user's services and apps on memory
# before the kernel's OOM killer would, with Ubuntu's defaults. The
# compositor and the shell run in the login session, which it doesn't watch.
[group.memory]
summary = "systemd-oomd, which ends what stalls the machine on memory"
packages = ["systemd-oomd"]

# rustup and proto toolchains need these.
[group.build]
summary = "Build tools"
packages = ["build-essential", "pkg-config", "libssl-dev", "clang", "mold"]

# grub-btrfs is not packaged for resolute; 20-base.sh builds it.
[group.snapshots]
summary = "btrfs and snapper"
packages = ["btrfs-progs", "snapper", "inotify-tools"]

# Nautilus, with Sushi on space and gvfs for phones, network shares and
# admin://; udisks2 is what kubaos-automount talks to. Image and HEIC/AVIF
# thumbnails come from glycin, which 26.04's gdk-pixbuf loads through, and
# libde265 decodes the HEVC inside an iPhone's HEIC. papers and
# gnome-font-viewer bring the PDF and font thumbnailers with the viewers. File
# Roller does the extracting, with 7zip and unar for 7z and RAR, since unrar
# is non-free. python3-nautilus runs the right-click extensions.
[group.files]
summary = "The file manager, its thumbnailers and viewers"
packages = [
  "nautilus", "gnome-sushi", "gvfs-backends", "gvfs-fuse", "udisks2",
  "glycin-thumbnailers", "libheif-plugin-libde265", "ffmpegthumbnailer",
  "papers", "gnome-font-viewer", "file-roller", "7zip", "unar", "python3-nautilus",
  "loupe", "showtime",
]

# The codecs Showtime, Sushi and the thumbnailers play with, all through
# GStreamer, which --no-install-recommends would leave out. libav is FFmpeg's
# decoders. plugins-bad reads MPEG-TS, HLS and DASH and has the parsers the
# hardware decoders need; plugins-extra is Ubuntu's package for `va`, the
# decoders on the GPU; plugins-ugly reads WMV and WMA (ASF). gstreamer1.0-tools
# is `gst-inspect-1.0`, which says what a machine can play. ffmpeg is the
# converter, and what `scripts/dot-theme` cuts a video wallpaper's poster with.
[group.media]
summary = "Video and audio codecs, and ffmpeg"
packages = [
  "gstreamer1.0-plugins-good", "gstreamer1.0-libav", "gstreamer1.0-plugins-bad",
  "gstreamer1.0-plugins-extra", "gstreamer1.0-plugins-ugly", "gstreamer1.0-tools",
  "ffmpeg",
]

[group.fonts]
summary = "Noto fonts"
packages = ["fonts-noto-core", "fonts-noto-ui-core", "fonts-noto-mono", "fonts-noto-color-emoji", "fonts-noto-cjk"]

# They work without Nix and without the shell.
[group.fallback]
summary = "The fallback session's tools, and the runtime helpers of the binds"
packages = ["foot", "fuzzel", "wl-clipboard", "grim", "slurp", "imagemagick", "playerctl", "socat", "qalc", "libnotify-bin"]

# Its config comes from home-manager.
[group.shell]
summary = "The login shell"
packages = ["zsh"]

# ---------------------------------------------------------------------------
# The other scripts

[group.boot]
summary = "The boot splash (system/25-boot.sh)"
packages = ["plymouth", "plymouth-label-ft"]

# DKMS builds tuxedo-drivers; mokutil enrolls its signing key. The kernel
# headers follow the running kernel, so 30-hardware.sh picks them.
[group.tuxedo]
summary = "TUXEDO's drivers (system/30-hardware.sh), set up at first boot"
arch = "amd64"
repo = "tuxedo"
optional = "off"
when_on = ["system/30-hardware.sh", "--only", "tuxedo"]
packages = ["dkms", "mokutil", "tuxedo-drivers", "udev-hid-bpf"]

[group.hyprland]
summary = "Hyprland from ppa:cppiber/hyprland, held (system/50-hyprland.sh)"
arch = "amd64"
repo = "cppiber-hyprland"
hold = true
packages = [
  "hyprland", "hyprland-guiutils", "xdg-desktop-portal-hyprland",
  "hypridle", "hyprlock", "hyprpolkitagent", "hyprpicker",
]

# The PPA has no arm64 builds, so arm64 takes what Ubuntu has, which
# predates the Lua config; the session runs nixpkgs' Hyprland there
# (home/desktop.nix).
[group.hyprland-ubuntu]
summary = "Ubuntu's own Hyprland where the PPA has none, held (system/50-hyprland.sh)"
arch = "arm64"
hold = true
if_available = true
packages = [
  "hyprland", "hyprland-guiutils", "xdg-desktop-portal-hyprland",
  "hypridle", "hyprlock", "hyprpolkitagent", "hyprpicker",
]

[group.accents]
summary = "keyd, for the Mac-style accents on Left Alt (system/50-hyprland.sh)"
packages = ["keyd"]

[group.nix]
summary = "What the Nix installer needs (system/60-nix.sh)"
packages = ["curl", "xz-utils"]

[group.recorder]
summary = "setcap for the screen recorder's helper (system/65-recorder.sh)"
packages = ["libcap2-bin"]

[group.bitwarden]
summary = "Bitwarden's helpers: unzip for bw, secret-tool (system/70-bitwarden.sh)"
packages = ["ca-certificates", "curl", "unzip", "libsecret-tools"]

# pamtester is for docs/SECRETS.md, "Troubleshooting".
[group.u2f]
summary = "A security key for sudo, polkit and the lock screen (system/70-bitwarden.sh)"
optional = "on"
when_on = ["system/70-bitwarden.sh", "--no-cli"]
when_off = ["system/70-bitwarden.sh", "--remove-u2f"]
packages = ["libpam-u2f", "pamu2fcfg", "pamtester"]

# fido2-tools comes from the same libfido2 Ubuntu's pam_u2f uses, so what it
# reports is what PAM sees.
[group.yubikey]
summary = "The YubiKey's FIDO2 tools (system/75-yubikey.sh)"
packages = ["fido2-tools"]

# Socket-activated: pcscd only runs while something talks to a card.
[group.piv]
summary = "PIV, the smart card of the YubiKey Multi-protocol Edition (system/75-yubikey.sh)"
optional = "off"
when_on = ["system/75-yubikey.sh"]
packages = ["pcscd", "pcsc-tools"]

# ---------------------------------------------------------------------------
# The Apps catalog's

# Docker's and Google Chrome's packages are apps of the catalog
# (apps/docker/, apps/google-chrome/), which `kubaos app` adds and
# removes. kubaos leaves a package of the catalog's to it, so these groups
# install and remove nothing, whatever their switch. They are listed, off,
# because an update runs the kubaos it started with, and one from before the
# catalog removes a package it installed that no group lists.
[group.docker]
summary = "Docker, an app of the catalog (kubaos app add docker)"
repo = "docker"
optional = "off"
packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]

[group.chrome]
summary = "Google Chrome, an app of the catalog (kubaos app add google-chrome)"
arch = "amd64"
repo = "google-chrome"
optional = "off"
packages = ["google-chrome-stable"]
