# KubaOS's apt packages, by group. The system scripts install their groups
# from here (`group_install` in `system/manifest.sh`), and every `kubaos
# update` installs what an active group lists and the machine lacks, so a
# package added here reaches every machine with no migration. A package
# dropped from every group is removed by the next update, but only when
# KubaOS installed it (`/var/lib/kubaos/apt-installed`) and nothing else on
# the machine needs it. `kubaos packages status` shows how the machine
# compares; docs/CONTRACTS.md, "The package manifest", has the whole contract.
#
# A [group.<name>] takes:
#   summary   what the group is for, as `kubaos packages status` shows it
#   packages  the apt packages, installed with --no-install-recommends
#   arch      "amd64": only on that architecture
#   repo      the [repo.<name>] its packages come from
#   hold      true: apt-mark hold, so apt never moves them
#   if_available  true: a package without an install candidate is skipped
#   optional  "on" or "off": the user can turn the group off or on
#             (`kubaos packages enable|disable`, or the scripts' flags), and
#             this is what it is until they do
#   when_on, when_off  the script, with its arguments, that sets up or takes
#             down what the group needs beyond its packages, when the user
#             turns it on or off
#
# A [repo.<name>] is a vendor's apt repository, for a group's packages or an
# app of the catalog's (apps/<id>/app.toml). Its sources file is
# `system/files/apt/sources.list.d/<name>.sources` (`@ARCH@` becomes the
# machine's architecture), signed by the key at `key_url`, which must have
# exactly the primary key `fingerprint`, stored in `keyring`. A repository whose
# vendor is moving to a new key also pins that one, with `next_key_url`,
# `next_fingerprint` and `next_keyring`, and its sources file names both keyrings.
#
# Keep to this much TOML: tables, strings without escapes, true and false,
# and arrays of strings. The scripts read it with awk.

# ---------------------------------------------------------------------------
# Vendor repositories

# Docker's repository, for the app of the catalog (apps/docker/).
[repo.docker]
key_url = "https://download.docker.com/linux/ubuntu/gpg"
fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
keyring = "/etc/apt/keyrings/docker.gpg"

# Google's repository, for the app of the catalog (apps/google-chrome/).
# Chrome's own postinst writes google-chrome.sources with exactly this key
# path and URI; the same values mean it won't fight the file.
[repo.google-chrome]
key_url = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprint = "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"
keyring = "/usr/share/keyrings/google-chrome.gpg"

# Anthropic's repository of Claude Code, the stable channel, for the app of the
# catalog (apps/claude-code/). Anthropic's own instructions write
# claude-code.list, signed by claude-code.asc; repo setup turns that line off
# for this source (disable_other_sources in system/lib.sh).
[repo.claude-code]
key_url = "https://downloads.claude.ai/keys/claude-code.asc"
fingerprint = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
keyring = "/etc/apt/keyrings/claude-code.gpg"

# Mozilla's repository of Firefox, for the app of the catalog (apps/firefox/).
# Mozilla's own instructions write mozilla.list; repo setup turns that line off.
[repo.mozilla]
key_url = "https://packages.mozilla.org/apt/repo-signing-key.gpg"
fingerprint = "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3"
keyring = "/etc/apt/keyrings/mozilla.gpg"

# Microsoft's repository of Edge, for the app of the catalog
# (apps/microsoft-edge/). Edge's own postinst rewrites microsoft-edge.sources on
# every upgrade; ours is byte-identical to what it writes, its doubled
# Architectures line included, so the two never fight over the file. The postinst
# writes its own copy of the key at the same keyring path, which matches the
# pinned one by fingerprint, not byte for byte, so repo setup keeps it. Built for
# amd64 only.
[repo.microsoft-edge]
key_url = "https://packages.microsoft.com/keys/microsoft.asc"
fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"
keyring = "/usr/share/keyrings/microsoft-edge.gpg"

# Vivaldi's repository, for the app of the catalog (apps/vivaldi/). Built for
# amd64 only. Its key (16BD9233) expires on 2027-02-07; Vivaldi's postinst
# already puts its next one (5220E3E9, until 2028-02-15) at the next keyring's
# path. Our vivaldi.sources names both keyrings, and differs from Vivaldi's own
# only in that line, until Vivaldi's postinst rewrites it: every install and
# upgrade of vivaldi-stable writes the file again, naming the one key that build
# signs with (16BD9233 today), and /etc/default/vivaldi's repo_add_once doesn't
# stop it once the file exists. Once Vivaldi rotates, its postinst writes the
# new key itself; KubaOS's repo setup always writes both, never the expired key
# alone. Vivaldi publishes the next key only inside its .deb: the fingerprint is
# the one its postinst carries, fetched from Ubuntu's key server.
[repo.vivaldi]
key_url = "https://repo.vivaldi.com/archive/linux_signing_key.pub"
fingerprint = "8D1FA52AEF58A09D889DD4221256C34716BD9233"
keyring = "/usr/share/keyrings/vivaldi-16BD9233.gpg"
next_key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x7C7CB2D56F7D2A950BCCAB4EBCE0DE545220E3E9"
next_fingerprint = "7C7CB2D56F7D2A950BCCAB4EBCE0DE545220E3E9"
next_keyring = "/usr/share/keyrings/vivaldi-5220E3E9.gpg"

