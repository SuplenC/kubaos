# KubaOS: /etc/modprobe.d/kubaos-amdgpu.conf, installed by system/30-hardware.sh.
#
# FreeSync video modes: amdgpu adds a mode at 60, 48 and the other common rates
# for each display that can do VRR, with the native mode's timing and a longer
# vertical blank, and switches between them without a modeset. The power
# stops drop the laptop panel to 60 Hz in Super Saver (crates/kubaos-power,
# config/hypr/monitors.lua); without this the switch is a modeset and the
# panel goes dark for a moment. It adds modes and changes no mode in use, so
# an external screen stays on what Hyprland picked for it. It takes effect at
# the next boot (the initramfs loads amdgpu).
# https://docs.kernel.org/gpu/amdgpu/module-parameters.html
options amdgpu freesync_video=1
