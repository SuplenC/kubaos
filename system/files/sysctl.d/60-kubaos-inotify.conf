# Room for every program that watches files: Quickshell, the Command menu's
# Extensions, KubaOS's services, editors, language servers, Syncthing and a
# workspace's tests each hold inotify instances and watches of their own. The
# kernel's defaults, 128 instances per user and a watch count scaled to the RAM,
# run out on a desktop with an editor open, and a program that can't get one
# stops seeing its files change, or fails with "Too many open files".
# system/20-base.sh installs it (install_inotify_limits in system/lib.sh).
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288
