# Each interface answers ARP only for its own addresses, so a cable and Wi-Fi on
# one network both keep theirs. With the kernel's defaults (0 and 0) one
# interface answers for another's address ("ARP flux"): NetworkManager's
# duplicate address check on the cable then hears the Wi-Fi card claim the
# cable's new DHCP lease, drops it as a conflict, and every packet goes over the
# Wi-Fi.
# arp_ignore = 1: reply only when the asked address is on the interface the
# request came in on. arp_announce = 2: an ARP request names the sending
# interface's own address as its source. The kernel takes the higher of `all`
# and an interface's own value, so `all` covers the interfaces up now and
# `default` the ones that come later.
# https://docs.kernel.org/networking/ip-sysctl.html
# system/20-base.sh installs it (install_arp_per_interface in system/lib.sh).
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
