# KubaOS: written by system/25-boot.sh (/etc/default/grub.d/10-kubaos.cfg).
# docs/INSTALL-INTERNALS.md, "Boot", says why each of these is set.

# Names the entries; /etc/grub.d/10_linux (our wrapper) turns
# "KubaOS GNU/Linux" into os-release's PRETTY_NAME.
GRUB_DISTRIBUTOR="KubaOS"

# No menu on a normal boot: GRUB waits one second, hidden, for Esc (or F4, or
# a held Shift where the firmware reports it) and then boots. With 0 s no key
# gets through at all, and Esc pressed any earlier opens the firmware's setup
# instead. After a boot that didn't make it up (recordfail, cleared by
# grub2-common.service once boot-complete.target is reached), the menu shows
# by itself and boots the default after 10 s.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_RECORDFAIL_TIMEOUT=10

# The splash, and a quiet kernel behind it.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"

# The theme lives on /boot (GRUB can't read the encrypted root). Native
# resolution, kept for the kernel, so the splash doesn't change modes.
GRUB_THEME="/boot/grub/themes/kubaos/theme.txt"
# One flat colour. As a background image (05_debian_theme), it also makes the
# editor (e) and the GRUB shell (c) draw on the theme's terminal box instead
# of Ubuntu's blue and black.
GRUB_BACKGROUND="/boot/grub/themes/kubaos/background.png"
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
