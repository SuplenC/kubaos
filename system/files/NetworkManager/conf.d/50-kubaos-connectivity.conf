# NetworkManager's internet check, on every device: a link that is up but
# doesn't reach the internet gets +20000 on its default route's metric, so
# traffic moves to a link that does (a cable with no internet behind it hands
# over to the Wi-Fi), and the penalty goes once the check passes again.
# Ubuntu's own endpoint, the one its network-manager-config-connectivity-ubuntu
# package sets: Canonical runs it for exactly this check, over plain HTTP so a
# captive portal can intercept it, and it answers with the header
# NetworkManager looks for (X-NetworkManager-Status: online). The interval and
# timeout are NetworkManager's defaults, 300 s and 20 s.
# https://networkmanager.dev/docs/api/latest/NetworkManager.conf.html
# system/20-base.sh installs it (install_connectivity_check in system/lib.sh).
[connectivity]
enabled=true
uri=http://connectivity-check.ubuntu.com./
