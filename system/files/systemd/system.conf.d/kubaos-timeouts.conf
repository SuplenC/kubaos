# KubaOS: installed by system/20-base.sh. A unit that hasn't stopped 10 s
# after SIGTERM is killed, not after systemd's 90 s, so no single service can
# hold a shutdown or reboot for a minute and a half. A unit that needs longer
# sets its own TimeoutStopSec, as Docker does (docker.service.d/kubaos-stop.conf).
[Manager]
DefaultTimeoutStopSec=10s
