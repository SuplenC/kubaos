# Written by dotfiles/system/70-bitwarden.sh.
#
# polkit 127 runs each authentication in this socket-activated helper with
# PrivateDevices=yes and DevicePolicy=strict, which hides /dev/hidraw*: pam_u2f
# in /etc/pam.d/polkit-1 then never sees the security key and polkit falls
# through to the password. Give the helper the hidraw nodes back (the same
# drop-in Arch's pam-u2f package ships; upstream: polkit-org/polkit#622).
[Service]
PrivateDevices=no
DeviceAllow=char-hidraw rw
DeviceAllow=/dev/urandom r
