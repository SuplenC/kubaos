# KubaOS: installed into plymouth-{poweroff,reboot,halt,kexec}.service.d by
# install_shutdown_splash (system/lib.sh).
#
# plymouthd asks for DRM master once, when it maps the screen, and asks again
# only on a VT switch. While Hyprland holds master the request fails, every
# frame of the splash goes to a buffer that never reaches the screen, and no
# VT switch comes. Plymouth's own units wait for a display manager and for
# getty@tty1; Hyprland is neither, it runs in the login session on tty1, under
# user.slice. user.slice stops in the same shutdown, and systemd runs a stop
# before a start ordered against it, so plymouthd starts once every session,
# Hyprland's included, has ended and let go of the screen.
[Unit]
After=user.slice
