# KubaOS: installed by system/25-boot.sh. A snapshot booted from GRUB runs
# on a throwaway overlay (initramfs-tools/scripts/local-bottom/
# kubaos-snapshot-overlay); snapper can't snapshot that, and a "boot"
# snapshot of a snapshot would be noise anyway. Skip it there.
[Service]
ExecCondition=/bin/sh -c '! findmnt -n -t overlay /'
