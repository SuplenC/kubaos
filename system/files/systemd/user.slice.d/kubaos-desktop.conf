# /etc/systemd/system/user.slice.d/kubaos-desktop.conf
# KubaOS: installed by install_desktop_memory (system/lib.sh). The top of the
# desktop's reserve: memory the kernel reclaims from the desktop only once
# nothing else is left to reclaim, so a build that fills RAM pushes its own
# pages out, not the compositor's, the shell's or the audio's.
#
# HAZARD: keep each level at least the sum of the levels under it. The
# cgroup tree isn't mounted with memory_recursiveprot, so a level protects
# no more of its children than it is given itself:
#
#   user.slice              2560M   user.slice.d
#   └ user-UID.slice        2560M   user-.slice.d
#     ├ session-N.scope     2G      session-.scope.d   Hyprland, the shell
#     └ user@UID.service    512M    user@.service.d
#       ├ session.slice     256M    /etc/systemd/user  PipeWire, portals
#       └ app.slice         256M    /etc/systemd/user
#         └ kotodamad       256M    /etc/systemd/user  the Command menu
#
# A reserve protects only what the desktop uses, up to its size; nothing is
# held back while the desktop doesn't use it. Hyprland's session peaked at
# 1.8 GB with the shell, Xwayland and a dozen windows.
# https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html
[Slice]
MemoryLow=2560M
