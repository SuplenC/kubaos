# KubaOS: installed by system/40-apps.sh. On SIGTERM dockerd gives each
# running container 10 s to stop and waits up to 15 s in all (its
# shutdown-timeout). The 10 s default from system.conf.d/kubaos-timeouts.conf
# would kill it first, and a database container with it, mid-write.
[Service]
TimeoutStopSec=20s
