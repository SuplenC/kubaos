# Installed to /etc/systemd/logind.conf.d/lid.conf by system/20-base.sh.
# Lid closed on battery: suspend. On AC or docked: do nothing; Hyprland turns
# eDP-1 off itself (see config/hypr/), so the externals keep working.
# Power key: ignored here, Hyprland binds it to the shell's power menu.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
