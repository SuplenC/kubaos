# zswap: pages on their way to the swap file are compressed and kept in RAM
# instead, up to 20 % of it, and the ones that stay cold are written on to the
# swap file. Reading a page back is a decompression, not a read from an
# encrypted disk. Ubuntu's kernel builds zswap in but leaves it off.
# zstd packs more into the pool than the kernel's default, lzo, for a little more CPU.
# It is a module here, so it can't be named on the kernel command line, which
# is read before modules load; written here, the kernel loads it itself. A
# kernel without zswap has no such files, and tmpfiles skips the lines.
# system/20-base.sh installs it (install_zswap in system/lib.sh).
#
# HAZARD: the compressor before enabling it. The other way round, the kernel
# builds an lzo pool first and throws it away.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/enabled    - - - - Y
