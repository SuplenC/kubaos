# Written by dotfiles/system/50-hyprland.sh.
#
# The Nix-built Quickshell links Nix's libpam. For `pam_unix.so` (by name) it
# loads Nix's module, which runs its password helper from the NixOS path
# /run/wrappers/bin/unix_chkpwd. Point that at Ubuntu's setgid-shadow helper so
# the lock screen can check the password as a normal user. Ubuntu's own
# pam_unix.so can't be used instead: Nix's loader can't find its libcrypt.so.1.
# Verified in an ubuntu:26.04 container (docs/INSTALL.md, Troubleshooting).
d /run/wrappers     0755 root root -
d /run/wrappers/bin 0755 root root -
L+ /run/wrappers/bin/unix_chkpwd - - - - /usr/sbin/unix_chkpwd
