# Your clock popup, read by `kubaos-clock` (crates/kubaos-clock) on every
# change. The Command menu's clock Items and the popup's settings page edit
# the lines below; a hand edit shows the next time the popup asks.
#
# zones: up to four extra clocks, by city or IANA name.
# holidays: a country code (pl, de, gb, us, ...), "none", or unset for your
# locale's country. Your own rules go in holidays.toml beside this file.
# first_weekday: "monday" (default) or any other day.
# analog: an analog face beside the big clock (default false).
# bar_countdown: the name of a countdown to show next to the bar's clock.
#
# zones = ["Tokyo", "America/New_York"]
# holidays = "pl"
# first_weekday = "sunday"
# analog = true
# bar_countdown = "Vacation"
#
# [[countdowns]]
# name = "Vacation"
# at = "2026-12-19"
