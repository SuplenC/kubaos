# Your yazi keys: ~/.config/yazi/keymap.toml links here.
# Docs: https://yazi-rs.github.io/docs/configuration/keymap
#
# KubaOS wrote the key below when it made this file. It's yours now: change
# it or delete it.
#
# Ctrl+N drags the selected files, or the hovered one, out of yazi: into
# Chrome, an upload form, anything that takes a drop. ripdrag opens a small
# window to drag from and closes after the drop.
[[mgr.prepend_keymap]]
on = "<C-n>"
run = 'shell --orphan -- ripdrag --and-exit --all --no-click "$@"'
desc = "Drag the selected files out"

