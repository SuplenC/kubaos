# Your foot settings: ~/.config/kubaos/terminal/foot/foot.ini, included at the end of
# ~/.config/foot/foot.ini, so they win. foot is the fallback terminal (SUPER + ALT + Return).
# Keys before the first [section] are [main]. Takes effect in new foot windows.
#
# The font and its size.
# font=JetBrainsMono Nerd Font:size=10.5, monospace:size=10.5
#
# Space between the window's edge and the text.
# pad=12x8 center
#
# How much of the wallpaper shows through, 0 to 1 (1 is opaque).
# [colors]
# alpha=0.8
#
# Lines kept to scroll back through.
# [scrollback]
# lines=10000
#
# Full docs: man foot.ini (https://codeberg.org/dnkl/foot/src/branch/master/doc/foot.ini.5.scd).
