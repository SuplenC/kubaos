# Your tmux settings: ~/.config/kubaos/terminal/tmux/tmux.conf, sourced last by
# ~/.config/tmux/tmux.conf, so they win. Reload: tmux source-file ~/.config/tmux/tmux.conf
#
# The prefix key. KubaOS uses Ctrl+Space; tmux's own is Ctrl+B.
# unbind C-Space
# set -g prefix C-b
# bind C-b send-prefix
#
# Clicking, scrolling and resizing panes with the mouse (on in KubaOS).
# set -g mouse on
#
# Where the status bar sits: top (KubaOS) or bottom.
# set -g status-position top
#
# Window numbers start at 1 (KubaOS), or 0 as in plain tmux.
# set -g base-index 1
#
# A key of your own, here Alt+N for a new window, no prefix needed.
# bind-key -n M-n new-window
#
# Full docs: man tmux (https://github.com/tmux/tmux/wiki/Getting-Started).
