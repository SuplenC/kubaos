# Your keyboard, read by `kubaos keyboard` and by Hyprland
# (config/hypr/accents.lua, config/hypr/input.lua). The Command menu's
# keyboard Items and the control center's Keyboard tab change the lines below
# and apply them at once; after a hand edit, `kubaos keyboard accents apply`
# and a Hyprland reload.
#
# mac_accents: Left Alt + e, `, u, i or n, then a letter, types it with an
# acute, grave, diaeresis, circumflex or tilde (é à ö ô ñ), as Option does
# on a Mac; every other Left Alt chord stays Alt. true (default) or false.
#
# mac_accents = false
#
# layouts: the keyboard layouts you switch between (SUPER + SHIFT + Space),
# the first the default, spelled as `kubaos keyboard list` prints them. Without
# the line, the ones the install wrote to /etc/default/keyboard. The console
# and the disk's passphrase prompt type with the default; `kubaos keyboard`
# writes it there too, and a hand edit here doesn't.
#
# layouts = ["us", "it(intl)"]
