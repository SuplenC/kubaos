# Your fuzzel settings: ~/.config/kubaos/tools/fuzzel/fuzzel.ini, included at the end of
# ~/.config/fuzzel/fuzzel.ini, so they win. fuzzel is the fallback launcher
# (SUPER + ALT + Space). Keys before the first [section] are [main].
#
# The font and its size.
# font=Geist:size=11, sans-serif:size=11
#
# How many results show, and the panel's width in characters.
# lines=8
# width=38
#
# The icons beside each app.
# icon-theme=Papirus-Dark
#
# The panel's corner rounding, in pixels.
# [border]
# radius=20
#
# Full docs: man fuzzel.ini (https://codeberg.org/dnkl/fuzzel/src/branch/master/doc/fuzzel.ini.5.scd).
