# Your pointer: ~/.config/kubaos/desktop/cursor/cursor.toml, read by `kubaos cursor` at
# every wallpaper change and login. The Command menu's "Cursor style" and "Cursor size"
# Items change the lines below and apply at once; after a hand edit, `kubaos cursor apply`.
#
# The look: "dark" (default), a dark body with a light outline; "accent", the wallpaper's
# accent with a dark outline; "classic", Bibata-Modern-Classic.
# style = "dark"
#
# Size in pixels at scale 1, 16 to 96 (default 24). Hyprland reads it at login.
# size = 24
#
# Full docs: docs/CONTRACTS.md, "Defaults and the user layer"
# (https://github.com/SuplenC/kubaos/blob/main/docs/CONTRACTS.md).
