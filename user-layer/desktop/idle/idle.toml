# Your idle settings: ~/.config/kubaos/desktop/idle/idle.toml. When the screen locks, the
# screens go off and the laptop suspends after a time idle, on battery and plugged in, and what
# closing the lid does. The Command menu's "Lock after…", "Screens off after…", "Suspend
# after…" and "When the lid closes…" write the lines below, comments kept, and apply at once.
# After a hand edit, run `kubaos-idle apply`.
#
# A wait is a duration, "90s", "2m", "1h30m", "5h", or "never" (a number alone is minutes).
# The lock and screens off take 30 s at the least, suspend 1 min; a day at the most.
#
# On battery (KubaOS's values):
# [battery]
# lock = "5m"
# screens_off = "10m"
# suspend = "30m"
# lid = "suspend"
#
# Plugged in. Suspend never, so builds and downloads go on at a desk:
# [ac]
# lock = "5m"
# screens_off = "10m"
# suspend = "never"
# lid = "nothing"
#
# `lid` is "suspend", "lock" or "nothing". Docked, or with a second screen connected, closing
# the lid never does anything. Outside your session logind does what the lid did before
# (/etc/systemd/logind.conf.d/lid.conf): suspend on battery, nothing plugged in.
#
# Keep awake (Command menu, or SUPER + CTRL + I) holds the waits off, on battery and plugged in:
# for a while, until you turn it off, or until the battery is at a level ("keep-awake 20%").
# Closing the lid still does what `lid` says. "Keep awake with the lid closed" holds the lid off
# as well, so closing it does nothing ("keep-awake-lid 2h"). A lock you schedule with "Lock in…"
# or "Lock at…" still comes.
#
# While the lid is closed and the laptop stays awake, its panel is off.
#
# Full docs: docs/CONTRACTS.md, "Defaults and the user layer"
# (https://github.com/SuplenC/kubaos/blob/main/docs/CONTRACTS.md).
