# Your hyprlock settings: ~/.config/kubaos/desktop/hypr/hyprlock.conf, sourced at the end
# of ~/.config/hypr/hyprlock.conf. hyprlock is the fallback lock screen (Quickshell's is
# the main one) and reads its config on every start.
#
# Hide the pointer on the lock screen (KubaOS does; false shows it).
# general {
#     hide_cursor = true
# }
#
# Unlock with the fingerprint reader as well as the password (on in KubaOS).
# auth {
#     fingerprint:enabled = true
# }
#
# The blurred, dimmed screenshot behind the prompt: a picture of yours instead, or less blur.
# background {
#     path = screenshot
#     blur_passes = 3
#     brightness = 0.6
# }
#
# Full docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
