# Your hypridle settings: ~/.config/kubaos/desktop/hypr/hypridle.conf, sourced at the end
# of ~/.config/hypr/hypridle.conf. A listener here is added to KubaOS's; apply with
# `kubaos-idle apply` (it restarts hypridle), or log out and back in.
#
# When the screen locks, the screens go off and the laptop suspends, on battery and plugged
# in, are idle settings of their own: ~/.config/kubaos/desktop/idle/idle.toml, or "Lock
# after…", "Screens off after…" and "Suspend after…" in the Command menu. Longer and
# shorter both work there; use this file for anything else.
#
# Dim the screen after 2 minutes, and bring it back on any input.
# listener {
#     timeout = 120
#     on-timeout = brightnessctl -s set 10%
#     on-resume = brightnessctl -r
# }
#
# Full docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
