# Your hypridle settings: ~/.config/kubaos/desktop/hypr/hypridle.conf, sourced at the end
# of ~/.config/hypr/hypridle.conf. A listener here is added to KubaOS's three; restart
# hypridle to apply (log out and back in, or `pkill hypridle; hypridle &`).
#
# KubaOS locks after 5 min (300 s), turns the screens off after 10 min (600 s) and
# suspends after 30 min (1800 s) on battery. To act sooner, add a listener with a
# shorter timeout.
#
# Dim the screen after 2 minutes, and bring it back on any input.
# listener {
#     timeout = 120
#     on-timeout = brightnessctl -s set 10%
#     on-resume = brightnessctl -r
# }
#
# Lock after 3 minutes instead of 5.
# listener {
#     timeout = 180
#     on-timeout = loginctl lock-session
# }
#
# Full docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
