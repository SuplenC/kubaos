# Your power settings: ~/.config/kubaos/desktop/power/power.toml. The power slider's five
# stops (Super Saver, Power Saver, Balanced, Performance, Max Performance), the charge limit, the
# low-battery drop and the critical-battery warning. The Command menu's power Items write the lines below, comments kept, and
# apply at once. After a hand edit, run `kubaos power apply`. `kubaos power status` shows what the
# stop you're on does, row by row.
#
# The stop itself isn't here: each power source remembers the stop you last chose on it, in
# ~/.local/state/kubaos/power/stops.json.
#
# AMD's panel power saving dims the backlight and lifts the contrast to match, in Super Saver and
# Power Saver. Turn it off for colour-accurate work:
# panel_power_saving = true
#
# How far the battery charges: 80, 90 or 100. 80 for a laptop that lives plugged in:
# charge_limit = 100
#
# At this battery level, on battery, the stop drops to Power Saver, with an Undo; "super-saver"
# drops further, "off" leaves the stop where you put it:
# low_battery = 20
# low_battery_stop = "power-saver"
#
# At this battery level, on battery, a critical toast and a sound warn that the laptop powers off
# at 2 %, once each time it runs down, locked or not. From 3 to 20, or "off":
# critical_warning = 5
#
# The CPU scheduler: "lavd" (scx_lavd through sched_ext, which puts input, the compositor and
# audio first, in a mode that follows the stop: powersave on the fewest cores in Super Saver,
# powersave in Power Saver, autopilot in Balanced, performance above) or "kernel" (Linux's own,
# EEVDF). If LAVD fails, the kernel goes back to its own by itself. `kubaos power scheduler` says
# which runs and why:
# scheduler = "lavd"
#
# Background work yields: compilers and build tools you start (cargo, rustc, make, gcc, clang,
# the linkers) and Nix's builds run at nice 19, so the desktop, audio and the app you're in stay
# smooth while they use every core. A build you're waiting on gets the CPU back with false:
# background_yields = true
#
# A toast when a sleep over 30 min stayed out of deep sleep, or the laptop stayed awake over an
# hour with the lid closed, on battery, with a button to `kubaos power report`. Silent when all is
# well. The history behind it is written either way:
# battery_notes = true
#
# Input devices (keyboards, mice, security keys) and headsets are never autosuspended. Keep other
# USB devices awake too, by vendor:product as `lsusb` shows them, or vendor:* for any of a
# vendor's:
# [usb]
# skip = ["046d:c547"]
#
# What the laptop panel does in a stop: "60hz", "vrr" (its native rate, refreshing slower while
# nothing moves) or "native". External screens are never touched. `aspm` is the PCIe link power
# policy: "default", "performance", "powersave" or "powersupersave". The last sleeps the SSD and
# the Wi-Fi card hardest, and some drop off the bus there; if one does (`journalctl -k` shows nvme
# or Wi-Fi resets), use "powersave" in Super Saver too. KubaOS's choice per stop:
# [super-saver]
# panel = "60hz"
# aspm = "powersupersave"
# cpu_max_mhz = 1600     # the CPU's clock cap; 0 for none
#
# [power-saver]
# panel = "vrr"
# aspm = "powersave"
#
# [balanced]
# panel = "vrr"
# aspm = "default"
#
# [performance]
# panel = "native"
# aspm = "performance"
#
# [max-performance]
# panel = "native"
# aspm = "performance"
#
# Full docs: docs/USING.md, "Power", and docs/CONTRACTS.md, "Defaults and the user layer"
# (https://github.com/SuplenC/kubaos/blob/main/docs/USING.md).
