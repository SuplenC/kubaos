# ---------------------------------------------------------------------------
# Theme colors
#
# The theme pipeline (dot-theme / matugen) writes ~/.local/state/theme/tmux.conf.
# This config consumes exactly these user options (all "#rrggbb"):
#
#   @thm_bg            <- surface
#   @thm_fg            <- on_surface
#   @thm_muted         <- on_surface_variant
#   @thm_primary       <- primary
#   @thm_on_primary    <- on_primary
#   @thm_on_tertiary   <- on_tertiary
#   @thm_secondary     <- secondary
#   @thm_tertiary      <- tertiary
#   @thm_surface       <- surface_container
#   @thm_surface_high  <- surface_container_high
#   @thm_outline       <- outline
#   @thm_error         <- error
#
# Defaults below are used when the generated file is missing. Styles are set
# with -F after sourcing, so reloading colors means re-sourcing THIS file:
#   tmux source-file ~/.config/tmux/tmux.conf
# ---------------------------------------------------------------------------
set -g @thm_bg           "#19120b"
set -g @thm_fg           "#f0dfd4"
set -g @thm_muted        "#dac2b1"
set -g @thm_primary      "#ffb779"
set -g @thm_on_primary   "#4c2700"
set -g @thm_on_tertiary  "#00344c"
set -g @thm_secondary    "#f2bc8e"
set -g @thm_tertiary     "#85cfff"
set -g @thm_surface      "#261e17"
set -g @thm_surface_high "#312821"
set -g @thm_outline      "#a28d7d"
set -g @thm_error        "#ffb4ab"
source-file -q ~/.local/state/theme/tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# yazi's image previews inside tmux: its kitty-graphics escapes pass through
# to Ghostty, and a new session keeps the outer terminal's name, which yazi
# reads to pick the protocol.
# https://yazi-rs.github.io/docs/image-preview#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Login shell ($SHELL) is used; zsh from apt is the login shell on Ubuntu.
set-option -g status-position top
set -s escape-time 0

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Plugins ---
# Installed and pinned by Nix (home/terminal.nix): tmux-sensible,
# vim-tmux-navigator, tmux-better-mouse-mode. Loaded at the bottom of this file.

# --- Base Settings ---
set -g base-index 1
set -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on
set -g mouse on
# unbind -n MouseDrag1Pane

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move current window to the left or right
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# --- Status bar: session + windows only (the desktop bar shows clock/battery) ---
# The bar and the caps around the pills use the terminal's default background,
# so the translucent Ghostty window (and Hyprland's blur) shows through; only
# the pills themselves are painted.
# Pills with rounded caps (Nerd Font U+E0B6 / U+E0B4), like the Quickshell bar:
# the session in primary, the current window lifted onto a surface pill,
# the others muted. PREFIX / mode / ZOOM appear as pills on the right.
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -gF status-style "bg=default,fg=#{@thm_fg}"
set -g status-left "#[fg=#{@thm_primary},bg=default]#[fg=#{@thm_on_primary},bg=#{@thm_primary},bold]#S#[fg=#{@thm_primary},bg=default,nobold] "
set -g status-right "#{?client_prefix,#[fg=#{@thm_tertiary}]#[fg=#{@thm_on_tertiary}#,bg=#{@thm_tertiary}#,bold]PREFIX#[fg=#{@thm_tertiary}#,bg=default#,nobold] ,}#{?pane_in_mode,#[fg=#{@thm_surface_high}]#[fg=#{@thm_secondary}#,bg=#{@thm_surface_high}#,bold]#{pane_mode}#[fg=#{@thm_surface_high}#,bg=default#,nobold] ,}#{?window_zoomed_flag,#[fg=#{@thm_surface_high}]#[fg=#{@thm_primary}#,bg=#{@thm_surface_high}#,bold]ZOOM#[fg=#{@thm_surface_high}#,bg=default#,nobold] ,}"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_outline}] #I #[fg=#{@thm_muted}]#W "
set -g window-status-current-format "#[fg=#{@thm_surface_high},bg=default]#[fg=#{@thm_primary},bg=#{@thm_surface_high},bold]#I #[fg=#{@thm_fg},nobold]#W#[fg=#{@thm_surface_high},bg=default]"
set -gF window-status-activity-style "fg=#{@thm_secondary}"
set -gF window-status-bell-style "fg=#{@thm_error},bold"
set -gF pane-border-style "fg=#{@thm_surface_high}"
set -gF pane-active-border-style "fg=#{@thm_primary}"
set -gF message-style "bg=#{@thm_surface_high},fg=#{@thm_fg}"
set -gF message-command-style "bg=#{@thm_surface},fg=#{@thm_primary}"
set -gF mode-style "bg=#{@thm_primary},fg=#{@thm_on_primary}"
set -gF copy-mode-match-style "bg=#{@thm_surface_high},fg=#{@thm_fg}"
set -gF copy-mode-current-match-style "bg=#{@thm_tertiary},fg=#{@thm_bg}"
set -gF display-panes-active-colour "#{@thm_primary}"
set -gF display-panes-colour "#{@thm_outline}"
set -gF clock-mode-colour "#{@thm_primary}"

# Plugins (generated by home-manager: run-shell lines with Nix store paths).
# Keep this at the bottom, above your settings.
source-file -q ~/.config/tmux-nix/plugins.conf

# Your settings, after the plugins so they win (~/.config/kubaos, docs/CONTRACTS.md).
source-file -q ~/.config/kubaos/terminal/tmux/tmux.conf
