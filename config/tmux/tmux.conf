# ---------------------------------------------------------------------------
# Theme colours
#
# Every colour role of design/tokens.toml is a user option named for it,
# "#rrggbb": #{@color_primary}, #{@color_on_surface}, #{@color_cold}, the
# hues (#{@color_red}, ...) and the terminal's dim text (#{@color_dim}).
# colors.conf holds the dark fallback (generated from the tokens); the theme
# pipeline (dot-theme, matugen) writes the wallpaper's over it to
# ~/.local/state/theme/tmux.conf, in the mode dot-theme ran in. Styles are set
# with -F after sourcing, so reloading colours means re-sourcing THIS file,
# which dot-theme does:
#   tmux source-file ~/.config/tmux/tmux.conf
# ---------------------------------------------------------------------------
source-file ~/.config/tmux/colors.conf
source-file -q ~/.local/state/theme/tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# yazi's image previews inside tmux: its kitty-graphics escapes pass through
# to Ghostty, and a new session keeps the outer terminal's name, which yazi
# reads to pick the protocol.
# https://yazi-rs.github.io/docs/image-preview#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Login shell ($SHELL) is used; zsh from apt is the login shell on Ubuntu.
set-option -g status-position top
set -s escape-time 0

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Plugins ---
# Installed and pinned by Nix (home/terminal.nix): tmux-sensible,
# vim-tmux-navigator, tmux-better-mouse-mode. Loaded at the bottom of this file.

# --- Base Settings ---
set -g base-index 1
set -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on
set -g mouse on
# unbind -n MouseDrag1Pane

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move current window to the left or right
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# --- Status bar: session + windows only (the desktop bar shows clock/battery) ---
# The bar and the caps around the pills use the terminal's default background,
# so the translucent Ghostty window (and Hyprland's blur) shows through; only
# the pills themselves are painted.
# Pills with rounded caps (Nerd Font U+E0B6 / U+E0B4), like the Quickshell bar:
# the session in primary, the current window lifted onto a surface pill,
# the others muted. PREFIX (in the cold accent), the mode and ZOOM appear as
# pills on the right.
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -gF status-style "bg=default,fg=#{@color_on_surface}"
# A blank second status row: the bar sits on top, and without it the pane's
# first line touches the pills.
set -g status 2
set -g status-format[1] ""
set -g status-left "#[fg=#{@color_primary},bg=default]#[fg=#{@color_on_primary},bg=#{@color_primary},bold]#S#[fg=#{@color_primary},bg=default,nobold] "
set -g status-right "#{?client_prefix,#[fg=#{@color_cold}]#[fg=#{@color_on_cold}#,bg=#{@color_cold}#,bold]PREFIX#[fg=#{@color_cold}#,bg=default#,nobold] ,}#{?pane_in_mode,#[fg=#{@color_surface_container_high}]#[fg=#{@color_on_surface}#,bg=#{@color_surface_container_high}#,bold]#{pane_mode}#[fg=#{@color_surface_container_high}#,bg=default#,nobold] ,}#{?window_zoomed_flag,#[fg=#{@color_surface_container_high}]#[fg=#{@color_primary}#,bg=#{@color_surface_container_high}#,bold]ZOOM#[fg=#{@color_surface_container_high}#,bg=default#,nobold] ,}"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@color_dim}] #I #[fg=#{@color_on_surface_variant}]#W "
set -g window-status-current-format "#[fg=#{@color_surface_container_high},bg=default]#[fg=#{@color_primary},bg=#{@color_surface_container_high},bold]#I #[fg=#{@color_on_surface},nobold]#W#[fg=#{@color_surface_container_high},bg=default]"
set -gF window-status-activity-style "fg=#{@color_primary}"
set -gF window-status-bell-style "fg=#{@color_error},bold"
# Dividers, as everywhere: the variant outline; the active pane's in the accent.
set -gF pane-border-style "fg=#{@color_outline_variant}"
set -gF pane-active-border-style "fg=#{@color_primary}"
set -gF message-style "bg=#{@color_surface_container_high},fg=#{@color_on_surface}"
set -gF message-command-style "bg=#{@color_surface_container},fg=#{@color_primary}"
# A selection is a selected row's tinted bar under the text, as in the terminal.
set -gF mode-style "bg=#{@color_secondary_container},fg=#{@color_on_secondary_container}"
set -gF copy-mode-match-style "bg=#{@color_surface_container_high},fg=#{@color_on_surface}"
set -gF copy-mode-current-match-style "bg=#{@color_cold},fg=#{@color_on_cold}"
set -gF display-panes-active-colour "#{@color_primary}"
set -gF display-panes-colour "#{@color_outline}"
set -gF clock-mode-colour "#{@color_primary}"

# Plugins (generated by home-manager: run-shell lines with Nix store paths).
# Keep this at the bottom, above your settings.
source-file -q ~/.config/tmux-nix/plugins.conf

# Your settings, after the plugins so they win (~/.config/kubaos, docs/CONTRACTS.md).
source-file -q ~/.config/kubaos/terminal/tmux/tmux.conf
