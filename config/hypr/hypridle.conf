# hypridle (still hyprlang .conf, not Lua; checked against hypridle 0.1.8).
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# The listeners, when the screen locks, goes off and suspends, are written by
# `kubaos-idle` from ~/.config/kubaos/desktop/idle/idle.toml: lock 5 min,
# screens off 10 min, suspend 30 min only on battery unless you change them
# (docs/CONTRACTS.md "Hyprland conventions"). It writes them at every change,
# at login and at every home switch, so the file below is always there.
#
# Keep awake is a logind `idle` inhibitor, which hypridle honours: leave
# ignore_systemd_inhibit off.
#
# Waking lights every screen, then `dot-hypr-lid sync` turns the laptop panel
# off again if the lid is closed (scripts/dot-hypr-lid). In that order, so a
# failing script leaves it on.

general {
    # `loginctl lock-session` (keybinds, before sleep) ends up here.
    # Quickshell's lock first; hyprlock if the shell is down. pidof guards
    # against stacking a second hyprlock.
    lock_cmd = qs ipc call session lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; dot-hypr-lid sync
    # 3 = hold suspend until the session is really locked (works with any
    # session-lock client, Quickshell included), so resume never flashes
    # the unlocked desktop.
    inhibit_sleep = 3
}

# The idle settings' listeners (crates/kubaos-idle).
source = ~/.local/state/kubaos/idle/hypridle.conf

# Your settings, last so they win (~/.config/kubaos, docs/CONTRACTS.md).
source = ~/.config/kubaos/desktop/hypr/hypridle.conf
