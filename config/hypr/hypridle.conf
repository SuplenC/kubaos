# hypridle (still hyprlang .conf, not Lua; checked against hypridle 0.1.8).
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Lock 5 min, screens off 10 min, suspend 30 min only on battery
# (docs/CONTRACTS.md "Hyprland conventions").

general {
    # `loginctl lock-session` (keybinds, before sleep) ends up here.
    # Quickshell's lock first; hyprlock if the shell is down. pidof guards
    # against stacking a second hyprlock.
    lock_cmd = qs ipc call session lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # 3 = hold suspend until the session is really locked (works with any
    # session-lock client, Quickshell included), so resume never flashes
    # the unlocked desktop.
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800 # 30 min
    # Only on battery. condition_cmd runs via /bin/sh; exit 0 lets the
    # suspend fire. condition_retry re-checks every 60 s while still idle,
    # so unplugging an idle laptop still suspends it.
    condition_cmd = ! dot-hypr-on-ac
    condition_retry = 60
    on-timeout = systemctl suspend
}
