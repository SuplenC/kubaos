# hyprlock: fallback lock screen (the main one is Quickshell's).
# Still hyprlang .conf, not Lua; checked against hyprlock 0.9.6.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Colors: defaults below, then overridden by the theme pipeline's
# ~/.local/state/theme/hyprlock.colors, which must define the same
# variables as bare hex, e.g.  $primary = c2c1ff
# If that file is missing hyprlock logs an error and keeps the defaults.

$primary = ffb779
$on_primary = 4c2700
$surface = 19120b
$surface_container = 261e17
$on_surface = f0dfd4
$on_surface_variant = dac2b1
$outline = a28d7d
$error = ffb4ab
$tertiary = 85cfff

source = ~/.local/state/theme/hyprlock.colors

$font = Geist
$font_jp = M PLUS 1

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    # Parallel fingerprint unlock via fprintd (USB reader, see PLAN.md).
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning...
}

animations {
    enabled = true
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 3, emphasizedDecel
    animation = fadeOut, 1, 2, emphasizedDecel
    animation = inputFieldDots, 1, 2, emphasizedDecel
}

background {
    monitor =
    path = screenshot
    color = rgb($surface)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Japanese accent above the clock, as on the Quickshell lock screen.
label {
    monitor =
    text = 東京
    color = rgb($tertiary)
    font_size = 16
    font_family = $font_jp
    position = 0, 260
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb($on_surface)
    font_size = 96
    font_family = $font Light
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B'
    color = rgb($on_surface_variant)
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb($primary)
    inner_color = rgb($surface_container)
    font_color = rgb($on_surface)
    font_family = $font
    check_color = rgb($tertiary)
    fail_color = rgb($error)
    capslock_color = rgb($tertiary)
    fade_on_empty = false
    placeholder_text = <span foreground="##$on_surface_variant">Password  ·  $FPRINTPROMPT</span>
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -40
    halign = center
    valign = center
}

# Fingerprint feedback
label {
    monitor =
    text = $FPRINTFAIL
    color = rgb($error)
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}

# Your settings, last so they win (~/.config/kubaos, docs/CONTRACTS.md).
source = ~/.config/kubaos/hypr/hyprlock.conf
