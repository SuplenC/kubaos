# fuzzel's type and shape, as a list in a panel of the shell's: body text in rows a small control
# tall, the narrowest container's padding round it, a surface's corners, a hairline. fuzzel gives
# the prompt the rows' height too and centres the text in it, so the padding above and below is
# less the row's room round its line: the prompt's and the last row's text sit the padding in,
# once, as at the sides. config/fuzzel/fuzzel.ini includes it first.

[main]
font=Geist:size=10.5
line-height=24
horizontal-pad=16
vertical-pad=10
inner-pad=8

