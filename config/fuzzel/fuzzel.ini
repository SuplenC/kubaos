# fuzzel: the fallback launcher (SUPER+ALT+Space). apt owns it, so this file
# must work without Nix or Quickshell. Styled like the Command menu: the
# design tokens' type, padding and corners (config/fuzzel/tokens.ini,
# generated from design/tokens.toml), a rounded translucent panel (Hyprland
# blurs the "launcher" layer, config/hypr/rules.lua), a tinted selection.
include=~/.config/fuzzel/tokens.ini

# Colors: generated by dot-theme (config/matugen/templates/fuzzel.ini).
include=~/.local/state/theme/fuzzel.ini

[main]
icon-theme=Papirus-Dark
prompt="❯  "
placeholder=Search apps
terminal=ghostty -e
lines=8
width=38
image-size-ratio=0
match-counter=yes

# Your settings, last so they win (~/.config/kubaos, docs/CONTRACTS.md).
[main]
include=~/.config/kubaos/tools/fuzzel/fuzzel.ini
