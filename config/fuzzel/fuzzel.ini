# fuzzel: the fallback launcher (SUPER+ALT+Space). apt owns it, so this file
# must work without Nix or Quickshell. Styled like the Command menu:
# Geist, a rounded translucent panel (Hyprland blurs the "launcher" layer,
# config/hypr/rules.lua), a tinted selection.

# Colors: generated by dot-theme (config/matugen/templates/fuzzel.ini).
include=~/.local/state/theme/fuzzel.ini

[main]
font=Geist:size=11, sans-serif:size=11
icon-theme=Papirus-Dark
prompt="❯  "
placeholder=Search apps
terminal=ghostty -e
lines=8
width=38
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24
image-size-ratio=0
match-counter=yes

[border]
width=1
radius=20

# Your settings, last so they win (~/.config/kubaos, docs/CONTRACTS.md).
[main]
include=~/.config/kubaos/fuzzel/fuzzel.ini
