# KubaOS's additions to WirePlumber 0.5: "New devices take over", a script
# that makes a headset you connect the default output and input while the
# `kubaos.takeover` setting is on. `dot-audio takeover on|off` sets it, and
# the kubaos-audio-takeover unit copies it in from the user layer's flag file
# at each WirePlumber start (home/audio.nix), so the flag file stays the one
# place it is kept.
#
# WirePlumber reads this file at its start, so a change takes a new login.
# The fragments merge into wireplumber.conf: the objects key by key, the
# arrays by appending.
#
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/conf_file.html

wireplumber.settings.schema = {
  kubaos.takeover = {
    name = "New devices take over"
    description = "A headset you connect becomes the default output and input"
    type = "bool"
    default = false
  }
}

wireplumber.components = [
  # home/audio.nix installs the script in ~/.local/share/wireplumber/scripts.
  {
    name = kubaos/takeover.lua, type = script/lua
    provides = kubaos.takeover
    requires = [ metadata.default ]
  }
]

# Optional: a missing or broken script costs the takeover, never the sound.
wireplumber.profiles = {
  main = {
    kubaos.takeover = optional
  }
}
