# The Proxy: one switch for the work network (crates/kubaos-proxy,
# home/proxy.nix). IT's VPN (WireGuard or OpenVPN), the work DNS, the HTTP
# proxy and the company CA, as ~/.config/kubaos/desktop/network/proxy.toml
# names them, go up together or not at all; the control center's Proxy tile is
# the same switch. On and off say a failure in a notification. Its status is
# each part, and the VPN's type, server, last handshake and bytes moved, read
# live (crates/kotodama-kubaos/src/proxy.rs). The import runs in a terminal,
# where bw asks for the master password to put the secrets in the vault, and
# an OpenVPN config's username and password are asked for once; its secrets
# go to your Bitwarden vault, the rest beside proxy.toml. The settings open
# proxy.toml in Neovim.

[extensions.kubaos.actions.proxy]
title = "Proxy"
subtitle = { true = "On: the work network, the VPN, work DNS, the HTTP proxy and the company CA, all together", false = "Off: every part of the work network is down, the kill switch too" }
icon = "network-vpn"
keywords = ["vpn", "wireguard", "openvpn", "work network", "tunnel", "office", "proxy", "proxy status", "proxy settings", "proxy.toml", "vpn config", "conf", "ovpn", "handshake", "kill switch", "dns", "pac", "certificate", "ca"]
state = "proxy"
order = ["on", "off", "status", "settings", "import"]

[extensions.kubaos.actions.proxy.actions.on]
title = "Turn on"
keywords = ["on", "connect", "enable", "start"]
run = ["kubaos-proxy", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.proxy.actions.off]
title = "Turn off"
keywords = ["off", "disconnect", "disable", "stop"]
run = ["kubaos-proxy", "off"]
primary_when = { is = true }

[extensions.kubaos.actions.proxy.actions.status]
title = "Status"
keywords = ["status"]
view = "proxy"

[extensions.kubaos.actions.proxy.actions.settings]
title = "Open proxy settings"
keywords = ["settings"]
run = ["sh", "-c", 'dir="$(dot-config path network)" && mkdir -p "$dir" && exec ghostty -e nvim "$dir/proxy.toml"']

[extensions.kubaos.actions.proxy.actions.import]
title = "Import VPN config…"
keywords = ["import"]
run = ["kubaos-proxy", "import", "{path}"]
arguments = [{ name = "path", kind = "file", accept = ["conf", "ovpn"], placeholder = "~/Downloads/work.conf" }]
terminal = true

# Whether a full tunnel's kill switch lets the network you're on through (on by
# default): the phone link, printers, casting and SSH there. A range the
# VPN routes stays behind it, and no DNS lookup goes out beside the VPN.
# While the Proxy is on, it takes effect at once.
[extensions.kubaos.actions.proxy-local-network]
title = "Local network through the Proxy"
subtitle = { true = "Allowed: the kill switch lets the network you're on through, the phone link, printers, casting, SSH", false = "Blocked: the kill switch lets nothing out but through the VPN, the network you're on included" }
icon = "network-workgroup"
keywords = ["vpn", "kill switch", "lan", "local network", "printer", "phone link", "casting", "proxy"]
state = "proxy.local-network"

[extensions.kubaos.actions.proxy-local-network.actions.allow]
title = "Allow"
keywords = ["allow", "on", "enable"]
run = ["kubaos-proxy", "lan", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.proxy-local-network.actions.block]
title = "Block"
keywords = ["block", "off", "disable"]
run = ["kubaos-proxy", "lan", "off"]
primary_when = { is = true }

