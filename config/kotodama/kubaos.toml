# "Focus stutter" is the Extension's own Item (crates/kotodama-kubaos,
# shell.rs): Enter turns the focus tube's neon strike off or back on, on
# controls and on the active window's border, and Ctrl+K picks on or off. It
# writes `focusStutter` in ~/.config/kubaos/desktop/quickshell/settings.json,
# keeping your comments; the shell reads it again at once, and Hyprland
# (config/hypr/focus.lua) at the next focus change. "Always show the bell"
# is one too, the same way: it writes `alwaysShowBell`, and the bar's
# bell shows all the time, or only while there's a notification.

# Idle (crates/kubaos-idle). "Lock after…", "Screens off after…", "Suspend
# after…" and "When the lid closes…" are the Extension's own Items: Enter
# lists the usual choices, each for both power sources or one (Ctrl+K), or
# type a time after the word, `lock-after 2m`, `suspend-after 1h30m ac`,
# `screens-off-after never battery`. They write
# ~/.config/kubaos/desktop/idle/idle.toml through `kubaos-idle set`, which
# restarts hypridle and says what changed in a toast.
#
# Keep awake: nothing locks, goes dark or suspends by itself for a while, as
# a logind idle inhibitor hypridle honours; the bar shows it while on. Until
# turned off, for an hour or two, or as long as you say (30m, 3h, 1h30m), then
# as before. The `idle` id is the old "Toggle idle", so a `hide` of it still
# works.

[extensions.kubaos.actions.idle]
title = "Keep awake"
subtitle = { true = "On: no auto-lock, screens off or suspend till you stop it (SUPER + CTRL + I)", false = "Off: lock, screens off and suspend after a time idle (SUPER + CTRL + I)" }
icon = "preferences-desktop-screensaver"
keywords = ["caffeine", "keep awake", "no sleep", "hypridle", "auto lock", "toggle idle", "idle", "for 1 hour", "for 2 hours", "presentation", "movie"]
state = "idle.keep-awake"
order = ["on", "off", "1h", "2h", "for"]

[extensions.kubaos.actions.idle.actions.on]
title = "Keep awake until turned off"
keywords = ["on", "enable", "start"]
run = ["kubaos-idle", "awake", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.idle.actions.off]
title = "Stop keeping awake"
keywords = ["off", "disable", "stop"]
run = ["kubaos-idle", "awake", "off"]
primary_when = { is = true }

[extensions.kubaos.actions.idle.actions.1h]
title = "Keep awake for 1 hour"
keywords = ["hour", "1h"]
run = ["kubaos-idle", "awake", "1h"]

[extensions.kubaos.actions.idle.actions.2h]
title = "Keep awake for 2 hours"
keywords = ["hours", "2h"]
run = ["kubaos-idle", "awake", "2h"]

[extensions.kubaos.actions.idle.actions.for]
title = "Keep awake for…"
keywords = ["duration"]
run = ["kubaos-idle", "awake", "for", "{duration}"]
arguments = [{ name = "duration", placeholder = "30m" }]

[extensions.kubaos.actions.idle-reset]
title = "Idle: KubaOS defaults"
subtitle = "Lock 5 min, screens off 10 min, suspend 30 min on battery only; the lid suspends on battery"
icon = "preferences-desktop-screensaver"
keywords = ["idle settings", "reset", "lock", "suspend", "lid", "hypridle"]
run = ["kubaos-idle", "reset"]
confirm = true
role = "destructive"

# A lock, suspend, shut down or reboot once, at a time, whether you're idle or
