keywords = ["quick settings", "panel"]
run = ["qs", "ipc", "call", "controlcenter", "toggle"]

# The control center's Wi-Fi tab, which scans while it shows: saved networks
# and the ones in range, and the password form.
[extensions.kubaos.actions.wifi-networks]
title = "Wi-Fi networks"
subtitle = "Connect to a network in range in the control center, or forget a saved one"
icon = "network-wireless"
keywords = ["wifi", "wi-fi", "wlan", "wireless", "network", "connect", "password", "hotspot"]
run = ["qs", "ipc", "call", "controlcenter", "wifi"]

# The code a keyboard or phone asks for shows in that tab, from the pairing
