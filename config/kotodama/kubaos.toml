# Kotodama, the Command menu: KubaOS's settings. The Daemon merges every
# *.toml in ~/.config/kotodama in filename order, so user.toml, which links
# to your ~/.config/kubaos/menu/kotodama/user.toml, wins over this file.
# `kotodama config` prints the merged config and where each value came from;
# `kotodama config --schema` lists every key.

[extensions.apps]
# What starts apps with `Terminal=true`; the app's command follows.
terminal = ["ghostty", "-e"]
# Desktop ids to leave out, on top of the entries that set NoDisplay or
# Hidden themselves. The KubaOS Extension's "Files" and "Yazi" stand in for
# Nautilus's entry and kubaos-files, yazi's (home/files.nix); display-im7.q16
# is ImageMagick's viewer, there for the right-click image actions.
hidden = [
  "qt5ct",
  "qt6ct",
  "org.codeberg.dnkl.footclient",
  "org.codeberg.dnkl.foot-server",
  "kubaos-files",
  "org.gnome.Nautilus",
  "display-im7.q16",
]
# Display names by desktop id, for entries with clumsy names.
names = { nvim = "Neovim" }

[extensions.hyprland]
# Windows, workspaces and the Shortcuts View (SUPER + F1). Every bind is in
# the main search too, titled by its description in config/hypr/keybinds.lua
# with its keys beside, so typing "move to workspace 3" finds the bind.
in_search = true

[extensions.folders]
# A script's window stays open after it exits, so its output can be read. It
# floats (dot.float, config/hypr/rules.lua): a quick run shouldn't push the
# tiled windows around.
terminal = ["ghostty", "--class=dot.float", "--wait-after-command=true", "-e"]
# A project opens in its tmux session, the one `tms` opens for it.
open = ["ghostty", "-e", "tmux", "new-session", "-A", "-s", "{session}", "-c", "{path}"]
shell = ["ghostty", "--working-directory={path}"]
lazygit = ["ghostty", "-e", "lazygit", "--path", "{path}"]

# The Projects root and the Scripts root. home/links.nix writes tms's
# `search_dirs` from this same list into the tms config it seeds, so the menu
# and `tms` find the same projects.
[[extensions.folders.folders]]
path = "~/Projects"
kind = "projects"
depth = 1

[[extensions.folders.folders]]
path = "~/Scripts"
kind = "scripts"

[extensions.kubaos]
# KubaOS's own actions and the system toggles (crates/kotodama-kubaos). Add
# yours, or change one of these key by key, under
# [extensions.kubaos.actions.<id>] in ~/.config/kubaos/menu/kotodama/user.toml, and
# leave any out, toggles too, with `hide = ["<id>", ...]` there
# (docs/USING.md). An action is one Item in the menu. It takes `title` and
# `run` (the program, then its arguments, `{name}` filled in from its
# `arguments`), and may take `subtitle`, `icon`, `keywords`, `keyword`,
# `terminal = true` (runs it in `terminal` below), `confirm = true` (asks
# first), `role = "destructive"` (it removes something), `delay_ms` (waits that
# long, so the menu is off the screen first) and `shown_when` (listed only in
# that state, below).
#
# An argument is `{ name, placeholder, optional }`, and one that is a path says
# so with `kind = "file"` or `kind = "folder"`: the menu asks for it in a file
# field, which completes it as it is typed, lists the newest files it takes,
# opens the system's picker and takes a dropped file, and the command gets it
# as an absolute path. A file's `accept` lists the extensions (`"conf"`) or
# MIME types (`"image/png"`) it takes; none takes any file.
#
# One result per thing: what can be done to a thing is an Action of its Item,
# never an Item of its own. In place of `run`, a thing's action takes
# `actions`, one table an Action by id, under
# [extensions.kubaos.actions.<id>.actions.<action>]: each takes `title`,
# `keywords`, its verbs ("proxy off", "remove docker" find the thing, and
# Kotodama marks that Action for Enter), and `run`, `arguments`, `terminal`, `confirm`, `role` and
# `delay_ms` as above, or in place of `run` a View of the Extension's own,
# read live: `view = "proxy"`, `"power"` or `"cpu-scheduler"`. The Actions
# come in id order, or in the order `order = ["<action>", …]` lists them, the
# rest after it. Kotodama reads the query's first word that names a verb, so
# what a person types for an Action ("ring the phone") has that Action's verb
# as its first verb word. `state = "<state>"` names the state the thing is in:
# its `subtitle` may be a table by the state's value (`{ true = "On: …", false
# = "Off: …" }`), and the Actions whose `primary_when = { is = <value> }` (or
# `is_not`) holds come first, so Enter runs what applies next.
#
# `identity = "app:<desktop id>"` makes the action a placeholder for an app
# not installed yet: it steps aside while the app's own Item is in the menu.
# Its `remove = { run, terminal }` is what "Remove" runs on the app, offered
# while `state` says KubaOS installed it.
#
# `shown_when = { state = "<state>", is = <value> }` lists an action only
# while the state reads as the value, and `is_not` only while it doesn't. The
# Extension reads the states from their files and reads them again when one
# changes (crates/kotodama-kubaos/src/states.rs, docs/CONTRACTS.md):
# `packages.<group>`, `files.tidy-daily`, `files.automount`,
# `terminal.greeting`, `keyboard.mac-accents`, `idle.keep-awake`,
# `phone.link`, `proxy`, `proxy.local-network`, `notifications.dnd`,
# `power.panel-power-saving`, `nix.unfree`, `kubaos.preview` and
# `bluetooth.unnamed`, true or false; `power.scheduler` ("kernel", "lavd"),
# `power.low-battery` ("power-saver", "super-saver", "off"),
# `power.charge-limit` ("80", "90", "100"), `power.stop` ("super-saver" …
# "max-performance") and `wallpaper.motion` ("always", "ac", "never"). While a state
# can't be read, the action shows, with no subtitle by state and the Actions
# with a `primary_when` first.
#
# What a `terminal = true` action runs in. It stays open once the action
# exits, so what it said can be read, and floats (dot.float,
# config/hypr/rules.lua), since an action is run and closed, and shouldn't
# push the tiled windows around.
terminal = ["ghostty", "--class=dot.float", "--wait-after-command=true", "-e"]

# Files: Nautilus (home/files.nix), and yazi in Ghostty (crates/kubaos-files).
# The Extension itself sends one Item a user folder that exists, "Files:
# Downloads" and the like, opening in Files or, as the second Action, yazi;
# and one "Eject <drive>" Item a mounted removable drive (home/automount.nix).

[extensions.kubaos.actions.files]
title = "Files"
subtitle = "Your home folder in Files"
icon = "system-file-manager"
keywords = ["file manager", "nautilus", "folders", "explorer", "finder", "home"]
run = ["nautilus", "--new-window"]

[extensions.kubaos.actions.yazi]
title = "Yazi"
subtitle = "Your home folder in yazi. A file manager that never wants the mouse"
icon = "system-file-manager"
keywords = ["file manager", "yazi", "terminal", "folders", "home"]
run = ["kubaos-files", "open"]

[extensions.kubaos.actions.files-open]
title = "Open folder in yazi…"
subtitle = "A folder by its path, in yazi"
icon = "folder-open"
keywords = ["file manager", "yazi", "go to folder", "path"]
keyword = "open-folder"
run = ["kubaos-files", "open", "{path}"]
arguments = [{ name = "path", kind = "folder", placeholder = "~/Projects/kubaos" }]

[extensions.kubaos.actions.files-recent]
title = "Recent files"
subtitle = "The files you opened lately, in Files"
icon = "document-open-recent"
keywords = ["recent", "recently opened", "history", "file manager"]
run = ["nautilus", "--new-window", "recent:///"]

# Sorts ~/Downloads into Images, Documents, Archives, Installers, Video and
# Audio, leaving what arrived in the last day.
[extensions.kubaos.actions.tidy-downloads]
title = "Tidy Downloads"
subtitle = "Sort ~/Downloads into folders by kind, leaving today's files where they are"
icon = "folder-download"
keywords = ["downloads", "clean up", "organize", "sort", "tidy"]
run = ["kubaos-files", "tidy"]

[extensions.kubaos.actions.tidy-downloads-daily]
title = "Tidy Downloads daily"
subtitle = { true = "On: ~/Downloads is sorted into folders by kind once a day", false = "Off: ~/Downloads stays as you leave it, unless you tidy it from here" }
icon = "folder-download"
keywords = ["downloads", "clean up", "organize", "automatic", "tidy"]
state = "files.tidy-daily"

[extensions.kubaos.actions.tidy-downloads-daily.actions.on]
title = "Tidy daily"
keywords = ["on", "enable", "start"]
run = ["kubaos-files", "tidy", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.tidy-downloads-daily.actions.off]
title = "Stop tidying daily"
keywords = ["off", "disable", "stop"]
run = ["kubaos-files", "tidy", "off"]
primary_when = { is = true }

# Mounting removable drives as they're plugged in (kubaos-automount); on by
# default. Eject Items stay either way.
[extensions.kubaos.actions.automount]
title = "Mount drives when plugged in"
subtitle = { true = "On: USB sticks and SD cards mount and open from a notification", false = "Off: plugged-in drives wait in the Files sidebar until you click them" }
icon = "drive-removable-media"
keywords = ["automount", "usb", "sd card", "drive", "mount"]
state = "files.automount"

[extensions.kubaos.actions.automount.actions.on]
title = "Turn on"
keywords = ["on", "enable", "start"]
run = ["kubaos-automount", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.automount.actions.off]
title = "Turn off"
keywords = ["off", "disable", "stop"]
run = ["kubaos-automount", "off"]
primary_when = { is = true }

# Your settings: the user layer, ~/.config/kubaos, in Files, whole or one
# group at a time (scripts/dot-config open, docs/USING.md). Each folder's
# README.md says what lives where. Its home/ is the user flake, where the
# settings made by environment variable go (KUBAOS_PROJECTS, KUBAOS_BW_*).

[extensions.kubaos.actions.settings-folder]
title = "Settings folder"
subtitle = "Your own settings, ~/.config/kubaos, in Files"
icon = "folder-open"
keywords = ["settings", "config", "dotfiles", "user layer", "preferences", "customize", "user flake", "home.nix", "environment variables"]
run = ["dot-config", "open"]

[extensions.kubaos.actions.settings-desktop]
title = "Settings: Desktop"
subtitle = "Hyprland, the shell, the cursor, the clock, the keyboard and the system monitor, in Files"
icon = "preferences-desktop"
keywords = ["settings", "config", "hyprland", "quickshell", "bar", "keyboard", "cursor", "wallpaper"]
run = ["dot-config", "open", "desktop"]

[extensions.kubaos.actions.settings-terminal]
title = "Settings: Terminal"
subtitle = "Ghostty, foot, tmux, zsh and fastfetch, in Files"
icon = "utilities-terminal"
keywords = ["settings", "config", "ghostty", "foot", "tmux", "zsh", "shell", "fastfetch"]
run = ["dot-config", "open", "terminal"]

[extensions.kubaos.actions.settings-editor]
title = "Settings: Editor"
subtitle = "Neovim, in Files"
icon = "accessories-text-editor"
keywords = ["settings", "config", "neovim", "nvim", "vim", "lazyvim"]
run = ["dot-config", "open", "editor"]

[extensions.kubaos.actions.settings-tools]
title = "Settings: Tools"
subtitle = "git, lazygit, yazi, bat, bacon and fuzzel, in Files"
icon = "applications-utilities"
keywords = ["settings", "config", "git", "lazygit", "yazi", "bat", "bacon", "fuzzel"]
run = ["dot-config", "open", "tools"]

[extensions.kubaos.actions.settings-menu]
title = "Settings: Menu"
subtitle = "The Command menu's own settings and your actions, in Files"
icon = "system-search"
keywords = ["settings", "config", "kotodama", "command menu", "launcher", "actions"]
run = ["dot-config", "open", "menu"]

# Workspace groups (config/hypr/README.md, "Workspace groups"): the screens
# pinned to each group, in ~/.config/kubaos/desktop/workspaces/groups.toml,
# which applies as it is saved. The Extension itself sends "Workspace group 1"
# and the like a desk position, "Pin <screen> to group N" for each screen
# plugged in, "Unpin <screen>" and "Name group N…"; this one opens the file.

[extensions.kubaos.actions.workspace-groups-settings]
title = "Open workspace groups settings"
subtitle = "Which screens are pinned to which workspace group, and the groups' names, in Neovim"
icon = "video-display"
keywords = ["settings", "config", "workspace group", "pin screen", "monitor", "display", "desk", "groups.toml"]
run = ["sh", "-c", 'dir="$(dot-config path workspaces)" && mkdir -p "$dir" && exec ghostty -e nvim "$dir/groups.toml"']

# The terminal greeting: fastfetch with the クバ mark in a new Ghostty window
# (scripts/dot-greeting, home/shell.nix). On by default.

[extensions.kubaos.actions.greeting]
title = "Terminal greeting"
subtitle = { true = "On: a new Ghostty window opens with the logo and the system at a glance", false = "Off: a new Ghostty window opens straight to the prompt" }
icon = "utilities-terminal"
keywords = ["fastfetch", "terminal", "welcome", "logo", "motd", "quiet"]
state = "terminal.greeting"

[extensions.kubaos.actions.greeting.actions.on]
title = "Turn on"
keywords = ["on", "enable", "start"]
run = ["dot-greeting", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.greeting.actions.off]
title = "Turn off"
keywords = ["off", "disable", "stop"]
run = ["dot-greeting", "off"]
primary_when = { is = true }

# The wallpaper and its theme (scripts/dot-theme, the shell's picker): one
# Item, whose subtitle says when a video wallpaper plays (the shell's
# `Motion`, config/quickshell/services/Motion.qml), and Enter opens the
# picker. The Extension itself sends one Item a wallpaper set, "Wallpaper set:
# Shinjuku", to show it in the picker or hide it; "Show every set" shows them
# all.

[extensions.kubaos.actions.wallpaper]
title = "Wallpaper"
subtitle = { always = "Animated always: video wallpapers play on battery too. Battery be damned", ac = "Animated on AC: video wallpapers play only while plugged in", never = "Never animated: video wallpapers stay still. Boring, but cheap" }
icon = "preferences-desktop-wallpaper"
keywords = ["theme", "background", "choose wallpaper", "next theme", "previous theme", "wallpaper folder", "wallpaper set", "wallpaper sets", "every wallpaper set", "all wallpapers", "reset wallpapers", "video wallpaper", "motion", "animate wallpaper"]
state = "wallpaper.motion"
order = ["pick", "next", "previous", "set", "switch", "all-sets", "always", "ac", "never"]

[extensions.kubaos.actions.wallpaper.actions.pick]
title = "Pick a wallpaper"
keywords = ["pick", "picker", "choose"]
run = ["qs", "ipc", "call", "wallpaper", "toggle"]

[extensions.kubaos.actions.wallpaper.actions.next]
title = "Next wallpaper"
keywords = ["next"]
run = ["dot-theme", "next"]

[extensions.kubaos.actions.wallpaper.actions.previous]
title = "Previous wallpaper"
keywords = ["previous", "prev"]
run = ["dot-theme", "prev"]

[extensions.kubaos.actions.wallpaper.actions.set]
title = "Set wallpaper…"
keywords = ["set"]
run = ["dot-theme", "set", "{file}"]
arguments = [{ name = "file", kind = "file", accept = ["jpg", "jpeg", "png", "webp", "mp4", "webm", "mkv", "mov"], placeholder = "~/Pictures/wallpapers/city.jpg" }]

# The next folder of wallpapers: a set, or yours.
[extensions.kubaos.actions.wallpaper.actions.switch]
title = "Switch folder"
keywords = ["switch"]
run = ["dot-theme", "toggle-folder"]

# The picker shows every set again, all of each.
[extensions.kubaos.actions.wallpaper.actions.all-sets]
title = "Show every set"
keywords = ["show"]
run = ["dot-theme", "all-sets"]

[extensions.kubaos.actions.wallpaper.actions.always]
title = "Animate always"
keywords = ["always"]
run = ["qs", "ipc", "call", "wallpaper", "animate", "always"]

[extensions.kubaos.actions.wallpaper.actions.ac]
title = "Animate on AC"
keywords = ["ac", "on"]
run = ["qs", "ipc", "call", "wallpaper", "animate", "ac"]

[extensions.kubaos.actions.wallpaper.actions.never]
title = "Never animate"
keywords = ["never", "still", "off"]
run = ["qs", "ipc", "call", "wallpaper", "animate", "never"]

# The pointer, in the wallpaper's colours (kubaos cursor), is the Extension's
# own Item, `cursor`: its style and size in the subtitle, an Action each. Each
# applies at once and is kept in ~/.config/kubaos/desktop/cursor/cursor.toml.

# The keyboard layouts (kubaos keyboard), kept in
# ~/.config/kubaos/desktop/keyboard/keyboard.toml; the default also goes to
# /etc/default/keyboard, for the console and the disk unlock. The Extension
# itself sends one Item a layout and "Keyboard: add a layout"; this one
# replaces them all. The next layout is the
# SUPER + SHIFT + Space bind, which the menu finds as "Next keyboard layout".

[extensions.kubaos.actions.keyboard-set]
title = "Keyboard: set layouts"
subtitle = "Every layout, comma-separated, the default first: us,de(nodeadkeys)"
icon = "input-keyboard"
keywords = ["keyboard layout", "keymap", "language", "input"]
keyword = "keyboard-layouts"
run = ["kubaos", "keyboard", "set", "{layouts}"]
arguments = [{ name = "layouts", placeholder = "us,de" }]

# Mac-style accents on Left Alt (kubaos keyboard accents), whatever the
# layout: Left Alt + e, `, u, i or n, then the letter. Kept in
# ~/.config/kubaos/desktop/keyboard/keyboard.toml; the chords are in the Shortcuts
# View (SUPER + F1).

[extensions.kubaos.actions.mac-accents]
title = "Mac accents"
subtitle = { true = "On: Left Alt + e, then e, is é. Also ` à, u ö, i ô and n ñ", false = "Off: Left Alt is plain Alt, e, `, u, i and n too" }
icon = "input-keyboard"
keywords = ["accents", "left alt", "dead keys", "option key", "macos", "diacritics", "keyboard"]
state = "keyboard.mac-accents"

[extensions.kubaos.actions.mac-accents.actions.on]
title = "Turn on"
keywords = ["on", "enable", "start"]
run = ["kubaos", "keyboard", "accents", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.mac-accents.actions.off]
title = "Turn off"
keywords = ["off", "disable", "stop"]
run = ["kubaos", "keyboard", "accents", "off"]
primary_when = { is = true }

# The design language: every token and component of kubaos-ui, live
# (crates/kubaos-specimen, from design/tokens.toml). Tab and the arrows move
# between its pages, M switches light and dark.
[extensions.kubaos.actions.design-specimen]
title = "Design specimen"
subtitle = "Type, colour, spacing, every component and the icon sets, live"
icon = "applications-graphics"
keywords = ["design", "tokens", "components", "icons", "type", "colours", "style guide", "kubaos-ui"]
run = ["kubaos-specimen"]

# The shell's panels and notifications (config/quickshell/IpcHandlers.qml).

[extensions.kubaos.actions.control-center]
title = "Control center"
subtitle = "Wi-Fi, Bluetooth, audio, brightness and capture in the shell"
