# The clock popup (crates/kubaos-clock, config/quickshell/modules/clock/).
# Date queries such as `days until christmas` get an answer in the top row
# from the Extension itself. The settings Items change
# ~/.config/kubaos/desktop/clock/clock.toml through `kubaos-clock`, which the popup
# reads at its next request; a notification says why when one is refused.

[extensions.kubaos.actions.clock-open]
title = "Open calendar"
subtitle = "The clock popup: the month, world clocks, countdowns and date search"
icon = "x-office-calendar"
keywords = ["clock", "calendar", "date", "month", "week number", "holidays"]
run = ["qs", "ipc", "call", "clock", "toggle"]

[extensions.kubaos.actions.clock-settings]
title = "Calendar settings"
subtitle = "Holidays, first weekday, analog face, extra clocks and the bar's countdown"
icon = "preferences-system-time"
keywords = ["clock settings", "calendar", "time zones", "holidays", "first day of week"]
run = ["qs", "ipc", "call", "clock", "settings"]

[extensions.kubaos.actions.clock-add-countdown]
title = "Add countdown"
subtitle = "Count down to a date or time in the clock popup: 19 dec, friday 17:00"
icon = "alarm-symbolic"
keywords = ["countdown", "clock", "calendar", "vacation", "deadline"]
keyword = "add-countdown"
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1); notify-send -a Clock Clock "$out"', "sh", "countdown", "add", "{name}", "{when}"]
arguments = [{ name = "name", placeholder = "Vacation" }, { name = "when", placeholder = "19 dec" }]

[extensions.kubaos.actions.clock-remove-countdown]
title = "Remove countdown"
subtitle = "Take a countdown out of the clock popup, and out of the bar"
icon = "alarm-symbolic"
keywords = ["clock", "delete"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "countdown", "remove", "{name}"]
arguments = [{ name = "name", placeholder = "Vacation" }]
role = "destructive"

[extensions.kubaos.actions.clock-bar-countdown]
title = "Countdown in the bar"
subtitle = "Show a countdown next to the bar's clock, by name, or none"
icon = "alarm-symbolic"
keywords = ["countdown", "bar", "clock"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "set", "bar-countdown", "{name}"]
arguments = [{ name = "name", placeholder = "Vacation, or none" }]

[extensions.kubaos.actions.clock-add-zone]
title = "Add time zone"
subtitle = "An extra clock in the popup, up to four: Tokyo, New York, America/Chicago"
icon = "preferences-system-time"
keywords = ["time zone", "world clock", "clock", "city"]
keyword = "add-zone"
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1); notify-send -a Clock Clock "$out"', "sh", "zone", "add", "{zone}"]
arguments = [{ name = "zone", placeholder = "Tokyo" }]

[extensions.kubaos.actions.clock-remove-zone]
title = "Remove time zone"
subtitle = "Take an extra clock out of the popup"
icon = "preferences-system-time"
keywords = ["world clock", "clock", "delete"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "zone", "remove", "{zone}"]
arguments = [{ name = "zone", placeholder = "Tokyo" }]
role = "destructive"

[extensions.kubaos.actions.clock-holidays]
title = "Holidays country"
subtitle = "Whose public holidays the calendar marks and working days leave out: pl, de, gb, us, none"
icon = "x-office-calendar"
keywords = ["holidays", "calendar", "country", "public holidays", "bank holidays"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "set", "holidays", "{country}"]
arguments = [{ name = "country", placeholder = "pl" }]

[extensions.kubaos.actions.clock-first-weekday]
title = "First day of the week"
subtitle = "The calendar's first column: monday, sunday or any other day"
icon = "x-office-calendar"
keywords = ["calendar", "week start", "monday", "sunday"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "set", "first-weekday", "{day}"]
arguments = [{ name = "day", placeholder = "monday" }]

[extensions.kubaos.actions.clock-analog]
title = "Analog clock face"
subtitle = "Show or hide the analog face in the clock popup"
icon = "preferences-system-time"
keywords = ["clock", "analog", "watch face", "hands"]
run = ["kubaos-clock", "set", "analog", "toggle"]

[extensions.kubaos.actions.clock-time-format]
title = "Time format"
subtitle = "How the bar, lock screen and popup write the time: 24h, 12h, or locale"
icon = "preferences-system-time"
keywords = ["clock", "24-hour", "12-hour", "am pm", "time format"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "set", "time-format", "{format}"]
arguments = [{ name = "format", placeholder = "24h, 12h or locale" }]

[extensions.kubaos.actions.clock-date-order]
title = "Date order"
subtitle = "Whether dates put the day or the month first: day-month, month-day, or locale"
icon = "x-office-calendar"
keywords = ["clock", "date format", "day first", "month first"]
run = ["sh", "-c", 'out=$(kubaos-clock "$@" 2>&1) || notify-send -a Clock -u critical Clock "$out"', "sh", "set", "date-order", "{order}"]
arguments = [{ name = "order", placeholder = "day-month, month-day or locale" }]

[extensions.kubaos.actions.clock-timer]
title = "Start timer"
subtitle = "Rings with a notification and a sound: 25m, 1h30m, 90 seconds"
icon = "alarm-symbolic"
keywords = ["timer", "countdown", "pomodoro", "kitchen timer"]
keyword = "clock-timer"
run = ["qs", "ipc", "call", "clock", "timer", "{duration}"]
arguments = [{ name = "duration", placeholder = "25m" }]

[extensions.kubaos.actions.clock-alarm]
title = "Set alarm"
subtitle = "Rings at a time with a notification and a sound: 7:30, 6pm, friday 17:00"
icon = "alarm-symbolic"
keywords = ["alarm", "wake up", "reminder", "clock"]
keyword = "clock-alarm"
run = ["qs", "ipc", "call", "clock", "alarm", "{time}"]
arguments = [{ name = "time", placeholder = "7:30" }]

[extensions.kubaos.actions.clock-stopwatch]
title = "Stopwatch"
subtitle = "Start or stop the stopwatch in the clock popup"
icon = "alarm-symbolic"
keywords = ["stopwatch", "lap", "timer", "clock"]
run = ["qs", "ipc", "call", "clock", "stopwatch"]

# The system monitor (crates/kubaos-sysmon, config/quickshell/modules/sysmon/).
# `cpu`, `ram` and `battery` get an answer in the top row, and `kill chrome`
# lists the processes to end or kill, from the Extension itself. The settings
# Items change ~/.config/kubaos/desktop/sysmon/sysmon.toml through `kubaos-sysmon`,
# which the bar's pill shows within a few seconds; a notification says why
# when one is refused.

[extensions.kubaos.actions.sysmon-open]
title = "Open system monitor"
subtitle = "CPU, memory, GPU, disks, network, battery, fans and the busiest processes"
icon = "utilities-system-monitor"
keywords = ["system monitor", "task manager", "activity", "cpu", "ram", "memory", "processes", "temperature"]
run = ["qs", "ipc", "call", "sysmon", "toggle"]

[extensions.kubaos.actions.sysmon-pill]
title = "Show/hide the bar pill"
subtitle = "The system monitor's CPU and memory pill in the bar"
icon = "utilities-system-monitor"
keywords = ["system monitor", "bar", "pill", "cpu", "ram", "hide", "show"]
run = ["sh", "-c", 'out=$(kubaos-sysmon "$@" 2>&1) || notify-send -a "System monitor" -u critical "System monitor" "$out"', "sh", "set", "pill", "toggle"]

[extensions.kubaos.actions.sysmon-metrics]
title = "Pick bar metrics"
subtitle = "What the bar's monitor pill shows, in order: cpu, ram, temp, gpu, net, power"
icon = "utilities-system-monitor"
keywords = ["system monitor", "bar", "pill", "metrics", "temperature", "network", "battery draw"]
run = ["sh", "-c", 'out=$(kubaos-sysmon "$@" 2>&1) || notify-send -a "System monitor" -u critical "System monitor" "$out"', "sh", "set", "metrics", "{metrics}"]
arguments = [{ name = "metrics", placeholder = "cpu ram temp" }]

[extensions.kubaos.actions.sysmon-style]
title = "Bar monitor style"
subtitle = "Draw the bar's monitor pill as numbers, bars or sparklines"
icon = "utilities-system-monitor"
keywords = ["system monitor", "bar", "pill", "sparklines", "graph"]
run = ["sh", "-c", 'out=$(kubaos-sysmon "$@" 2>&1) || notify-send -a "System monitor" -u critical "System monitor" "$out"', "sh", "set", "style", "{style}"]
arguments = [{ name = "style", placeholder = "numbers, bars or sparklines" }]

[extensions.kubaos.actions.sysmon-alerts]
title = "System monitor alerts"
subtitle = "Turn on or off the notifications when the machine runs hot, full or drains fast"
icon = "utilities-system-monitor"
keywords = ["system monitor", "alerts", "notifications", "temperature", "memory full", "disk full"]
run = ["sh", "-c", 'out=$(kubaos-sysmon "$@" 2>&1) || notify-send -a "System monitor" -u critical "System monitor" "$out"', "sh", "set", "alerts", "toggle"]

[extensions.kubaos.actions.sysmon-threshold]
title = "System monitor threshold"
subtitle = "Where the pill turns red and alerts fire: cpu-temp 85, ram 90, disk 95, battery-draw 30"
icon = "utilities-system-monitor"
keywords = ["system monitor", "threshold", "temperature", "alert", "limit"]
run = ["sh", "-c", 'out=$(kubaos-sysmon "$@" 2>&1) || notify-send -a "System monitor" -u critical "System monitor" "$out"', "sh", "set", "{setting}", "{value}"]
arguments = [{ name = "setting", placeholder = "cpu-temp, ram, disk or battery-draw" }, { name = "value", placeholder = "85" }]

# The power stops (crates/kubaos-power): Super Saver, Power Saver, Balanced,
# Performance and Max Performance, the control center's slider, as one Item
# whose subtitle names the stop the service is on. Enter goes back to
# Balanced, and from Balanced to Power Saver. A stop picked here is
# remembered for the power source you're on, battery or plugged in;
# unplugging or plugging in moves to the stop last used on the new source.
# "What this stop does" lists every layer of the stop, as the machine has it
# now (crates/kotodama-kubaos/src/power.rs); the CPU scheduler's status says
# which scheduler runs, Linux's own or LAVD, and why.
# The settings write ~/.config/kubaos/desktop/power/power.toml through
# `kubaos-power`, which puts them to work at once and says so in a toast.

[extensions.kubaos.actions.power]
title = "Power profile"
subtitle = { super-saver = "Super Saver: the least power. 60 Hz, a capped CPU, background work paused", power-saver = "Power Saver: longer battery, no CPU boost, background work paused", balanced = "Balanced: the default, boring and fine", performance = "Performance: faster, hotter, the panel at full rate", max-performance = "Max Performance: everything awake, the GPU at its peak, and the battery can go to hell" }
icon = "power-profile-balanced"
keywords = ["power stop", "power stops", "power profile", "battery", "eco", "power saving", "low power", "super saver", "power saver", "balanced power", "normal", "fast", "turbo", "gaming", "max power", "max performance", "power status", "what this stop does", "epp", "aspm", "vrr"]
state = "power.stop"
order = ["super-saver", "power-saver", "balanced", "performance", "max-performance", "status"]

[extensions.kubaos.actions.power.actions.super-saver]
title = "Super Saver"
keywords = ["super"]
run = ["kubaos-power", "set", "super-saver"]

[extensions.kubaos.actions.power.actions.power-saver]
title = "Power Saver"
keywords = ["saver"]
run = ["kubaos-power", "set", "power-saver"]
primary_when = { is = "balanced" }

[extensions.kubaos.actions.power.actions.balanced]
title = "Balanced"
keywords = ["balanced", "default"]
run = ["kubaos-power", "set", "balanced"]
primary_when = { is_not = "balanced" }

[extensions.kubaos.actions.power.actions.performance]
title = "Performance"
keywords = ["performance"]
run = ["kubaos-power", "set", "performance"]

[extensions.kubaos.actions.power.actions.max-performance]
title = "Max Performance"
keywords = ["max"]
run = ["kubaos-power", "set", "max-performance"]

[extensions.kubaos.actions.power.actions.status]
title = "What this stop does"
keywords = ["status", "details"]
view = "power"

# Where the stop drops on battery at the low-battery level, or that it
# doesn't; the Undo goes back to the stop you had on battery, until you plug
# in; the level is from 5 to 50 %.
[extensions.kubaos.actions.low-battery]
title = "Low battery drop"
subtitle = { power-saver = "To Power Saver: at the low-battery level (20 %) on battery, with an Undo; it isn't remembered as your battery stop", super-saver = "To Super Saver: at the low-battery level (20 %) on battery, all the way down, with an Undo", off = "Off: the stop stays where you put it, however low the battery goes" }
icon = "battery-caution"
keywords = ["low battery", "low-battery", "the low-battery drop", "battery low", "automatic", "20 percent", "threshold", "percent"]
state = "power.low-battery"
order = ["power-saver", "super-saver", "off", "undo", "level"]

[extensions.kubaos.actions.low-battery.actions.power-saver]
title = "Drop to Power Saver"
keywords = ["saver"]
run = ["kubaos-power", "low-battery", "power-saver"]
primary_when = { is_not = "power-saver" }

[extensions.kubaos.actions.low-battery.actions.super-saver]
title = "Drop to Super Saver"
keywords = ["supersaver"]
run = ["kubaos-power", "low-battery", "super-saver"]
primary_when = { is_not = "super-saver" }

[extensions.kubaos.actions.low-battery.actions.off]
title = "Don't drop"
keywords = ["off", "disable", "stop"]
run = ["kubaos-power", "low-battery", "off"]
primary_when = { is_not = "off" }

[extensions.kubaos.actions.low-battery.actions.undo]
title = "Undo the drop"
keywords = ["undo"]
run = ["kubaos-power", "undo"]

[extensions.kubaos.actions.low-battery.actions.level]
title = "Drop at…"
keywords = ["at", "level"]
run = ["kubaos-power", "low-battery", "{percent}"]
arguments = [{ name = "percent", placeholder = "20" }]

[extensions.kubaos.actions.panel-power-saving]
title = "Panel power saving"
subtitle = { true = "On: Super Saver and Power Saver dim the backlight and lift the contrast to match, for longer battery", false = "Off: true colours in every stop, for colour-accurate work; the saver stops leave the panel's backlight alone" }
icon = "video-display"
keywords = ["panel power saving", "abm", "colour accurate", "color accurate", "photo editing", "backlight", "battery"]
state = "power.panel-power-saving"

[extensions.kubaos.actions.panel-power-saving.actions.on]
title = "Turn on"
keywords = ["on", "enable", "start"]
run = ["kubaos-power", "panel-power-saving", "on"]
primary_when = { is = false }

[extensions.kubaos.actions.panel-power-saving.actions.off]
title = "Turn off"
keywords = ["off", "disable", "stop"]
run = ["kubaos-power", "panel-power-saving", "off"]
primary_when = { is = true }

# How far the battery charges, and measuring its draw: the battery's average
# draw over 2 minutes, or as long as you say in seconds, and what woke the
# machine most, as a report. Unplug first.
[extensions.kubaos.actions.battery]
title = "Battery"
subtitle = { 80 = "Charges to 80 %: kinder to the battery on a laptop that lives plugged in", 90 = "Charges to 90 %", 100 = "Charges full, for a day away from the desk" }
icon = "battery-good-charging"
keywords = ["charge limit", "charge limit: 80 %", "charge limit: 90 %", "charge limit: full", "battery health", "charging", "80 percent", "90 percent", "100 percent", "full charge", "stationary", "power draw", "battery drain", "watts", "wakeups", "powertop"]
state = "power.charge-limit"
order = ["80", "90", "full", "measure", "measure-for"]

[extensions.kubaos.actions.battery.actions.80]
title = "Charge to 80 %"
keywords = ["80"]
run = ["kubaos-power", "charge-limit", "80"]
primary_when = { is_not = "80" }

[extensions.kubaos.actions.battery.actions.90]
title = "Charge to 90 %"
keywords = ["90"]
run = ["kubaos-power", "charge-limit", "90"]

[extensions.kubaos.actions.battery.actions.full]
title = "Charge full"
keywords = ["full", "100"]
run = ["kubaos-power", "charge-limit", "100"]
primary_when = { is = "80" }

[extensions.kubaos.actions.battery.actions.measure]
title = "Measure power draw"
keywords = ["measure"]
terminal = true
run = ["kubaos", "power", "measure"]

[extensions.kubaos.actions.battery.actions.measure-for]
title = "Measure power draw for…"
keywords = ["seconds"]
terminal = true
run = ["kubaos", "power", "measure", "--seconds", "{seconds}"]
arguments = [{ name = "seconds", placeholder = "300" }]

[extensions.kubaos.actions.cpu-scheduler-lavd]
title = "CPU scheduler: LAVD"
subtitle = { lavd = "On: scx_lavd puts input, the compositor and audio first, in each power stop's mode. If it fails, Linux's own scheduler takes over by itself", kernel = "Off: Linux's own scheduler (EEVDF), as the kernel ships it" }
icon = "cpu"
keywords = ["cpu scheduler", "scheduler status", "lavd", "scx", "sched_ext", "sched ext", "latency", "responsiveness", "eevdf", "default scheduler"]
state = "power.scheduler"
order = ["on", "off", "status"]

[extensions.kubaos.actions.cpu-scheduler-lavd.actions.on]
title = "Turn on"
keywords = ["on", "enable", "start"]
run = ["kubaos-power", "scheduler", "on"]
primary_when = { is_not = "lavd" }

[extensions.kubaos.actions.cpu-scheduler-lavd.actions.off]
title = "Turn off"
keywords = ["off", "disable", "stop"]
run = ["kubaos-power", "scheduler", "off"]
primary_when = { is = "lavd" }

[extensions.kubaos.actions.cpu-scheduler-lavd.actions.status]
title = "Status"
keywords = ["status"]
view = "cpu-scheduler"

