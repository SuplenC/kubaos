# @generated by `kubaos-tokens` from `design/tokens.toml`. Change the tokens there and run
# `cargo run -p kubaos-tokens -- write`; a test fails while this file differs from them.
# oh-my-posh's prompt before dot-theme has run: config/ohmyposh/config.toml.tmpl, the prompt's
# matugen template, in the tokens' dark palette. Change the template, not this.

#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 3
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

# Pills like the tmux status bar and the Quickshell bar: rounded caps, a
# raised surface, the accent only on icons and state. The tmux session pill
# above stays the one filled accent block.
[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    type = 'path'
    style = 'diamond'
    leading_diamond = ''
    trailing_diamond = ''
    foreground = 'p:text'
    background = 'p:surface'
    template = ' <p:accent></>  {{ path .Path .Location }} '

    [blocks.segments.properties]
      # ~/P/d/config/nvim: short enough for a 40% tmux pane.
      style = 'agnoster_short'
      max_depth = 3
      folder_separator_icon = '/'

  [[blocks.segments]]
    type = 'git'
    style = 'diamond'
    leading_diamond = ' '
    trailing_diamond = ''
    foreground = 'p:ok'
    foreground_templates = [
      '{{ if or (.Working.Changed) (.Staging.Changed) }}p:warn{{ end }}',
      '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:err{{ end }}',
      '{{ if or (gt .Ahead 0) (gt .Behind 0) }}p:accent2{{ end }}',
    ]
    background = 'p:surface'
    # Every icon is followed by two spaces: Ghostty draws a Nerd Font icon
    # that has a space after it across two cells, so with a single space the
    # icon touches the next character (the old branch-icon overlap).
    template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }}  {{ end }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  <p:muted></>  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  <p:muted></>  {{ .Staging.String }}{{ end }} '

    [blocks.segments.properties]
      branch_icon = '  '
      branch_max_length = 25
      fetch_status = true
      fetch_upstream_icon = true

  # No pill: a coloured check, or the exit code in red.
  [[blocks.segments]]
    type = 'status'
    style = 'plain'
    foreground = 'p:ok'
    foreground_templates = ['{{ if gt .Code 0 }}p:err{{ end }}']
    template = ' {{ if gt .Code 0 }} {{ .Code }}{{ else }}{{ end }}'

    [blocks.segments.properties]
      always_enabled = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground = 'p:accent'
    foreground_templates = ['{{ if gt .Code 0 }}p:err{{ end }}']
    template = '❯'

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    type = 'node'
    style = 'plain'
    foreground = 'p:ok'
    template = ' '

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_package_manager = false
      home_enabled = false

  [[blocks.segments]]
    type = 'go'
    style = 'plain'
    foreground = 'p:accent2'
    template = ' '

    [blocks.segments.properties]
      fetch_version = false

  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    foreground = 'p:warn'
    template = ' '

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_version = false
      fetch_virtual_env = false

  [[blocks.segments]]
    type = 'shell'
    style = 'plain'
    foreground = 'p:muted'
    template = 'in <p:text>{{ .Name }}</> '

  [[blocks.segments]]
    type = 'time'
    style = 'plain'
    foreground = 'p:muted'
    template = 'at <p:text>{{ .CurrentDate | date "15:04" }}</>'

[transient_prompt]
  foreground = 'p:accent'
  foreground_templates = ['{{ if gt .Code 0 }}p:err{{ end }}']
  template = '❯ '

[secondary_prompt]
  foreground = 'p:muted'
  template = '❯❯ '

# The colour roles by matugen's names; the git states and the exit code take
# the terminal's hues.
[palette]
  # The pills' background and their text.
  surface = '#312821'
  text = '#f0dfd4'
  # Icons, and the right prompt's words: secondary text.
  muted = '#dac2b1'
  # The folder's icon and the prompt's character; ahead or behind in the cold
  # accent.
  accent = '#ffb779'
  accent2 = '#85cfff'
  # A clean repo and success, a dirty repo, diverged and a failed command.
  ok = '#9ece6a'
  warn = '#e0af68'
  err = '#f7768e'
