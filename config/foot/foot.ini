# foot: the fallback terminal (SUPER+ALT+Return). apt owns it, so this file
# must work without Nix or Quickshell. It looks like Ghostty: the design
# tokens' font, size, padding and glass (Hyprland blurs it), and the same
# palette from the wallpaper theme.

# The tokens: type, padding and a dark fallback palette (generated from
# design/tokens.toml). Then the wallpaper's palettes, dark and light,
# generated by dot-theme (config/matugen/templates/foot.ini). Before the
# first run that file is missing; foot then logs one error and keeps the
# fallback.
include=~/.config/foot/tokens.ini
include=~/.local/state/theme/foot.ini

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

# Your settings, last so they win (~/.config/kubaos, docs/CONTRACTS.md).
[main]
include=~/.config/kubaos/terminal/foot/foot.ini
