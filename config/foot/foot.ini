# foot: the fallback terminal (SUPER+ALT+Return). apt owns it, so this file
# must work without Nix or Quickshell. It looks like Ghostty: same font and
# size, padding, translucent background (Hyprland blurs it), colors from the
# wallpaper theme.

# Colors: generated by dot-theme (config/matugen/templates/foot.ini). Before
# the first run the file is missing; foot then logs one error and keeps its
# defaults.
include=~/.local/state/theme/foot.ini

# Falls back to any monospace font if the Nix-installed Nerd Font is absent.
font=MesloLGM Nerd Font:size=11, monospace:size=11
line-height=13.5
pad=12x8 center

[colors]
alpha=0.85

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
