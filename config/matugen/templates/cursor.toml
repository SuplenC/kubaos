# Generated by matugen (dot-theme). Do not edit.
# The pointer's colours per style, which `kubaos cursor` recolours Bibata with:
# the body, its outline, the disc behind the busy cursors' spinner, and the
# spinner's four segments clockwise from the top right (Bibata's rainbow,
# also on the diagonal resize cursors). The spinner is the accent at four
# lightnesses, light and dark in turn, so it reads as turning on the dark
# disc. Not the M3 container roles: the fidelity scheme can make those white.

# Readable on any wallpaper: a dark body, a light outline, the accent spinner.
[dark]
fill = "{{colors.surface.default.hex}}"
outline = "{{colors.on_surface.default.hex}}"
watch = "{{colors.surface.default.hex}}"
spinner = ["{{colors.primary.default.hex}}", "{{colors.primary.default.hex | set_lightness: 48.0}}", "{{colors.primary.default.hex | set_lightness: 88.0}}", "{{colors.primary.default.hex | set_lightness: 64.0}}"]

# The accent itself, outlined dark.
[accent]
fill = "{{colors.primary.default.hex}}"
outline = "{{colors.on_primary.default.hex}}"
watch = "{{colors.on_primary.default.hex}}"
spinner = ["{{colors.primary.default.hex}}", "{{colors.primary.default.hex | set_lightness: 48.0}}", "{{colors.primary.default.hex | set_lightness: 88.0}}", "{{colors.primary.default.hex | set_lightness: 64.0}}"]
