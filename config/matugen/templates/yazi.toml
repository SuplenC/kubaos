# Generated by matugen (dot-theme). Do not edit.
# ~/.config/yazi/theme.toml is a link to this file (config/yazi/theme.toml).
# Only colors; everything else comes from yazi's preset.

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bold = true }
marker_copied = { fg = "{{colors.green.default.hex}}", bg = "{{colors.green.default.hex}}" }
marker_cut = { fg = "{{colors.red.default.hex}}", bg = "{{colors.red.default.hex}}" }
marker_marked = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_copied = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.green.default.hex}}" }
count_cut = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.red.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
border_symbol = "│"
border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "\uE0B6", close = "\uE0B4" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

# The hovered row: a tinted bar under the normal text (was reversed blue).
[indicator]
parent = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
current = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}", bold = true }
preview = { underline = true }

[status]
sep_left = { open = "\uE0B6", close = "\uE0B4" }
sep_right = { open = "\uE0B6", close = "\uE0B4" }
perm_sep = { fg = "{{colors.outline_variant.default.hex}}" }
perm_type = { fg = "{{colors.tertiary.default.hex}}" }
perm_read = { fg = "{{colors.primary.default.hex}}" }
perm_write = { fg = "{{colors.red.default.hex}}" }
perm_exec = { fg = "{{colors.green.default.hex}}" }
progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
