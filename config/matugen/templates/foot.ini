; @generated by `kubaos-tokens` from `design/tokens.toml`. Change the tokens there and run
; `cargo run -p kubaos-tokens -- write`; a test fails while this file differs from them.
; matugen's template of foot's palettes, rendered by dot-theme to ~/.local/state/theme/foot.ini,
; which config/foot/foot.ini includes. foot can't read its colours again, so both are here:
; [colors] dark, [colors2] light. A new window opens in the mode dot-theme ran in, and dot-theme
; signals the open ones (SIGUSR1 dark, SIGUSR2 light).

[main]
initial-color-theme=<* if {{ is_dark_mode }} *>1<* else *>2<* endif *>

[colors]
alpha=0.8
background={{colors.surface.dark.hex_stripped}}
foreground={{colors.on_surface.dark.hex_stripped}}
selection-background={{colors.secondary_container.dark.hex_stripped}}
selection-foreground={{colors.on_secondary_container.dark.hex_stripped}}
urls={{colors.tertiary.dark.hex_stripped}}
cursor={{colors.on_primary.dark.hex_stripped}} {{colors.primary.dark.hex_stripped}}
jump-labels={{colors.on_primary.dark.hex_stripped}} {{colors.primary.dark.hex_stripped}}
scrollback-indicator={{colors.on_secondary_container.dark.hex_stripped}} {{colors.secondary_container.dark.hex_stripped}}
search-box-match={{colors.on_secondary_container.dark.hex_stripped}} {{colors.secondary_container.dark.hex_stripped}}
search-box-no-match={{colors.on_error.dark.hex_stripped}} {{colors.error.dark.hex_stripped}}
regular0={{colors.surface_container_highest.dark.hex_stripped}}
regular1={{colors.red.dark.hex_stripped}}
regular2={{colors.green.dark.hex_stripped}}
regular3={{colors.yellow.dark.hex_stripped}}
regular4={{colors.blue.dark.hex_stripped}}
regular5={{colors.magenta.dark.hex_stripped}}
regular6={{colors.cyan.dark.hex_stripped}}
regular7={{colors.on_surface_variant.dark.hex_stripped}}
bright0={{colors.on_surface_variant.dark.hex_stripped | lighten: -16.0}}
bright1={{colors.red.dark.hex_stripped | lighten: 6.0}}
bright2={{colors.green.dark.hex_stripped | lighten: 6.0}}
bright3={{colors.yellow.dark.hex_stripped | lighten: 6.0}}
bright4={{colors.blue.dark.hex_stripped | lighten: 6.0}}
bright5={{colors.magenta.dark.hex_stripped | lighten: 6.0}}
bright6={{colors.cyan.dark.hex_stripped | lighten: 6.0}}
bright7={{colors.on_surface.dark.hex_stripped}}

