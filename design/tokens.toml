# Roles a front end draws only as decoration, with no text or meaning drawn on
# them: no pair is needed. `outline_variant`, dividers and soft edges;
# `shadow` and `scrim`;
# `cold_container` and `surface_bright`, the segments of Kōbō's partition bar,
# which its legend names; the cores (`primary_core`, `cold_core`, `sharing_core`,
# `error_core`, `success_core`, `warning_core`, `logo_core_warm`,
# `logo_core_cold`), the hot middle of a neon tube, drawn on the tube, and the
# focus core, the line inside a filled control's edge; the unlit tones
# (`primary_unlit` and the rest), a tube at rest; and a lit control's line by
# day and night, signs on or off (`primary_fill_line`, `primary_fill_glass`,
# `primary_glass`, `cold_glass`, `burn_error_line`, `burn_error_glass` and the rest), which
# marks the state its fill and label already show. `kubaos-design contrast`
# fails on a role drawn with that is in no pair and not here.
decorative = ["burn_error_glass", "burn_error_line", "burn_success_glass", "burn_success_line", "burn_warning_glass", "burn_warning_line", "cold_container", "cold_core", "cold_glass", "cold_unlit", "error_core", "error_glass", "error_unlit", "logo_core_cold", "logo_core_warm", "microphone_core", "microphone_unlit", "outline_variant", "primary_core", "primary_fill_glass", "primary_fill_line", "primary_glass", "primary_unlit", "recording_core", "recording_unlit", "scrim", "shadow", "sharing_core", "sharing_glass", "sharing_unlit", "success_core", "success_glass", "success_unlit", "surface_bright", "warning_core", "warning_glass", "warning_unlit"]

# The terminals, Ghostty and foot, and every TUI drawn in them: tmux, Neovim,
# btop, lazygit, bat, fzf, oh-my-posh, fastfetch. `kubaos-tokens` writes
# Ghostty's and foot's settings from this table (config/ghostty/tokens,
# config/foot/tokens.ini), the matugen templates of their palette and of the
# roles the TUIs read, and the hues in config/matugen/config.toml, so both
# terminals draw the same text on the same palette.
[terminal]
# The terminal's text: a command's style, Geist Mono 14 on a 20 line. The
# terminals size fonts in points, 3/4 of a logical pixel: 10.5.
type = "mono_large"
# The font the terminals take the glyphs Geist Mono lacks from: the prompt's
# and the file managers' icons, the pills' round caps. Geist Mono's own Nerd
# Font, so a glyph sits on the same metrics as the letters beside it. Its
# icons are a cell and a half wide, as Ghostty draws its own, not squeezed
# into one as the Mono variant's are.
glyphs = "GeistMono Nerd Font"
# Between the window's edge and the cells, from [space].
padding_x = 12
padding_y = 8
# The window's background, by its name in [opacity]: glass over the blurred
# wallpaper, as a panel of Kōbō's.
opacity = "glass"
# How far a bright ANSI colour (8 to 15) stands from its normal one, in HSL
# lightness points, matugen's `lighten`: lighter in dark, darker in light, so
# a bright colour always stands further from the surface.
bright = 6
# ANSI 8, dim text (a comment, a suggestion as you type): `white` moved this
# many lightness points toward the surface. As far as keeps 4.5:1 on it in
# both modes (4.7:1 in light); `outline`, which would be dimmer, is never
# text.
dim = 16

# The terminal's own colours, by role: the cursor in the accent, a selection
# as a selected row's tinted bar under the text, links in the cold accent.
# `black`, `white` and `bright_white` are ANSI 0, 7 and 15. Black is a
# graphic's colour, 3:1 on the surface in both modes, since what a program
# prints in it must still show.
[terminal.roles]
background = "surface"
foreground = "on_surface"
cursor = "primary"
cursor_text = "on_primary"
selection = "secondary_container"
selection_text = "on_secondary_container"
url = "cold"
divider = "outline_variant"
black = "outline"
white = "on_surface_variant"
bright_white = "on_surface"

# ANSI 1 to 6, the hues code is read in. Each is a seed (Tokyo Night's) that
# matugen harmonizes toward the wallpaper's source colour as a custom colour,
# so the six stay distinct and readable and still lean toward the wallpaper.
[terminal.hues]
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"

