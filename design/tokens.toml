# KubaOS's design tokens: every colour role, length, type style, duration and
# curve the front ends draw with. Each value lives here once. `kubaos-tokens`
# checks the rules below and writes the toolkits' copies, each where it is read
# (docs/DESIGN.md, "Where the outputs are generated"):
#
#   just tokens                            write every output a checkout keeps
#   cargo run -p kubaos-tokens -- check    fail when a rule is broken or a
#                                          checked-in output is stale
#
# The outputs are the Rust module of `kubaos-ui` (crates/kubaos-ui/src/tokens.rs
# includes it), Kōbō's neon sign (crates/kubaos-kobo/src/done/neon.rs) and the
# pointer's grid and scales (crates/kubaos-cursor/src/tokens.rs), each written
# by its crate's build script; the `Tokens` and `Symbols` singletons of
# `KubaOS.Components` (qml/KubaOS/Components/Tokens.qml and Symbols.qml), the
# terminals' settings and matugen templates (see [terminal]) and Hyprland's
# durations, curves, focus glow, opacities and strike (config/hypr/tokens.lua),
# written by the Nix build; and the boot screens' values (the Plymouth script's
# token block, kubaos.plymouth and GRUB's theme.txt), checked in.
# branding/boot.py and branding/make.py read this file for the boot screens'
# pictures and the logo.
#
# Lengths are logical pixels. The supported scales are 1, 1.25, 1.5 and 2, so
# a length lands on whole device pixels at every one of them only when it is a
# multiple of 4; the generator refuses anything else. Hairlines are the
# exception: one device pixel at every scale, whatever that is in logical
# pixels.

[rules]
# Every spacing, size, radius, icon size, line height and shadow is a
# multiple of this.
grid = 4
# The only font sizes. A type style with any other size is refused. 64 is the
# hero's alone: semibold for words, light for numbers. 80 is the lock screen's
# clock, the one thing that screen shows.
font_sizes = [11, 12, 13, 14, 16, 20, 24, 32, 48, 64, 80]
# The scales every length is checked against: `grid` times each one must be a
# whole number of device pixels.
scales = [1.0, 1.25, 1.5, 2.0]
# The sizes allowed off the grid: a slider's step dot and its regular anchor
# dot. Each is drawn centred on a point that moves with the slider's width and
# value, so its edges land between device pixels whatever its size, and a size
# on the grid would buy nothing.
off_grid = ["size.slider_stop", "size.slider_anchor"]

# Lines thinner than the grid. Neither is a multiple of 4, so neither is a
# length: each is drawn as whole device pixels at the scale it shows at.
[stroke]
# Dividers, outlines of cards, fields and the switch track: one device pixel
# at every scale.
hairline_device_px = 1
# The spinner's arc, a field's caret, a partial checkbox's dash and the line
# where a dragged row will land: 2 logical pixels, rounded half up to whole
# device pixels (2, 3, 3, 4 at 1, 1.25, 1.5, 2). A tick is the `check`
# symbol, drawn with the symbol stroke below like every other icon.
thin = 2
# A symbol's stroke on its 24 unit grid: 2 at 24 px. At another size it
# scales with the symbol, then rounds half up to whole device pixels, so a
# symbol is never drawn with a fractional stroke.
symbol = 2

# The neon focus: the focused control's own edge lit as a neon tube in the
# focus colour, with its glow outside it. The tube is drawn on the control's
# edge, inside its box and over its outline, so there is only ever one line and
# nothing dark between the tube and the glow; neither takes layout space, so
# focus moving never moves anything.
[focus]
# The tube's width in logical pixels, drawn rounded half up to whole device
# pixels: 2, 2, 2, 3 device pixels at 1, 1.25, 1.5, 2.
tube = 1.5
# The glow: a near one and a far, faint one, each fading from its opacity at
# the tube to nothing at its reach outside it, in logical pixels.
near = 8
near_opacity = 0.45
far = 20
far_opacity = 0.14
# The band a picture keeps round itself inside its own box where its
# neighbours leave no more room: a wallpaper thumbnail inside its grid cell,
# the boot prompt's field drawn as one picture with its ring. A focused one's
# glow is cut past it. A scroll is not held to it: one with no visible edge of
# its own reaches past its box as far as the glow (`far`), or up to the part
# of the page beside it, so it never cuts a resting control's glow.
offset = 4

# The spacing scale: gaps, paddings and insets.
[space]
values = [4, 8, 12, 16, 20, 24, 32, 40, 48, 64]

# Corner radii, by role: every chosen radius says what the shape is. There
# are three, plus `full`. Any other radius is derived, never picked: a shape
# that fills another less an inset takes the outer radius minus the inset, so
# the corners share a centre (`kubaos_ui::look::nested`, which refuses a
# nesting that doesn't resolve). A surface's content 8 in takes 16; 12 in, 12.
[radius]
# Marks inside controls: the checkbox, a hint, focus details, inline tags.
small = 4
# Everything you click or type in: buttons, fields, list rows, menu items,
# chips.
control = 12
# Everything that holds content: cards, dialogs, popups, panels, list wells,
# the screen frame.
surface = 24
# Pills and circles: switches, icon buttons, sliders, avatars,
# badges.
full = true

# Icon sizes: the symbol's box, its 24 unit grid scaled to it. The drawing
# keeps 2 units clear inside, Tabler's margin.
[icon]
sizes = [16, 20, 24, 32, 48]
# A row's icon beside a title over a subtitle (`body_strong` over `small`, a
# 40 block): it spans both lines, a step up from the title's own 20, so an
# app's icon in the Command menu reads at the size of the two lines beside it.
two_line = 24

# Fixed dimensions of components, by name.
[size]
# Buttons and fields: small, regular and large. A field is as tall as a
# regular button, so the two line up side by side. Large is the one main
# action of a big page (Kōbō's Install).
control_sm = 32
control_md = 40
control_lg = 48
# A list row with one line, and with a title over a subtitle.
row = 44
row_two_line = 56
# A table's row: a line of body text with 4 above and below, so a list of readings (the
# system monitor's processes) stays dense and each row is still easy to hit.
row_compact = 28
# A menu's width: an item's symbol, its words and a shortcut's keycaps side by side.
menu = 240
chip = 24
# A badge over an icon's corner: a count's pill, a line of label text tall, and
# a dot, the size of a picked radio button's.
badge = 16
badge_dot = 8
switch_width = 44
switch_height = 24
# The switch's knob off and on: it grows as it turns on, leaving 6 and 4 of
# track around it.
switch_knob_off = 12
switch_knob_on = 16
# A checkbox's box and a radio button's disc, and the dot of a picked radio
# button.
check = 20
radio_dot = 8
progress = 8
dialog = 500
# A password field alone on a screen, under the lock screen's clock: room for
# a long password's bullets, and wider than the clock without outweighing it,
# so the two read as one column, where the dialog's 500 dwarfed the time.
password = 320
# The widest a column of text and fields grows.
column = 560
# Kōbō's step rail on a wide screen.
rail = 236
# A log opened under an error or a progress bar.
log = 232
# A panel of the shell, and a notification beside one: the control center's
# side sheet, the cards of the notification stack.
panel = 384
# The shell's bar along the top of every screen: a small control (32) with 4
# above and below, so its pills and buttons centre on whole device pixels.
bar = 40
# The widest a name the bar shows grows (a live preview's branch): past it, it
# ends in an ellipsis, so the bar's right side never runs into the clock.
bar_label = 160
# A wallpaper's thumbnail in the shell's picker, 16:10 as the screens are.
thumbnail_width = 256
thumbnail_height = 160
# A slider is a pill: the fill is the pill, its round end marks the value, the
# icon sits in the circle at its start and the value or its name at its end.
# Regular, and compact for a dense panel (the control center, the system
# monitor): as tall as a compact row.
slider = 36
slider_compact = 28
# The dot of each step, on either side of the fill.
slider_stop = 6
# The solid dot of the mark the value rests on: a step, or a sticky point
# while the value holds there. Regular and compact.
slider_anchor = 10
slider_anchor_compact = 8
# How near a drag holds on a sticky point before it pulls free.
slider_hold = 12
# A scrollbar's thumb, a pill: thin, since the keyboard and the wheel do the scrolling and the
# thumb only says where you are.
scrollbar = 4
# A keycap: as tall as a line of body text, so it sits inline with body and
# caption text without making the line taller, and never narrower than tall,
# so a one-letter key is square.
keycap = 20
# The クバ mark drawn as lit neon tubes on Kōbō's done screen, with room inside for the glow
# around them: the mark's 120 unit drawing at 200, as in the draft Kuba picked.
neon_mark = 200
# The 完了 hanko stamped beside it.
hanko = 120
# A sparkline in a panel: the system monitor's graphs, the last minute of a reading at a glance,
# as tall as a large control so a graph and the buttons beside it line up.
sparkline = 48

# A page's or a panel's body: its padding on every side, by its own width.
# Tailwind's container, `px-4 sm:px-6 lg:px-8`, on Tailwind's default
# breakpoints: 16 under 640 (`sm`), 24 from 640, 32 from 1024 (`lg`). A
# panel of the shell (384) takes 16; Kōbō's content pane, 32 on a 1080p
# screen and 24 on a 1280 px one.
# https://tailwindcss.com/docs/responsive-design
[container]
# The width, in logical pixels, each padding applies from.
from = [0, 640, 1024]
# The padding inside every edge at that width and up, from `[space]`.
padding = [16, 24, 32]

# Aspect ratios, width to height, a picture's box keeps before and after it
# loads, so nothing around it moves when it arrives.
[aspect]
# A wallpaper: 16:10, as the screens it is picked for are.
wallpaper = [16, 10]

# Type families. Nothing else draws text; symbols are drawn, see [symbols].
[font.family]
sans = "Geist"
mono = "Geist Mono"
jp = "M PLUS 1"

# Type styles: size and line height in logical pixels, a weight and a family
# from above. A single-line control's label takes the control's content box as
# its line height, so it centres on the grid.
#
# `icon` is the symbol that sits beside the style on its line: a component
# takes its icon's size from its text's style, never a size of its own, so an
# icon reads as heavy as the letters next to it. The box is about 1.4 times the
# font size, held to an icon size no taller than the line, so an icon never
# makes a line taller; its stroke is whole device pixels at every scale (see
# `stroke.symbol`).
#
# `tabular = true` draws a style's figures tabular (OpenType `tnum`), all one
# width, for a number that changes in place. Off by default. iced's text has no
# font features, so iced draws them proportional, and a component showing such
# a number holds it in a box as wide as its widest value.
[type.clock]
size = 80
line = 88
icon = 48
weight = "light"
family = "sans"
use = "The lock screen's clock, the one thing that screen shows: a step above the hero, light like every big figure. The clock popup's time stays the hero's number style."

[type.hero]
size = 64
line = 72
icon = 48
weight = "semibold"
family = "sans"
use = "Words at the hero size: Kōbō's welcome line and its done screen's headline, and nothing else."

[type.hero_number]
size = 64
line = 72
icon = 48
weight = "light"
family = "sans"
use = "Numbers at the hero size, light so a big figure doesn't shout: Kōbō's install percent, the clock popup's time."

[type.display]
size = 48
line = 56
icon = 48
weight = "semibold"
family = "sans"
use = "The heading of a full-screen moment other than Kōbō's welcome and done screens."

[type.title]
size = 32
line = 40
icon = 32
weight = "semibold"
family = "sans"
use = "A screen's or page's title."

[type.headline]
size = 24
line = 32
icon = 32
weight = "semibold"
family = "sans"
use = "A dialog's title, a big number."

[type.heading]
size = 20
line = 28
icon = 24
weight = "semibold"
family = "sans"
use = "A section's title inside a page."

[type.subheading]
size = 16
line = 24
icon = 24
weight = "semibold"
family = "sans"
use = "A card's or an error's first line."

[type.body_large]
size = 16
line = 24
icon = 20
weight = "regular"
family = "sans"
use = "A lede under a display line, the text in a field."

[type.body]
size = 14
line = 20
icon = 20
weight = "regular"
family = "sans"
use = "Running text, explanations, toasts."

[type.body_strong]
size = 14
line = 20
icon = 20
weight = "medium"
family = "sans"
use = "A list row's title, a value next to its label."

[type.button]
size = 14
line = 24
icon = 20
weight = "semibold"
family = "sans"
use = "A regular button's label, on a 24 px line so it centres in a 40 px control."

[type.button_large]
size = 16
line = 24
icon = 24
weight = "semibold"
family = "sans"
use = "A large button's label, centred in a 48 px control."

[type.button_small]
size = 12
line = 16
icon = 16
weight = "semibold"
family = "sans"
use = "A small button's label, centred in a 32 px control."

[type.label]
size = 12
line = 16
icon = 16
weight = "medium"
family = "sans"
use = "A field's label, a chip, a quiet button."

# A number that changes in place at the label's size: the label's style with
# tabular figures (`tnum`), so the number keeps its width as it ticks.
[type.label_number]
size = 12
line = 16
icon = 16
weight = "medium"
family = "sans"
tabular = true
use = "A number that changes in place: a slider's value."

[type.small]
size = 12
line = 16
icon = 16
weight = "regular"
family = "sans"
use = "A note under a field, a subtitle under a row's title."

[type.caption]
size = 11
line = 16
icon = 16
weight = "regular"
family = "sans"
use = "Version lines, what a key hint's key does, the smallest print."

[type.keycap]
size = 11
line = 20
icon = 16
weight = "medium"
family = "mono"
use = "The key on a keycap, on the keycap's 20 px line so it centres in it."

[type.accent]
size = 13
line = 20
icon = 16
weight = "medium"
family = "jp"
use = "The Japanese accent above a title."

[type.mono]
size = 12
line = 16
icon = 16
weight = "regular"
family = "mono"
use = "Logs, device paths, timings, keycaps."

[type.mono_large]
size = 14
line = 20
icon = 20
weight = "regular"
family = "mono"
use = "Commands and keys shown as the subject of a line."

# Durations in milliseconds. Every animation picks one of these by what it is,
# never by feel; the speed setting scales them all, and reduce motion turns
# anything from `short` up into a `short` fade.
[duration.instant]
ms = 0
use = "Changes that must not lag: the caret, text appearing as it is typed, reduce motion's moves."

[duration.micro]
ms = 100
use = "Hover and press state layers, a colour change under the pointer."

[duration.short]
ms = 200
use = "A toggle's knob, a checkbox's mark, focus moving, a toast fading in."

[duration.medium]
ms = 300
use = "A panel or popup leaving, a log opening, a list reordering, a toast fading out."

[duration.long]
ms = 500
use = "A panel or dialog arriving, a page sliding in."

[duration.slow]
ms = 800
use = "A wallpaper fading in, the light/dark crossfade, a live list's new row fading in."

[duration.scene]
ms = 1200
use = "A whole scene changing once: the lock screen lifting, Kōbō's welcome settling."

# Easing curves, as CSS cubic béziers (x1, y1, x2, y2).
[easing.standard]
curve = [0.2, 0.0, 0.0, 1.0]
use = "Small state changes that stay on screen: toggles, colour, focus."

[easing.standard_decel]
curve = [0.0, 0.0, 0.0, 1.0]
use = "Something already moving settling in: a list reordering, a slider settling on its step."

# Past its end and back: a small mark popping in.
[easing.pop]
curve = [0.2, 0.9, 0.3, 1.3]
use = "A small mark popping in, a little past its size and back: a slider's anchor dot."

[easing.standard_accel]
curve = [0.3, 0.0, 1.0, 1.0]
use = "Something small leaving for good: a toast fading out."

[easing.emphasized_decel]
curve = [0.05, 0.7, 0.1, 1.0]
use = "Things arriving on screen: panels, dialogs, pages, the log opening."

[easing.emphasized_accel]
curve = [0.3, 0.0, 0.8, 0.15]
use = "Things leaving the screen: panels and dialogs closing."

[easing.linear]
curve = [0.0, 0.0, 1.0, 1.0]
use = "Progress that tracks a real quantity, and spinners."

# Opacities laid over a colour role.
[opacity]
# The state layer: the content colour over a surface, on hover and on press.
hover = 0.08
focus = 0.12
press = 0.14
# A fill lit while its control is held: a slider pressed or dragged, its fill
# brightened toward the palette's bright end as a progress bar's glows. A
# state layer's press is too faint on a fill already the accent; under the
# pointer the fill takes `press`.
held = 0.40
# A disabled control's content, and its container.
disabled_content = 0.38
disabled_container = 0.10
# A well's surface over the panel, and a soft hairline.
well = 0.75
outline_soft = 0.55
# A shape that is only a suggestion of one: a workspace's ghost, a scroller
# at rest under the pointer. Its selected text's highlight, and a read-only
# field's outline and surface.
placeholder = 0.55
selection = 0.32
locked = 0.50
# A field's placeholder text. It is text, so it keeps 4.5:1 (see
# `[contrast]`) on every fill a field takes, the focused one included, which
# 0.80 misses in light (4.4:1): it reads as a hint by its muted role, not by
# fading out.
placeholder_text = 0.85
# An accent colour as a faint fill under itself: a tag, a done step.
tint = 0.16
# A picture that sits back while another is picked: the wallpaper picker's
# thumbnails not under the keyboard. A slider's step the fill has passed, on
# the fill, as low as keeps 3:1 there in both modes.
subdued = 0.75
# Secondary text on a selected row or a checked tile, over its container: as
# low as keeps 4.5:1 on every container a row is selected in, in both modes.
subdued_text = 0.85
# What darkens the screen behind a dialog.
scrim = 0.60
# A dialog's hairline in its tint, for a question and for a danger.
dialog_edge = 0.25
danger_edge = 0.60
# A progress bar's track, and a spinner's faint full ring.
track = 0.90
spinner_track = 0.18
# An error's surface (of the error container) and hairline (of the error).
error_fill = 0.30
error_edge = 0.45
# The log's surface, over the page.
log = 0.85
# The shell's frame and the panels growing out of it: glass, which Hyprland
# blurs what shows through.
frame = 0.94
# What darkens the desktop behind an open panel, lighter than a dialog's scrim:
# a panel sits beside the windows rather than over a question.
panel_scrim = 0.20
# Where Hyprland starts blurring behind the frame's layer (its `ignore_alpha`): only the glass.
# The layer also draws a scrim and, over it, the panels' shadow, which cover up to 0.81 together
# (`scrim` under `shadow.panel` at `frame`); a cut-off under that blurs a ragged band of the
# desktop under the bar, which cuts a window's top border off in steps beside an open panel.
frame_blur = 0.85
# A panel's surface over the blurred wallpaper it floats on, so the photo shows through as
# glass: Kōbō's panel.
glass = 0.80
# The furthest the wallpaper is turned toward the surface behind full-screen text, so the words
# read over any photo: at 0.90 every text role keeps 4.5:1 over pure black in light and pure
# white in dark. Kōbō's welcome and done screens, from the text's side; the lock screen, behind
# its words.
backdrop = 0.90
# An inactive window's border, the highest container over what is behind it,
# and its neutral shadow, of the `shadow` role. The active window's tube and
# glow strike on over these (config/hypr/focus.lua).
window_border = 0.80
window_shadow = 0.33

# Shadows: offset down and blur in logical pixels, and the shadow's opacity
# of the `shadow` role.
[shadow.panel]
y = 16
blur = 48
opacity = 0.55

[shadow.dialog]
y = 16
blur = 48
opacity = 0.60

# The glow under a progress bar's fill, in the fill's own colour.
[shadow.glow]
y = 0
blur = 12
opacity = 0.55

# The neon sign. The boot splash switches the sign on a group of tubes at a
# time, and Kōbō's done screen writes the クバ mark in as lit tubes: one
# stutter and one drawing, so the first and the last thing an install shows
# are the same sign.
[neon]
# A tube striking: its brightness through ten even steps over `medium`. It
# stutters, then catches. The focus tube strikes the same way as focus
# arrives, on a control and on the active window's border, unless the user
# turns the stutter off.
strike = [0.6, 0.0, 0.9, 0.2, 0.0, 1.0, 0.4, 1.0, 0.8, 1.0]

# The クバ mark: its strokes in the order a hand writes them (ク's tick and
# sweep, バ's two strokes, the dakuten), as SVG path data of absolute M, L, H
# and Q commands in a drawing `units` square with the strokes `margin` inside
# it. A warm tube is `primary` with `primary_core` along its middle, a cold one
# `cold` with `cold_core`. The logo's SVGs (branding/make.py) and Kōbō's done
# screen draw it from here.
[neon.mark]
units = 120
margin = 10
# A warm tube's width in the drawing's units, and a cold one's of it: the
# dakuten is a fifth thinner.
width = 9.5
cold_width = 0.8
# The white-hot cores' widths, of a warm tube's: a warm one's and a cold
# one's.
core = 0.22
cold_core = 0.18
strokes = [
  { path = "M29 13 L17 33", tone = "warm" },
  { path = "M24 24 H47 Q51 24 49.6 28 L46 39 Q38 66 14 83", tone = "warm" },
  { path = "M66 41 Q64.5 63 53 81", tone = "warm" },
  { path = "M76.5 39 Q84 61 94 79", tone = "warm" },
  { path = "M81 14 L85 25", tone = "cold" },
  { path = "M90 11 L94 22", tone = "cold" },
]

# The boot screens, Plymouth and GRUB, draw in device pixels before anything
# scales them, and always in the dark palette. Their lengths are the tokens'
# times the scale they draw at.
[boot]
# GRUB has one theme for every screen and can't tell how big a screen is, so
# it draws at one scale: the desktop's on the laptop's 2880x1800 panel, 1.5.
# A 1080p screen shows it half as large again as its desktop, and it still
# fits there. One of `rules.scales`, so every length is whole device pixels.
grub_scale = 1.5
# Plymouth draws at 2 on a screen this many device pixels tall or taller, and
# at 1 below. The 2880x1800 panel takes 2, a 1080p or 1440p screen 1.
plymouth_2x_from = 1600

# Colour roles. At runtime matugen derives them from the wallpaper
# (`scripts/dot-theme`, `scheme-fidelity`); these are the fallback, matugen's
# output for the default wallpaper, `shinjuku/kubaos-neon-sign.jpg`, in each
# mode. Each role names the matugen colour it comes from; a role with no
# source is ours and keeps its value whatever the wallpaper.
[color.source]
primary = "primary"
on_primary = "on_primary"
primary_container = "primary_container"
on_primary_container = "on_primary_container"
secondary = "secondary"
on_secondary = "on_secondary"
secondary_container = "secondary_container"
on_secondary_container = "on_secondary_container"
tertiary = "tertiary"
on_tertiary = "on_tertiary"
tertiary_container = "tertiary_container"
on_tertiary_container = "on_tertiary_container"
# The cold accent, the blue of the sign's dakuten: fidelity's tertiary is the
# wallpaper's complementary colour, so cold follows it. Used rarely: focus on
# picked cards, a demo badge.
cold = "tertiary"
on_cold = "on_tertiary"
cold_container = "tertiary_container"
on_cold_container = "on_tertiary_container"
error = "error"
on_error = "on_error"
error_container = "error_container"
on_error_container = "on_error_container"
surface = "surface"
on_surface = "on_surface"
surface_variant = "surface_variant"
on_surface_variant = "on_surface_variant"
surface_dim = "surface_dim"
surface_bright = "surface_bright"
surface_container_lowest = "surface_container_lowest"
surface_container_low = "surface_container_low"
surface_container = "surface_container"
surface_container_high = "surface_container_high"
surface_container_highest = "surface_container_highest"
outline = "outline"
outline_variant = "outline_variant"
shadow = "shadow"
scrim = "scrim"
inverse_surface = "inverse_surface"
inverse_on_surface = "inverse_on_surface"
inverse_primary = "inverse_primary"
# Amber, between fine and the error colour: a reading close to its limit.
# Material 3 has no such role.
warning = ""
# The white-hot core along the middle of a lit neon tube, in `primary` and in `cold`: the
# logo's own (branding/make.py). Light is emitted, so it is the same in both modes.
primary_core = ""
cold_core = ""

[color.dark]
