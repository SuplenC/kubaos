# KubaOS's design tokens: every colour role, length, type style, duration and
# curve the front ends draw with. Each value lives here once. `kubaos-tokens`
# checks the rules below and writes the toolkits' copies, each where it is read
# (docs/DESIGN.md, "Where the outputs are generated"):
#
#   just tokens                            write every output a checkout keeps
#   cargo run -p kubaos-tokens -- check    fail when a rule is broken or a
#                                          checked-in output is stale
#
# The outputs are the Rust module of `kubaos-ui` (crates/kubaos-ui/src/tokens.rs
# includes it), Kōbō's neon sign (crates/kubaos-kobo/src/done/neon.rs) and the
# pointer's grid and scales (crates/kubaos-cursor/src/tokens.rs), each written
# by its crate's build script; the `Tokens` and `Symbols` singletons of
# `KubaOS.Components` (qml/KubaOS/Components/Tokens.qml and Symbols.qml), the
# terminals' settings and matugen templates (see [terminal]) and Hyprland's
# durations, curves, focus glow, opacities and strike (config/hypr/tokens.lua),
# written by the Nix build; and the boot screens' values (the Plymouth script's
# token block, kubaos.plymouth and GRUB's theme.txt), checked in.
# branding/boot.py and branding/make.py read this file for the boot screens'
# pictures and the logo.
#
# Lengths are logical pixels. The supported scales are 1, 1.25, 1.5 and 2, so
# a length lands on whole device pixels at every one of them only when it is a
# multiple of 4; the generator refuses anything else. Hairlines are the
# exception: one device pixel at every scale, whatever that is in logical
# pixels.

[rules]
# Every spacing, size, radius, icon size, line height and shadow is a
# multiple of this.
grid = 4
# The only font sizes. A type style with any other size is refused. 64 is the
# hero's alone: semibold for words, light for numbers. 80 is the lock screen's
# clock, the one thing that screen shows.
font_sizes = [11, 12, 13, 14, 16, 20, 24, 32, 48, 64, 80]
# The scales every length is checked against: `grid` times each one must be a
# whole number of device pixels.
scales = [1.0, 1.25, 1.5, 2.0]
# The sizes allowed off the grid: a slider's step dot and its regular anchor
# dot. Each is drawn centred on a point that moves with the slider's width and
# value, so its edges land between device pixels whatever its size, and a size
# on the grid would buy nothing.
off_grid = ["size.slider_stop", "size.slider_anchor"]

# Lines thinner than the grid. Neither is a multiple of 4, so neither is a
# length: each is drawn as whole device pixels at the scale it shows at.
[stroke]
# Dividers, outlines of cards, fields and the switch track: one device pixel
# at every scale.
hairline_device_px = 1
# The spinner's arc, a field's caret, a partial checkbox's dash and the line
# where a dragged row will land: 2 logical pixels, rounded half up to whole
# device pixels (2, 3, 3, 4 at 1, 1.25, 1.5, 2). A tick is the `check`
# symbol, drawn with the symbol stroke below like every other icon.
thin = 2
# A symbol's stroke on its 24 unit grid: 2 at 24 px. At another size it
# scales with the symbol, then rounds half up to whole device pixels, so a
# symbol is never drawn with a fractional stroke.
symbol = 2

# The neon of a lit control (hovered or focused, one state), one rule for every
# component: one line inside the control's edge, at its corner, and the glow
# outside it in the control's tone. On a control not filled with its tone the
# line is the tube, `tube` wide, over the control's outline; on a filled one
# (Filled, Danger, Success, Warning) the line inside the fill's edge is the
# tone's core, `stroke.thin` wide. Nothing but the glow reaches past the box, so
# a lit control's shape never grows, and nothing takes layout space, so focus
# moving never moves anything. At night the line burns and the glow shows; in
# daylight nothing glows, and the line is the dark one of `[color.derived]`.
[focus]
# The tube's width in logical pixels, drawn rounded half up to whole device
# pixels: 2, 2, 2, 3 device pixels at 1, 1.25, 1.5, 2.
tube = 1.5
# The glow: a near one and a far, faint one, each fading from its opacity at
# the control's edge to nothing at its reach outside it, in logical pixels.
near = 8
near_opacity = 0.45
far = 20
far_opacity = 0.14
# Content drawn in its tone (a Text button's label and icon), lit: a faint
# near glow only, fading from its opacity at the letters to nothing at its
# reach, in logical pixels, the same at every size. No far glow.
content_near = 3
content_glow = 0.4
# A lit label on a fill (a Filled button's, at night): a tiny glow round its
# letters, fading from its opacity to nothing at its reach, in logical pixels.
label_near = 2
label_glow = 0.3
# A pressed control's glow, at night: the lit glow this many times brighter.
pressed_glow = 1.25
# The band a picture keeps round itself inside its own box where its
# neighbours leave no more room: a wallpaper thumbnail inside its grid cell,
# the boot prompt's field drawn as one picture with its ring. A focused one's
# glow is cut past it. A scroll is not held to it: one with no visible edge of
# its own reaches past its box as far as the glow (`far`), or up to the part
# of the page beside it, so it never cuts a resting control's glow.
offset = 4

# A field's caret: one core line `stroke.thin` wide with rounded ends, steady,
# never blinking. At night it is its tone's core, and while you type a faint
# glow in the tone shows round it, then fades; by day it is the tone, with no
# glow.
[caret]
# Its height in logical pixels, centred on the value's 20 pixel line: 2 short
# at each end, so it reads as a mark between letters, not a rule as tall as
# the text.
height = 16
# The glow round it while you type: its reach outside the caret in logical
# pixels, and its opacity at the caret's edge, fading to nothing at the reach.
# Fainter than a control's near glow: it sits among the letters.
near = 4
glow = 0.25

# The spacing scale: gaps, paddings and insets.
[space]
values = [4, 8, 12, 16, 20, 24, 32, 40, 48, 64]

# Corner radii, by role: every chosen radius says what the shape is. There
# are three, plus `full`. Any other radius is derived, never picked: a shape
# that fills another less an inset takes the outer radius minus the inset, so
# the corners share a centre (`kubaos_ui::look::nested`, which refuses a
# nesting that doesn't resolve). A surface's content 8 in takes 16; 12 in, 12.
[radius]
# Marks inside controls: the checkbox, a hint, focus details, inline tags.
small = 4
# Everything you click or type in: buttons, fields, list rows, menu items,
# chips.
control = 12
# Everything that holds content: cards, dialogs, popups, panels, list wells,
# the screen frame.
surface = 24
# Pills and circles: switches, icon buttons, sliders, avatars,
# badges.
full = true

# Icon sizes: the symbol's box, its 24 unit grid scaled to it. The drawing
# keeps 2 units clear inside, Tabler's margin.
[icon]
sizes = [16, 20, 24, 32, 48]
# A row's icon beside a title over a subtitle (`body_strong` over `small`, a
# 40 block): it spans both lines, a step up from the title's own 20, so an
# app's icon in the Command menu reads at the size of the two lines beside it.
two_line = 24

# Fixed dimensions of components, by name.
[size]
# Buttons and fields: small, regular and large. A field is as tall as a
# regular button, so the two line up side by side. Large is the one main
# action of a big page (Kōbō's Install).
control_sm = 32
control_md = 40
control_lg = 48
# A list row with one line, and with a title over a subtitle.
row = 44
row_two_line = 56
# A table's row: a line of body text with 4 above and below, so a list of readings (the
# system monitor's processes) stays dense and each row is still easy to hit.
row_compact = 28
# A menu's width: an item's symbol, its words and a shortcut's keycaps side by side.
menu = 240
chip = 24
# A badge over an icon's corner: a count's pill, a line of label text tall, and
# a dot, the size of a picked radio button's.
badge = 16
badge_dot = 8
switch_width = 44
switch_height = 24
# The switch's knob off and on: it grows as it turns on, leaving 6 and 4 of
# track around it.
switch_knob_off = 12
switch_knob_on = 16
# A checkbox's box and a radio button's disc, and the dot of a picked radio
# button.
check = 20
radio_dot = 8
progress = 8
dialog = 500
# A password field alone on a screen, under the lock screen's clock: room for
# a long password's bullets, and wider than the clock without outweighing it,
# so the two read as one column, where the dialog's 500 dwarfed the time.
password = 320
# The widest a column of text and fields grows.
column = 560
# Kōbō's step rail on a wide screen.
rail = 236
# An app's sidebar, its list of pages beside the page: wider than Kōbō's rail,
# since it lists settings' names, not a step's few words.
sidebar = 264
# An app's window: it opens centred and floating at its default, 1120 × 720,
# and tiled it takes its tile but never goes below its minimum, 720 × 480.
app_width = 1120
app_height = 720
app_min_width = 720
app_min_height = 480
# A log opened under an error or a progress bar.
log = 232
# A panel of the shell, and a notification beside one: the control center's
# side sheet, the cards of the notification stack.
panel = 384
# The shell's bar along the top of every screen: a small control (32) with 4
# above and below, so its pills and buttons centre on whole device pixels.
bar = 40
# The widest a name the bar shows grows (a live preview's branch): past it, it
# ends in an ellipsis, so the bar's right side never runs into the clock.
bar_label = 160
# A wallpaper's thumbnail in the shell's picker, 16:10 as the screens are.
thumbnail_width = 256
thumbnail_height = 160
# A slider is a pill: the fill is the pill, its round end marks the value, the
# icon sits in the circle at its start and the value or its name at its end.
# Regular, and compact for a dense panel (the control center, the system
# monitor): as tall as a compact row.
slider = 36
slider_compact = 28
# The dot of each step, on either side of the fill.
slider_stop = 6
# The solid dot of the mark the value rests on: a step, or a sticky point
# while the value holds there. Regular and compact.
slider_anchor = 10
slider_anchor_compact = 8
# How near a drag holds on a sticky point before it pulls free.
slider_hold = 12
# A scrollbar's thumb, a pill: thin, since the keyboard and the wheel do the scrolling and the
# thumb only says where you are.
scrollbar = 4
# A keycap: as tall as a line of body text, so it sits inline with body and
# caption text without making the line taller, and never narrower than tall,
# so a one-letter key is square.
keycap = 20
# The クバ mark drawn as lit neon tubes on Kōbō's done screen, with room inside for the glow
# around them: the mark's 120 unit drawing at 200, as in the draft Kuba picked.
neon_mark = 200
# The 完了 hanko stamped beside it.
hanko = 120
# A sparkline in a panel: the system monitor's graphs, the last minute of a reading at a glance,
# as tall as a large control so a graph and the buttons beside it line up.
sparkline = 48
# The mockups' motion player: its plot's height for a progress from 0 to 1, room enough to read a
# curve's shape and the flicker's steps, with an overshoot drawn above it.
motion_plot = 160

# A page's or a panel's body: its padding on every side, by its own width.
# Tailwind's container, `px-4 sm:px-6 lg:px-8`, on Tailwind's default
# breakpoints: 16 under 640 (`sm`), 24 from 640, 32 from 1024 (`lg`). A
# panel of the shell (384) takes 16; Kōbō's content pane, 32 on a 1080p
# screen and 24 on a 1280 px one.
# https://tailwindcss.com/docs/responsive-design
[container]
# The width, in logical pixels, each padding applies from.
from = [0, 640, 1024]
# The padding inside every edge at that width and up, from `[space]`.
padding = [16, 24, 32]

# Aspect ratios, width to height, a picture's box keeps before and after it
# loads, so nothing around it moves when it arrives.
[aspect]
# A wallpaper: 16:10, as the screens it is picked for are.
wallpaper = [16, 10]

# Type families. Nothing else draws text; symbols are drawn, see [symbols].
[font.family]
sans = "Geist"
mono = "Geist Mono"
jp = "M PLUS 1"

# Type styles: size and line height in logical pixels, a weight and a family
# from above. A single-line control's label takes the control's content box as
# its line height, so it centres on the grid.
#
# `icon` is the symbol that sits beside the style on its line: a component
# takes its icon's size from its text's style, never a size of its own, so an
# icon reads as heavy as the letters next to it. The box is about 1.4 times the
# font size, held to an icon size no taller than the line, so an icon never
# makes a line taller; its stroke is whole device pixels at every scale (see
# `stroke.symbol`).
#
# `tabular = true` draws a style's figures tabular (OpenType `tnum`), all one
# width, for a number that changes in place. Off by default. iced's text has no
# font features, so iced draws them proportional, and a component showing such
# a number holds it in a box as wide as its widest value.
[type.clock]
size = 80
line = 88
icon = 48
weight = "light"
family = "sans"
use = "The lock screen's clock, the one thing that screen shows: a step above the hero, light like every big figure. The clock popup's time stays the hero's number style."

[type.hero]
size = 64
line = 72
icon = 48
weight = "semibold"
family = "sans"
use = "Words at the hero size: Kōbō's welcome line and its done screen's headline, and nothing else."

[type.hero_number]
size = 64
line = 72
icon = 48
weight = "light"
family = "sans"
use = "Numbers at the hero size, light so a big figure doesn't shout: Kōbō's install percent, the clock popup's time."

[type.display]
size = 48
line = 56
icon = 48
weight = "semibold"
family = "sans"
use = "The heading of a full-screen moment other than Kōbō's welcome and done screens."

[type.title]
size = 32
line = 40
icon = 32
weight = "semibold"
family = "sans"
use = "A screen's or page's title."

[type.headline]
size = 24
line = 32
icon = 32
weight = "semibold"
family = "sans"
use = "A dialog's title, a big number."

[type.heading]
size = 20
line = 28
icon = 24
weight = "semibold"
family = "sans"
use = "A section's title inside a page."

[type.subheading]
size = 16
line = 24
icon = 24
weight = "semibold"
family = "sans"
use = "A card's or an error's first line."

[type.body_large]
size = 16
line = 24
icon = 20
weight = "regular"
family = "sans"
use = "A lede under a display line, the text in a field."

[type.body]
size = 14
line = 20
icon = 20
weight = "regular"
family = "sans"
use = "Running text, explanations, toasts."

[type.body_strong]
size = 14
line = 20
icon = 20
weight = "medium"
family = "sans"
use = "A list row's title, a value next to its label."

[type.button]
size = 14
line = 24
icon = 20
weight = "semibold"
family = "sans"
use = "A regular button's label, on a 24 px line so it centres in a 40 px control."

[type.button_large]
size = 16
line = 24
icon = 24
weight = "semibold"
family = "sans"
use = "A large button's label, centred in a 48 px control."

[type.button_small]
size = 12
line = 16
icon = 16
weight = "semibold"
family = "sans"
use = "A small button's label, centred in a 32 px control."

[type.label]
size = 12
line = 16
icon = 16
weight = "medium"
family = "sans"
use = "A field's label, a chip, a quiet button."

# A number that changes in place at the label's size: the label's style with
# tabular figures (`tnum`), so the number keeps its width as it ticks.
[type.label_number]
size = 12
line = 16
icon = 16
weight = "medium"
family = "sans"
tabular = true
use = "A number that changes in place: a slider's value."

[type.small]
size = 12
line = 16
icon = 16
weight = "regular"
family = "sans"
use = "A note under a field, a subtitle under a row's title."

[type.caption]
size = 11
line = 16
icon = 16
weight = "regular"
family = "sans"
use = "Version lines, what a key hint's key does, the smallest print."

[type.keycap]
size = 11
line = 20
icon = 16
weight = "medium"
family = "mono"
use = "The key on a keycap, on the keycap's 20 px line so it centres in it."

[type.accent]
size = 13
line = 20
icon = 16
weight = "medium"
family = "jp"
use = "The Japanese accent above a title."

[type.mono]
size = 12
line = 16
icon = 16
weight = "regular"
family = "mono"
use = "Logs, device paths, timings, keycaps."

[type.mono_large]
size = 14
line = 20
icon = 20
weight = "regular"
family = "mono"
use = "Commands and keys shown as the subject of a line."

# Durations in milliseconds. Every animation picks one of these by what it is,
# never by feel; the speed setting scales them all, and reduce motion turns
# anything from `short` up into a `short` fade.
[duration.instant]
ms = 0
use = "Changes that must not lag: the caret, text appearing as it is typed, reduce motion's moves."

[duration.micro]
ms = 100
use = "A control pressed, a state layer, a colour change under the pointer."

[duration.short]
ms = 200
use = "A control lighting up or going back to rest, a toggle's knob, a checkbox's mark, a toast fading in."

[duration.medium]
ms = 300
use = "A panel or popup leaving, a log opening, a list reordering, a toast fading out."

[duration.long]
ms = 500
use = "A panel or dialog arriving, a page sliding in."

[duration.slow]
ms = 800
use = "A wallpaper fading in, a live list's new row fading in."

[duration.scene]
ms = 1200
use = "A whole scene changing once: the lock screen lifting, Kōbō's welcome settling."

# The theme change's and the dark ⇄ light switch's own phases, on one clock for
# every screen (`docs/DESIGN.md`, "Motion"); their flicker out and first pause
# are `medium`.
[duration.recolour]
ms = 700
use = "Every colour role changing together in a theme change or the dark ⇄ light switch."

[duration.settle]
ms = 400
use = "The dark beat in the new colours after a theme change's colours change, before the lights strike."

[duration.strike]
ms = 600
use = "Every light striking on together at the end of a theme change or a switch to dark."

# The caret's glow while you type: it comes in at once on a key, holds while
# keys follow, and fades out once they stop, so it shows that typing is going
# on without pulsing under every key.
[duration.caret_glow]
ms = 80
use = "The caret's glow coming in on a key: quick enough to keep up with typing."

[duration.caret_hold]
ms = 500
use = "How long the caret's glow holds after the last key before it fades: a pause between words keeps it."

[duration.caret_fade]
ms = 800
use = "The caret's glow fading after typing stops, down to nothing."

# Easing curves, as CSS cubic béziers (x1, y1, x2, y2).
[easing.standard]
curve = [0.2, 0.0, 0.0, 1.0]
use = "Small state changes that stay on screen: toggles, colour, focus."

[easing.standard_decel]
curve = [0.0, 0.0, 0.0, 1.0]
use = "Something already moving settling in: a list reordering, a slider settling on its step."

# Past its end and back: a small mark popping in.
[easing.pop]
curve = [0.2, 0.9, 0.3, 1.3]
use = "A small mark popping in, a little past its size and back: a slider's anchor dot."

# Past its end and back, softly: something gliding into place, over `long`.
[easing.spring]
curve = [0.34, 1.25, 0.64, 1.0]
use = "Something gliding into place with a small overshoot: the wallpaper carousel's step."

[easing.standard_accel]
curve = [0.3, 0.0, 1.0, 1.0]
use = "Something small leaving for good: a toast fading out."

[easing.emphasized_decel]
curve = [0.05, 0.7, 0.1, 1.0]
use = "Things arriving on screen: panels, dialogs, pages, the log opening."

[easing.emphasized_accel]
curve = [0.3, 0.0, 0.8, 0.15]
use = "Things leaving the screen: panels and dialogs closing."

[easing.linear]
curve = [0.0, 0.0, 1.0, 1.0]
use = "Progress that tracks a real quantity, and spinners."

# In, gently: slow to start, gathering speed to the end.
[easing.gather]
curve = [0.11, 0.0, 0.5, 0.0]
use = "A colour change gathering speed: the theme change and the dark ⇄ light switch."

# Opacities laid over a colour role.
[opacity]
# The state layer: the content colour over a surface, on hover and on press.
hover = 0.08
focus = 0.12
press = 0.14
# A fill lit while its control is held: a slider pressed or dragged, its fill
# brightened toward the palette's bright end as a progress bar's glows. A
# state layer's press is too faint on a fill already the accent; under the
# pointer the fill takes `press`.
held = 0.40
# A Text button pressed in daylight: its tone as a faint fill under it.
press_tint = 0.10
# A disabled control's content, and its container.
disabled_content = 0.38
disabled_container = 0.10
# A well's surface over the panel, and a soft hairline.
well = 0.75
outline_soft = 0.55
# A shape that is only a suggestion of one: a workspace's ghost, a scroller
# at rest under the pointer. Its selected text's highlight, and a read-only
# field's outline and surface.
placeholder = 0.55
selection = 0.32
locked = 0.50
# A field's placeholder text. It is text, so it keeps 4.5:1 (see
# `[contrast]`) on every fill a field takes, the focused one included, which
# 0.80 misses in light (4.4:1): it reads as a hint by its muted role, not by
# fading out.
placeholder_text = 0.85
# An accent colour as a faint fill under itself: a tag, a done step.
tint = 0.16
# A picture that sits back while another is picked: the wallpaper picker's
# thumbnails not under the keyboard. A slider's step the fill has passed, on
# the fill, as low as keeps 3:1 there in both modes.
subdued = 0.75
# Secondary text on a selected row or a checked tile, over its container: as
# low as keeps 4.5:1 on every container a row is selected in, in both modes.
subdued_text = 0.85
# What darkens the screen behind a dialog.
scrim = 0.60
# A dialog's hairline in its tint, for a question and for a danger.
dialog_edge = 0.25
danger_edge = 0.60
# A progress bar's track, and a spinner's faint full ring.
track = 0.90
spinner_track = 0.18
# An error's surface (of the error container) and hairline (of the error).
error_fill = 0.30
error_edge = 0.45
# The log's surface, over the page.
log = 0.85
# The shell's frame and the panels growing out of it: glass, which Hyprland
# blurs what shows through.
frame = 0.94
# A list behind what floats over it, turned toward the surface so it sits back
# in either mode: the notifications under a group's fanned cards.
recede = 0.60
# What darkens the desktop behind an open panel, lighter than a dialog's scrim:
# a panel sits beside the windows rather than over a question.
panel_scrim = 0.20
# Where Hyprland starts blurring behind the frame's layer (its `ignore_alpha`): only the glass.
# The layer also draws a scrim and, over it, the panels' shadow, which cover up to 0.81 together
# (`scrim` under `shadow.panel` at `frame`); a cut-off under that blurs a ragged band of the
# desktop under the bar, which cuts a window's top border off in steps beside an open panel.
frame_blur = 0.85
# A panel's surface over the blurred wallpaper it floats on, so the photo shows through as
# glass: Kōbō's panel.
glass = 0.80
# The furthest the wallpaper is turned toward the surface behind full-screen text, so the words
# read over any photo: at 0.90 every text role keeps 4.5:1 over pure black in light and pure
# white in dark. Kōbō's welcome and done screens, from the text's side; the lock screen, behind
# its words.
backdrop = 0.90
# An inactive window's border, the highest container over what is behind it,
# and its neutral shadow, of the `shadow` role. The active window's tube and
# glow strike on over these (config/hypr/focus.lua).
window_border = 0.80
window_shadow = 0.33

# Shadows: offset down and blur in logical pixels, and the shadow's opacity
# of the `shadow` role.
[shadow.panel]
y = 16
blur = 48
opacity = 0.55

[shadow.dialog]
y = 16
blur = 48
opacity = 0.60

# A card in a stack, cast onto the edge of the card tucked under it: close and
# tight, so it reads as one card lying on another. Lighter in light mode, where
# the dark one's strength turns the edges into grey bands rather than paper.
[shadow.tucked]
y = 4
blur = 8
opacity = 0.40
light_opacity = 0.16

# A card lifted over a list, lying flat beside the others it fans out with,
# its shadow straight under it on what it floats over: a notification
# group's preview.
[shadow.lifted]
y = 8
blur = 24
opacity = 0.55

# The glow under a progress bar's fill, in the fill's own colour.
[shadow.glow]
y = 0
blur = 12
opacity = 0.55

# The ladder a part rises on inside its plane, a window or a shell panel, restarting from the
# plane's own surface (step 0) in each, so a card looks the same in a window as in a panel. Step 1
# is a card or a tucked notification, 2 a menu, a popover or a lifted notification, 3 a dialog
# inside an app or a panel, 4 a tooltip. Each step casts one shadow, measured from the plane's
# surface rather than from whatever it lies on, in two layers of the `shadow` role: a tight contact
# layer the same at every step, and an ambient one that falls further and softer with each step,
# `y` and `blur` plus the step times `y_step` and `blur_step`, on the grid at every step.
#
# The night's surfaces are dark enough to swallow a shadow, so the layers are stronger there and a
# raised part also takes the container role `lighter_at_night` steps above its day one. Every
# raised part draws a rim inside its edge, a hairline of `on_surface` at `rim`: by night it is
# what shows the edge, by day it keeps a pale part off a pale surface.
[elevation]
steps = 4
lighter_at_night = 1
rim = 0.08
light_rim = 0.06

[elevation.contact]
y = 0
blur = 4
opacity = 0.70
light_opacity = 0.24

[elevation.ambient]
y = 0
blur = 0
y_step = 4
blur_step = 16
opacity = 0.80
light_opacity = 0.28

# The neon sign. The boot splash switches the sign on a group of tubes at a
# time, and Kōbō's done screen writes the クバ mark in as lit tubes: one
# stutter and one drawing, so the first and the last thing an install shows
# are the same sign.
[neon]
# A tube striking: its brightness through ten even steps over `medium`. It
# stutters, then catches. Only a power change flickers this way: the theme
# change and dark and light switching their lights, a surface or a window
# appearing, a definite off, and one light of a control's: a field's caret
# striking on as the keyboard comes in. Hover, focus and focus moving light
# up with a fade instead.
strike = [0.6, 0.0, 0.9, 0.2, 0.0, 1.0, 0.4, 1.0, 0.8, 1.0]

# The クバ mark: its strokes in the order a hand writes them (ク's tick and
# sweep, バ's two strokes, the dakuten), as SVG path data of absolute M, L, H
# and Q commands in a drawing `units` square with the strokes `margin` inside
# it. A warm tube is `primary` with `logo_core_warm` along its middle, a cold
# one `cold` with `logo_core_cold`. The logo's SVGs (branding/make.py) and Kōbō's done
# screen draw it from here.
[neon.mark]
units = 120
margin = 10
# A warm tube's width in the drawing's units, and a cold one's of it: the
# dakuten is a fifth thinner.
width = 9.5
cold_width = 0.8
# The white-hot cores' widths, of a warm tube's: a warm one's and a cold
# one's.
core = 0.22
cold_core = 0.18
strokes = [
  { path = "M29 13 L17 33", tone = "warm" },
  { path = "M24 24 H47 Q51 24 49.6 28 L46 39 Q38 66 14 83", tone = "warm" },
  { path = "M66 41 Q64.5 63 53 81", tone = "warm" },
  { path = "M76.5 39 Q84 61 94 79", tone = "warm" },
  { path = "M81 14 L85 25", tone = "cold" },
  { path = "M90 11 L94 22", tone = "cold" },
]

# The boot screens, Plymouth and GRUB, draw in device pixels before anything
# scales them, and always in the dark palette. Their lengths are the tokens'
# times the scale they draw at.
[boot]
# GRUB has one theme for every screen and can't tell how big a screen is, so
# it draws at one scale: the desktop's on the laptop's 2880x1800 panel, 1.5.
# A 1080p screen shows it half as large again as its desktop, and it still
# fits there. One of `rules.scales`, so every length is whole device pixels.
grub_scale = 1.5
# Plymouth draws at 2 on a screen this many device pixels tall or taller, and
# at 1 below. The 2880x1800 panel takes 2, a 1080p or 1440p screen 1.
plymouth_2x_from = 1600

# Colour roles. At runtime matugen derives them from the wallpaper
# (`scripts/dot-theme`, `scheme-fidelity`); these are the fallback, matugen's
# output for the default wallpaper, `shinjuku/kubaos-neon-sign.jpg`, in each
# mode. Each role names the matugen colour it comes from; a role with no
# source is ours and keeps its value whatever the wallpaper: a value in each
# palette, or a recipe in `[color.derived]` over one of ours.
[color.source]
primary = "primary"
on_primary = "on_primary"
primary_container = "primary_container"
on_primary_container = "on_primary_container"
secondary = "secondary"
on_secondary = "on_secondary"
secondary_container = "secondary_container"
on_secondary_container = "on_secondary_container"
tertiary = "tertiary"
on_tertiary = "on_tertiary"
tertiary_container = "tertiary_container"
on_tertiary_container = "on_tertiary_container"
# The cold accent, the blue of the sign's dakuten: fidelity's tertiary is the
# wallpaper's complementary colour, so cold follows it. Used rarely: focus on
# picked cards, a demo badge.
cold = "tertiary"
on_cold = "on_tertiary"
cold_container = "tertiary_container"
on_cold_container = "on_tertiary_container"
surface = "surface"
on_surface = "on_surface"
surface_variant = "surface_variant"
on_surface_variant = "on_surface_variant"
surface_dim = "surface_dim"
surface_bright = "surface_bright"
surface_container_lowest = "surface_container_lowest"
surface_container_low = "surface_container_low"
surface_container = "surface_container"
surface_container_high = "surface_container_high"
surface_container_highest = "surface_container_highest"
outline = "outline"
outline_variant = "outline_variant"
shadow = "shadow"
scrim = "scrim"
inverse_surface = "inverse_surface"
inverse_on_surface = "inverse_on_surface"
inverse_primary = "inverse_primary"
# The fixed palette: ours, the same whatever the wallpaper, so one meaning has one colour on
# every desktop. Each meaning has a burning tone, decided in OKLCH and fitted into sRGB at its hue
# and lightness: neon-bright at night, deeper by day. A Danger, Success or Warning button burns on
# its tone, always lit, so it can't be taken for any wallpaper's accent, even one of the same hue
# (`docs/DESIGN.md`, "States"). Every other role carrying the meaning is a recipe over the tone
# (`[color.derived]`): its text role, its core and its unlit form.
#
# Red: something failed, or the action that destroys something. Material 3's error is the same
# pastel for every wallpaper, which reads rose beside the Danger button's red and is a red
# wallpaper's primary's twin, so the error family is ours too.
burn_error = ""
error = ""
on_error = ""
error_container = ""
on_error_container = ""
# Green: done and installed.
burn_success = ""
success = ""
# Amber, between fine and an error: a reading close to its limit, an action with a cost.
burn_warning = ""
warning = ""
# Violet: anything shared off the machine, the screen above all. Its tube marks what is being
# shared, with `sharing_core` along its middle as `primary_core` runs along the accent's.
burn_sharing = ""
sharing = ""
# The privacy dots: a microphone that is listening, in an orange clear of the warning's amber and
# the error's red, and anything recording, the camera watching or the screen being recorded, in
# the recording red: pure red at night, the REC light, a step deeper and purer than the error's red.
burn_microphone = ""
microphone = ""
burn_recording = ""
recording = ""
# The logo's own cores, along the middles of the クバ mark's warm and cold tubes
# (`[neon.mark]`): brand art, paler than a control's, and the same in both modes.
logo_core_warm = ""
logo_core_cold = ""

[color.dark]
primary = "#ffb779"
on_primary = "#4c2700"
primary_container = "#d37b1b"
on_primary_container = "#000000"
secondary = "#f2bc8e"
on_secondary = "#492806"
secondary_container = "#643e1b"
on_secondary_container = "#ffd9bb"
tertiary = "#85cfff"
on_tertiary = "#00344c"
tertiary_container = "#0f9ad6"
on_tertiary_container = "#000000"
cold = "#85cfff"
on_cold = "#00344c"
cold_container = "#0f9ad6"
on_cold_container = "#000000"
surface = "#19120b"
on_surface = "#f0dfd4"
surface_variant = "#544436"
on_surface_variant = "#dac2b1"
surface_dim = "#19120b"
surface_bright = "#413730"
surface_container_lowest = "#140d07"
surface_container_low = "#221a13"
surface_container = "#261e17"
surface_container_high = "#312821"
surface_container_highest = "#3d332b"
outline = "#a28d7d"
outline_variant = "#544436"
shadow = "#000000"
scrim = "#000000"
inverse_surface = "#f0dfd4"
inverse_on_surface = "#382f27"
inverse_primary = "#8e4e00"
logo_core_warm = "#ffe6cf"
logo_core_cold = "#dcf1ff"
# The fixed palette's tones at night: neon-bright. Success's chroma is a step
# under the 0.21 that read too loud.
burn_error = "oklch(0.66 0.25 27)"
burn_success = "oklch(0.74 0.18 150)"
burn_warning = "oklch(0.85 0.17 88)"
burn_sharing = "oklch(0.68 0.21 300)"
burn_microphone = "oklch(0.74 0.19 55)"
burn_recording = "#ff0000"

[color.light]
primary = "#8b4c00"
on_primary = "#ffffff"
primary_container = "#ae6100"
on_primary_container = "#ffffff"
secondary = "#7f5530"
on_secondary = "#ffffff"
secondary_container = "#fec798"
on_secondary_container = "#593513"
tertiary = "#00628b"
on_tertiary = "#ffffff"
tertiary_container = "#007caf"
on_tertiary_container = "#ffffff"
cold = "#00628b"
on_cold = "#ffffff"
cold_container = "#007caf"
on_cold_container = "#ffffff"
surface = "#fff8f5"
on_surface = "#221a13"
surface_variant = "#f7decc"
on_surface_variant = "#544436"
surface_dim = "#e7d7cc"
surface_bright = "#fff8f5"
surface_container_lowest = "#ffffff"
surface_container_low = "#fff1e8"
surface_container = "#fcebdf"
surface_container_high = "#f6e5da"
surface_container_highest = "#f0dfd4"
outline = "#877364"
outline_variant = "#dac2b1"
shadow = "#000000"
scrim = "#000000"
inverse_surface = "#382f27"
inverse_on_surface = "#ffeee2"
inverse_primary = "#ffb779"
logo_core_warm = "#ffe6cf"
logo_core_cold = "#dcf1ff"
# The fixed palette's tones by day: deeper, so a fill reads on the light
# surfaces with nothing glowing.
burn_error = "oklch(0.56 0.21 27)"
burn_success = "oklch(0.62 0.16 150)"
burn_warning = "oklch(0.84 0.16 85)"
burn_sharing = "oklch(0.52 0.22 300)"
burn_microphone = "oklch(0.70 0.18 55)"
burn_recording = "oklch(0.55 0.22 29)"

# The roles computed from a tone, whichever palette is drawn. None is a fixed
# value: each is a recipe over the live tone, the wallpaper's where it sets one,
# so it follows the theme. A recipe starts from a role, either `mix`, taken
# `white` of the way to white or `black` of the way to black in sRGB (each
# channel rounded half up), or `from`, as it is. It may then move the colour in
# OKLCH: its lightness times `lightness`, set to `at_lightness`, raised by
# `lighter` or lowered by `darker`, and its chroma times `chroma`; the result is
# fitted into sRGB by lowering its chroma alone, at the same hue and lightness,
# so a hue never shifts (a yellow darkens to olive, never orange). Last,
# `text_on` names the backgrounds it is text on: its lightness moves away from
# them only as far as it takes to hold 4.5:1 on every one, so a label holds on
# any wallpaper. A role computed differently by night and by day gives a
# recipe in `dark` and one in `light`.
#
# A role that is only a `mix`, the same in both modes, is a formula every
# output computes (`color-mix` in CSS, `Tokens.towardWhite` in QML,
# `color::derived` in iced). A role of ours given by a recipe reaches iced and
# QML as a value, computed from the fallback palettes. The rest are the state
# model's: the mockups' CSS computes them; the iced and QML outputs don't build
# them yet.
#
# The states (`docs/DESIGN.md`, "States"): rest, lit (hovered or focused, one
# state), pressed and disabled. At night a control rests unlit and lights up;
# by day nothing glows. Lit has two looks: with the signs on, the neon burns;
# with them off (by day always, at night while a power change has the lights
# out), the line stays inside the edge as unlit glass, a `_glass` role, with no
# glow and the label at its rest colour. Each `_glass` role is by day the
# daylight lit line, so the signs-off look and daylight lit are one look.
[color.derived]
# The fixed palette's text roles: each burning tone, its lightness moved only as
# far as it takes to hold 4.5:1 on every surface text sits on. By night the
# neon tones mostly hold as they are; by day each darkens at its own hue.
error = { from = "burn_error", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
success = { from = "burn_success", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
warning = { from = "burn_warning", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
sharing = { from = "burn_sharing", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
microphone = { from = "burn_microphone", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
recording = { from = "burn_recording", text_on = ["surface", "surface_container_lowest", "surface_container_low", "surface_container", "surface_container_high", "surface_container_highest"] }
# The rest of the error family, from the same tone: a container that is the
# tone deep at night and pale by day, and the labels fitted to the error and
# to its container.
on_error = { dark = { from = "burn_error", lightness = 0.25, text_on = ["error"] }, light = { mix = "burn_error", white = 1.0 } }
error_container = { dark = { from = "burn_error", lightness = 0.5, chroma = 1.2 }, light = { from = "burn_error", at_lightness = 0.93 } }
on_error_container = { dark = { mix = "burn_error", white = 0.85, text_on = ["error_container"] }, light = { from = "burn_error", lightness = 0.4, text_on = ["error_container"] } }

# A tone's core, the white-hot line along the middle of a lit tube: half way
# to white.
primary_core = { mix = "primary", white = 0.5 }
cold_core = { mix = "cold", white = 0.5 }
error_core = { mix = "burn_error", white = 0.5 }
success_core = { mix = "burn_success", white = 0.5 }
warning_core = { mix = "burn_warning", white = 0.5 }
sharing_core = { mix = "burn_sharing", white = 0.5 }
microphone_core = { mix = "burn_microphone", white = 0.5 }
recording_core = { mix = "burn_recording", white = 0.5 }
# A tone unlit: deep, not pale, at 60% of its lightness and 1.2 times its
# chroma, as far as sRGB holds it. On hues already at the gamut's edge there
# (cyan, green, yellow) that is the most saturated fill the lightness allows.
primary_unlit = { from = "primary", lightness = 0.6, chroma = 1.2 }
cold_unlit = { from = "cold", lightness = 0.6, chroma = 1.2 }
error_unlit = { from = "burn_error", lightness = 0.6, chroma = 1.2 }
success_unlit = { from = "burn_success", lightness = 0.6, chroma = 1.2 }
warning_unlit = { from = "burn_warning", lightness = 0.6, chroma = 1.2 }
sharing_unlit = { from = "burn_sharing", lightness = 0.6, chroma = 1.2 }
microphone_unlit = { from = "burn_microphone", lightness = 0.6, chroma = 1.2 }
recording_unlit = { from = "burn_recording", lightness = 0.6, chroma = 1.2 }

# Filled. At night the fill stays unlit, resting, lit and pressed, and the
# letters light: near white, tinted 18% with the tone at rest and 8% lit. Lit
# adds the core inside the edge; pressed lifts the fill a little. By day the
# fill is the tone lifted to lightness 0.80, where a dark label reads (0.56 to
# 0.64 is a dead zone where neither a white nor a dark label does); lit adds a
# dark line, the fill at 62% of its lightness, and pressed goes a little darker.
primary_fill = { dark = { from = "primary_unlit" }, light = { from = "primary", at_lightness = 0.80 } }
primary_fill_pressed = { dark = { from = "primary_fill", lighter = 0.035 }, light = { from = "primary_fill", darker = 0.04 } }
on_primary_fill = { dark = { mix = "primary", white = 0.82, text_on = ["primary_fill", "primary_fill_pressed"] }, light = { from = "primary_fill", lightness = 0.45, text_on = ["primary_fill", "primary_fill_pressed"] } }
on_primary_fill_lit = { dark = { mix = "primary", white = 0.92, text_on = ["primary_fill", "primary_fill_pressed"] }, light = { from = "on_primary_fill" } }
primary_fill_line = { dark = { from = "primary_core" }, light = { from = "primary_fill", lightness = 0.62 } }
# Signs off, the line is glass the fill's own hue, a little lighter than the
# unlit fill so it shows on it.
primary_fill_glass = { dark = { from = "primary_fill", lighter = 0.12 }, light = { from = "primary_fill_line" } }

# Tonal: the accent's quieter sibling, on its container. At night its label
# rests dimmed and lights to `on_secondary_container`; pressed lifts the
# container a little at night and darkens it a little by day.
on_secondary_container_rest = { dark = { from = "on_secondary_container", lightness = 0.8, text_on = ["secondary_container"] }, light = { from = "on_secondary_container" } }
secondary_container_pressed = { dark = { from = "secondary_container", lighter = 0.035 }, light = { from = "secondary_container", darker = 0.04 } }

# Text: a label in the tone, with no fill. At night it rests unlit, the tone's
# `_unlit` lifted only as far as it reads, and lights to the core; by day it is
# the tone itself. Both hold on every surface a Text button sits on.
primary_rest = { dark = { from = "primary_unlit", text_on = ["surface", "surface_container_low", "surface_container", "surface_container_high"] }, light = { from = "primary", text_on = ["surface", "surface_container_low", "surface_container", "surface_container_high"] } }
# A tube's line with the signs off, on every control not filled with its tone
# (a Tonal or Text button, an empty checkbox, a switch that is off, a chip):
# solid glass, the tone unlit, and by day the tone's own line.
primary_glass = { dark = { from = "primary_unlit" }, light = { from = "primary" } }
cold_glass = { dark = { from = "cold_unlit" }, light = { from = "cold" } }
error_glass = { dark = { from = "error_unlit" }, light = { from = "error" } }
success_glass = { dark = { from = "success_unlit" }, light = { from = "success" } }
warning_glass = { dark = { from = "warning_unlit" }, light = { from = "warning" } }
sharing_glass = { dark = { from = "sharing_unlit" }, light = { from = "sharing" } }
primary_lit = { dark = { from = "primary_core", text_on = ["surface", "surface_container_low", "surface_container", "surface_container_high"] }, light = { from = "primary", text_on = ["surface", "surface_container_low", "surface_container", "surface_container_high"] } }

# The burning kinds, Danger, Success and Warning: always lit, the bright fixed
# tone with a dark label, the tone at a quarter of its lightness, made darker
# still where it must be to hold on every fill it sits on. At night lit moves
# the fill half way to the core (the tone 25% toward white) and adds the core
# inside the edge; pressed takes it 8% further toward white. By day lit is
# 0.035 darker with a dark line inside the edge, the tone at 60% of its
# lightness, and pressed is 0.06 darker. With the signs off the line is the
# tone unlit, glass on the bright fill.
burn_error_lit = { dark = { mix = "burn_error", white = 0.25 }, light = { from = "burn_error", darker = 0.035 } }
burn_error_pressed = { dark = { mix = "burn_error_lit", white = 0.08 }, light = { from = "burn_error", darker = 0.06 } }
burn_error_line = { dark = { mix = "burn_error", white = 0.5 }, light = { from = "burn_error", lightness = 0.6 } }
burn_error_glass = { dark = { from = "burn_error", lightness = 0.6, chroma = 1.2 }, light = { from = "burn_error_line" } }
on_burn_error = { from = "burn_error", lightness = 0.25, text_on = ["burn_error", "burn_error_lit", "burn_error_pressed"] }
burn_success_lit = { dark = { mix = "burn_success", white = 0.25 }, light = { from = "burn_success", darker = 0.035 } }
burn_success_pressed = { dark = { mix = "burn_success_lit", white = 0.08 }, light = { from = "burn_success", darker = 0.06 } }
burn_success_line = { dark = { mix = "burn_success", white = 0.5 }, light = { from = "burn_success", lightness = 0.6 } }
burn_success_glass = { dark = { from = "burn_success", lightness = 0.6, chroma = 1.2 }, light = { from = "burn_success_line" } }
on_burn_success = { from = "burn_success", lightness = 0.25, text_on = ["burn_success", "burn_success_lit", "burn_success_pressed"] }
burn_warning_lit = { dark = { mix = "burn_warning", white = 0.25 }, light = { from = "burn_warning", darker = 0.035 } }
burn_warning_pressed = { dark = { mix = "burn_warning_lit", white = 0.08 }, light = { from = "burn_warning", darker = 0.06 } }
burn_warning_line = { dark = { mix = "burn_warning", white = 0.5 }, light = { from = "burn_warning", lightness = 0.6 } }
burn_warning_glass = { dark = { from = "burn_warning", lightness = 0.6, chroma = 1.2 }, light = { from = "burn_warning_line" } }
on_burn_warning = { from = "burn_warning", lightness = 0.25, text_on = ["burn_warning", "burn_warning_lit", "burn_warning_pressed"] }

# Every foreground role the front ends draw on a background role, and the
# contrast it needs (WCAG 2.1 AA): `text` 4.5:1; `large_text` 3:1, for 24 px
# and up or 19 px semibold and up; `graphic` 3:1, for icons, outlines and
# controls that carry meaning. `opacity` names an `[opacity]` the foreground is
# drawn at. `kubaos-tokens` refuses a pair that fails in either fallback
# palette, and `kubaos-design contrast` lists them all with their ratios.
# Decoration (a divider, a well's edge, a disabled control) carries no meaning
# and isn't held to a minimum, as WCAG exempts it.
[contrast]
pairs = [
  { fg = "on_surface", bg = "surface", need = "text", use = "Text on a page or a panel" },
  { fg = "on_surface", bg = "surface_container_low", need = "text", use = "A row's title in a well" },
  { fg = "on_surface", bg = "surface_container_highest", need = "text", use = "Text on the highest container" },
  { fg = "on_surface_variant", bg = "surface", need = "text", use = "Secondary text, a key hint's label" },
  { fg = "on_surface_variant", bg = "surface_container_low", need = "text", use = "A row's subtitle in a well" },
  { fg = "on_surface_variant", bg = "surface_container", need = "text", use = "Secondary text on a container" },
  { fg = "on_surface_variant", bg = "surface_container_high", need = "text", use = "Secondary text on a card" },
  { fg = "on_surface_variant", bg = "surface_container_highest", need = "text", use = "A keycap's key" },
  { fg = "on_surface_variant", bg = "surface", need = "text", opacity = "placeholder_text", use = "A field's placeholder" },
  { fg = "on_surface_variant", bg = "surface_container_high", need = "text", opacity = "placeholder_text", use = "A field's placeholder in its resting fill" },
  { fg = "on_surface_variant", bg = "surface_container_highest", need = "text", opacity = "placeholder_text", use = "A field's placeholder while it is focused or hovered" },
  { fg = "primary", bg = "surface", need = "text", use = "Accent text: an accent line, a detail, a Text button" },
  { fg = "primary", bg = "surface_container", need = "text", use = "A notification group's \"+N more\" under its fan, over the cards turned toward the surface" },
  { fg = "primary", bg = "surface_container_low", need = "text", use = "Accent text in a well" },
  { fg = "on_primary", bg = "primary", need = "text", use = "A Filled button's label, today in the calendar" },
  { fg = "on_primary", bg = "primary", need = "text", opacity = "subdued_text", use = "Secondary text on a checked tile" },
  { fg = "on_primary_container", bg = "primary_container", need = "text", use = "Text on the primary container" },
  { fg = "on_secondary_container", bg = "secondary_container", need = "text", use = "A Tonal button, a selected row's title" },
  { fg = "on_secondary_container", bg = "secondary_container", need = "text", opacity = "subdued_text", use = "A selected row's subtitle" },
  { fg = "on_error", bg = "error", need = "text", use = "A Danger button's label in iced and QML, which don't build the burning kinds yet" },
  { fg = "on_primary_fill", bg = "primary_fill", need = "text", use = "A Filled button's label at rest" },
  { fg = "on_primary_fill_lit", bg = "primary_fill", need = "text", use = "A Filled button's label, lit" },
