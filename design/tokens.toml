on_cold = "#00344c"
cold_container = "#0f9ad6"
on_cold_container = "#000000"
error = "#ffb4ab"
on_error = "#690005"
error_container = "#93000a"
on_error_container = "#ffdad6"
surface = "#19120b"
on_surface = "#f0dfd4"
