# Every foreground role the front ends draw on a background role, and the
# contrast it needs (WCAG 2.1 AA): `text` 4.5:1; `large_text` 3:1, for 24 px
# and up or 19 px semibold and up; `graphic` 3:1, for icons, outlines and
# controls that carry meaning. `opacity` names an `[opacity]` the foreground is
# drawn at. `kubaos-tokens` refuses a pair that fails in either fallback
# palette, and `kubaos-design contrast` lists them all with their ratios.
# Decoration (a divider, a well's edge, a disabled control) carries no meaning
# and isn't held to a minimum, as WCAG exempts it.
[contrast]
pairs = [
  { fg = "on_surface", bg = "surface", need = "text", use = "Text on a page or a panel" },
  { fg = "on_surface", bg = "surface_container_low", need = "text", use = "A row's title in a well" },
  { fg = "on_surface", bg = "surface_container_highest", need = "text", use = "Text on the highest container" },
  { fg = "on_surface_variant", bg = "surface", need = "text", use = "Secondary text, a key hint's label" },
  { fg = "on_surface_variant", bg = "surface_container_low", need = "text", use = "A row's subtitle in a well" },
  { fg = "on_surface_variant", bg = "surface_container", need = "text", use = "Secondary text on a container" },
  { fg = "on_surface_variant", bg = "surface_container_high", need = "text", use = "Secondary text on a card" },
  { fg = "on_surface_variant", bg = "surface_container_highest", need = "text", use = "A keycap's key" },
  { fg = "on_surface_variant", bg = "surface", need = "text", opacity = "placeholder_text", use = "A field's placeholder" },
  { fg = "on_surface_variant", bg = "surface_container_high", need = "text", opacity = "placeholder_text", use = "A field's placeholder in its resting fill" },
  { fg = "on_surface_variant", bg = "surface_container_highest", need = "text", opacity = "placeholder_text", use = "A field's placeholder while it is focused or hovered" },
  { fg = "primary", bg = "surface", need = "text", use = "Accent text: an accent line, a detail, a Text button" },
  { fg = "primary", bg = "surface_container_low", need = "text", use = "Accent text in a well" },
  { fg = "on_primary", bg = "primary", need = "text", use = "A Filled button's label, today in the calendar" },
  { fg = "on_primary", bg = "primary", need = "text", opacity = "subdued_text", use = "Secondary text on a checked tile" },
  { fg = "on_primary_container", bg = "primary_container", need = "text", use = "Text on the primary container" },
  { fg = "on_secondary_container", bg = "secondary_container", need = "text", use = "A Tonal button, a selected row's title" },
  { fg = "on_secondary_container", bg = "secondary_container", need = "text", opacity = "subdued_text", use = "A selected row's subtitle" },
  { fg = "on_error", bg = "error", need = "text", use = "A Danger button's label" },
  { fg = "on_error", bg = "error", need = "text", opacity = "subdued_text", use = "A selected danger row's subtitle" },
  { fg = "error", bg = "surface", need = "text", use = "An invalid field's note, a failure" },
  { fg = "on_error_container", bg = "error_container", need = "text", use = "A critical notification" },
  { fg = "on_error_container", bg = "error_container", need = "text", opacity = "subdued_text", use = "A critical notification's body" },
  { fg = "cold", bg = "surface", need = "text", use = "A holiday in the calendar, a cold chip's label" },
  { fg = "on_cold", bg = "cold", need = "text", use = "Text on the cold accent" },
  { fg = "warning", bg = "surface", need = "text", use = "A reading close to its limit" },
  { fg = "warning", bg = "surface_container_high", need = "graphic", use = "A warning banner's symbol and hairline" },
  { fg = "primary", bg = "surface_container_high", need = "text", use = "An info banner's symbol and hairline, a Text button inside it" },
  { fg = "error", bg = "error_container", need = "graphic", use = "A danger banner's symbol and hairline, and a danger progress bar's fill" },
  { fg = "primary", bg = "error_container", need = "text", use = "A Text button inside a danger banner in QML" },
  { fg = "surface", bg = "on_surface", need = "text", use = "A toast, a hint's bubble: the inverse colours" },
  { fg = "on_surface", bg = "surface", need = "graphic", use = "An icon, the wordmark of the logo" },
  { fg = "on_surface_variant", bg = "surface", need = "graphic", use = "A muted icon" },
  { fg = "primary", bg = "surface", need = "graphic", use = "The focus tube on a page, a switch that is on, the mark of the logo" },
  { fg = "primary", bg = "surface_container_low", need = "graphic", use = "The focus tube in a well" },
  { fg = "primary", bg = "surface_container", need = "graphic", use = "The focus tube on a panel, an unread dot past its tile" },
  { fg = "primary", bg = "surface_container_high", need = "graphic", use = "The focus tube in a card or a dialog, a field's tube on its fill" },
  { fg = "primary", bg = "surface_container_highest", need = "graphic", use = "A slider's or progress bar's fill, a focused field's tube, an accent symbol or unread dot on a tile" },
  { fg = "on_primary", bg = "primary", need = "graphic", opacity = "subdued", use = "A slider's step the fill has passed" },
  { fg = "on_secondary", bg = "secondary", need = "text", use = "A slider's label and icon on its softer fill (Auto)" },
  { fg = "on_secondary", bg = "secondary", need = "graphic", opacity = "subdued", use = "A slider's passed step on its softer fill (Auto)" },
  { fg = "on_surface_variant", bg = "surface_container_highest", need = "graphic", use = "A slider's step ahead, on its track" },
  { fg = "secondary", bg = "surface_container_highest", need = "graphic", use = "A slider's softer fill (Auto) on its track" },
  { fg = "cold", bg = "surface", need = "graphic", use = "The cold focus tube on a page, the logo's dakuten" },
  { fg = "cold", bg = "surface_container_low", need = "graphic", use = "The cold focus tube in a well" },
  { fg = "cold", bg = "surface_container", need = "graphic", use = "The cold focus tube on a panel" },
  { fg = "cold", bg = "secondary_container", need = "graphic", use = "The cold focus tube on a picked card's fill" },
  { fg = "error", bg = "surface_container_low", need = "graphic", use = "An invalid field's focus tube in a well" },
  { fg = "error", bg = "surface_container", need = "graphic", use = "An invalid field's focus tube on a panel" },
  { fg = "error", bg = "surface_container_high", need = "graphic", use = "An invalid field's focus tube in a dialog, and on its own fill" },
  { fg = "outline", bg = "surface", need = "graphic", use = "A field's, a checkbox's or a switch's outline" },
  { fg = "outline", bg = "surface_container_highest", need = "graphic", use = "An outline on the highest container" },
  { fg = "on_surface", bg = "surface_container", need = "text", use = "A pill of the bar" },
  { fg = "on_surface", bg = "surface_container_high", need = "text", use = "An Action's title in the Action panel, a chip, a done step's chip on a selected row" },
  { fg = "tertiary", bg = "surface", need = "text", use = "The clock's Copied line" },
  { fg = "on_surface", bg = "surface_container_lowest", need = "text", use = "The lock screen before its wallpaper loads" },
  { fg = "primary_container", bg = "surface_container_lowest", need = "large_text", use = "The 完了 hanko on Kōbō's done screen" },
  { fg = "on_surface_variant", bg = "surface_container_lowest", need = "text", use = "The boot screens' notes, key hints and messages" },
  { fg = "error", bg = "surface_container_lowest", need = "text", use = "A wrong disk passphrase" },
  { fg = "primary", bg = "surface_container_lowest", need = "graphic", use = "The disk passphrase field's focus ring and caret" },
]
# Roles a front end draws only as decoration, with no text or meaning drawn on
# them: no pair is needed. `outline_variant`, dividers and soft edges;
# `shadow` and `scrim`;
# `cold_container` and `surface_bright`, the segments of Kōbō's partition bar,
# which its legend names; `primary_core` and `cold_core`, the hot middle of a
# neon tube, drawn on the tube, and the focus core outside a filled control,
# beside the fill it lights. `kubaos-design contrast` fails on a role drawn with
# that is in no pair and not here.
decorative = ["cold_container", "cold_core", "outline_variant", "primary_core", "scrim", "shadow", "surface_bright"]

# The terminals, Ghostty and foot, and every TUI drawn in them: tmux, Neovim,
# btop, lazygit, bat, fzf, oh-my-posh, fastfetch. `kubaos-tokens` writes
# Ghostty's and foot's settings from this table (config/ghostty/tokens,
# config/foot/tokens.ini), the matugen templates of their palette and of the
# roles the TUIs read, and the hues in config/matugen/config.toml, so both
# terminals draw the same text on the same palette.
[terminal]
# The terminal's text: a command's style, Geist Mono 14 on a 20 line. The
# terminals size fonts in points, 3/4 of a logical pixel: 10.5.
type = "mono_large"
# The font the terminals take the glyphs Geist Mono lacks from: the prompt's
# and the file managers' icons, the pills' round caps. Geist Mono's own Nerd
# Font, so a glyph sits on the same metrics as the letters beside it. Its
# icons are a cell and a half wide, as Ghostty draws its own, not squeezed
# into one as the Mono variant's are.
glyphs = "GeistMono Nerd Font"
# Between the window's edge and the cells, from [space].
padding_x = 12
padding_y = 8
# The window's background, by its name in [opacity]: glass over the blurred
# wallpaper, as a panel of Kōbō's.
opacity = "glass"
# How far a bright ANSI colour (8 to 15) stands from its normal one, in HSL
# lightness points, matugen's `lighten`: lighter in dark, darker in light, so
# a bright colour always stands further from the surface.
bright = 6
# ANSI 8, dim text (a comment, a suggestion as you type): `white` moved this
# many lightness points toward the surface. As far as keeps 4.5:1 on it in
# both modes (4.7:1 in light); `outline`, which would be dimmer, is never
# text.
dim = 16

# The terminal's own colours, by role: the cursor in the accent, a selection
# as a selected row's tinted bar under the text, links in the cold accent.
# `black`, `white` and `bright_white` are ANSI 0, 7 and 15. Black is a
# graphic's colour, 3:1 on the surface in both modes, since what a program
# prints in it must still show.
[terminal.roles]
background = "surface"
foreground = "on_surface"
cursor = "primary"
cursor_text = "on_primary"
selection = "secondary_container"
selection_text = "on_secondary_container"
url = "cold"
divider = "outline_variant"
black = "outline"
white = "on_surface_variant"
bright_white = "on_surface"

# ANSI 1 to 6, the hues code is read in. Each is a seed (Tokyo Night's) that
# matugen harmonizes toward the wallpaper's source colour as a custom colour,
# so the six stay distinct and readable and still lean toward the wallpaper.
[terminal.hues]
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"

