# The formatting of the crates brought in line with docs/agents/code-quality.md.
# Pass it to the nightly rustfmt with --config-path
# (`cargo +nightly fmt -- --config-path .config/rustfmt.toml`, or
# `rustfmt +nightly --config-path .config/rustfmt.toml <file>` for one file),
# since most of these options are unstable. It lives here rather than at the
# root so that stable rustfmt, in an editor or `cargo fmt`, does not find it and
# reformat the crates still on its defaults.
max_width = 120
group_imports = "StdExternalCrate"
imports_granularity = "Item"
normalize_comments = true
wrap_comments = true
comment_width = 100
