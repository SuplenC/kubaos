# KubaOS @RELEASE@ @KVERSION@ live (@VERSION@)
set default=0
set timeout=1
set timeout_style=hidden

menuentry "Install KubaOS @RELEASE@" {
	linux /casper/vmlinuz boot=casper noprompt fsck.mode=skip quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=error console=@SERIAL@,115200 console=tty1 ---
	initrd /casper/initrd
}
menuentry "Install KubaOS @RELEASE@ (safe graphics)" {
	linux /casper/vmlinuz boot=casper noprompt fsck.mode=skip nomodeset console=@SERIAL@,115200 console=tty1 ---
	initrd /casper/initrd
}
menuentry "Install KubaOS @RELEASE@ (verbose boot)" {
	linux /casper/vmlinuz boot=casper noprompt fsck.mode=skip console=@SERIAL@,115200 console=tty1 ---
	initrd /casper/initrd
}
menuentry "UEFI firmware settings" {
	fwsetup
}
