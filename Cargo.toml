# The KubaOS Rust workspace: the engine (`kubaos-core`), the `kubaos` CLI
# (`kubaos-cli`), the recoloured pointer it writes (`kubaos-cursor`), Kōbō
# (`kubaos-kobo`), its graphical front end, the Command menu's KubaOS
# Extension (`kotodama-kubaos`), yazi's launcher and the Downloads tidy
# (`kubaos-files`), the Bluetooth pairing agent (`kubaos-bluetooth`), the
# automount for removable drives (`kubaos-automount`), the phone link
# through KDE Connect (`kubaos-phone`), the date engine
# behind the clock popup and the menu's date answers (`kubaos-clock`), and the
# system monitor behind the bar's pill, its popup and the menu's `cpu`, `ram`
# and `battery` answers (`kubaos-sysmon`), the idle settings, Keep awake and the
# scheduled power actions (`kubaos-idle`), the power stops (`kubaos-power`),
# where each app's settings live in the user layer (`kubaos-user-layer`), and
# the design language: the tokens' generator (`kubaos-tokens`), the iced
# components every Rust front end draws with (`kubaos-ui`), the specimen that
# shows them (`kubaos-specimen`), and the design checks:
# the geometry rules any toolkit's boxes are held to (`kubaos-geometry`) and the `kubaos-design`
# command, which lints UI code for literal design values and checks geometry dumps.
[workspace]
resolver = "3"
members = [
    "crates/kubaos-core",
    "crates/kubaos-cli",
    "crates/kubaos-cursor",
    "crates/kubaos-kobo",
    "crates/kotodama-kubaos",
    "crates/kubaos-files",
    "crates/kubaos-bluetooth",
    "crates/kubaos-automount",
    "crates/kubaos-phone",
    "crates/kubaos-clock",
    "crates/kubaos-sysmon",
    "crates/kubaos-user-layer",
    "crates/kubaos-idle",
    "crates/kubaos-power",
    "crates/kubaos-proxy",
    "crates/kubaos-tokens",
    "crates/kubaos-ui",
    "crates/kubaos-specimen",
    "crates/kubaos-geometry",
    "crates/kubaos-design",
]
# Patched copies of dependencies (`[patch.crates-io]` below): built with the workspace, never
# members of it, so its lints don't apply to them.
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kubaos-core = { path = "crates/kubaos-core" }
kubaos-automount = { path = "crates/kubaos-automount" }
kubaos-cursor = { path = "crates/kubaos-cursor" }
kubaos-files = { path = "crates/kubaos-files" }
kubaos-clock = { path = "crates/kubaos-clock" }
kubaos-idle = { path = "crates/kubaos-idle" }
kubaos-power = { path = "crates/kubaos-power" }
kubaos-proxy = { path = "crates/kubaos-proxy" }
kubaos-phone = { path = "crates/kubaos-phone" }
kubaos-sysmon = { path = "crates/kubaos-sysmon" }
kubaos-user-layer = { path = "crates/kubaos-user-layer" }
kubaos-ui = { path = "crates/kubaos-ui" }
kubaos-geometry = { path = "crates/kubaos-geometry" }
kubaos-tokens = { path = "crates/kubaos-tokens" }
# Kotodama's calculator reads dates with jiff too, so the menu and the popup agree on zones and
# DST. The time zone database is the system's (`/usr/share/zoneinfo`, or `$TZDIR`), never bundled.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tempfile = "3"
# Kotodama's crates for Extensions, at the commit flake.lock pins the
# `kotodama` input to, so the Extension speaks the protocol of the Daemon it
# runs under. They aren't on crates.io yet. Bump `rev` with every
# `nix flake update kotodama`: the harness's `menu_kubaos` check fails while
# the two differ.
kotodama-extension = { git = "https://github.com/SuplenC/kotodama", rev = "8ef29c77f18f5b4d69b802fc49162cf01bbe72db" }
kotodama-protocol = { git = "https://github.com/SuplenC/kotodama", rev = "8ef29c77f18f5b4d69b802fc49162cf01bbe72db" }

# The lints of docs/agents/code-quality.md, which every crate takes with
# `[lints] workspace = true`. `just lint` runs clippy with -D warnings, so
# every warning here fails it, in two passes: the code, then every target
# with `-A clippy::unwrap_used`. `just check` runs it with the rest of a PR's
# checks.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Opt-outs from pedantic, each with its reason:
# - The guide asks #[must_use] of constructors and builders, which
#   `return_self_not_must_use` covers, not of every function with a result.
must_use_candidate = "allow"
# - Numeric casts are deliberate where the engine turns byte counts and ticks
#   into the f32 fractions and f64 sizes its progress events show. An
#   #[expect] on each of them would be noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The guide's rules clippy checks, beyond pedantic (`manual_let_else` and
# `return_self_not_must_use` are pedantic, named so they stay on). Tests may
# unwrap: lint them in a second pass with `-A clippy::unwrap_used`, since
# clippy's `allow-unwrap-in-tests` spares only `#[test]` functions and
# `#[cfg(test)]` modules, not an integration test's helpers.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
manual_let_else = "warn"
mod_module_files = "warn"
print_stderr = "warn"
print_stdout = "warn"
return_self_not_must_use = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# iced's software renderer, with images placed in floats and clipped to their own rounded bounds,
# as the wgpu renderer draws them. 0.14.1 truncates an image's offset to whole image pixels (a
# 16 px picture drawn 256 wide lands up to 16 px off) and ignores its clip and border radius, so
# a `Media` picture overflowed its box with square corners. The change is marked `KubaOS:` in
# `vendor/iced_tiny_skia/src/engine.rs` and `raster.rs`. Drop it when iced fixes both.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
