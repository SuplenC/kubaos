# The KubaOS Rust workspace: the engine (`kubaos-core`), the `kubaos` CLI
# (`kubaos-cli`) and Kōbō (`kubaos-kobo`), its graphical front end.
[workspace]
resolver = "3"
members = ["crates/kubaos-core", "crates/kubaos-cli", "crates/kubaos-kobo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kubaos-core = { path = "crates/kubaos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
