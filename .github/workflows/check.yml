# A pull request's checks: `just check` in the flake's devshell on x86_64,
# one step per recipe so a failure names what failed and stops the rest, and
# `nix flake check --no-build` first, which only evaluates. `just shots` stays
# out: its screenshots are for a person to look at, not a check.
#
# Fast through three caches:
# - Cachix (kuba-os.cachix.org), read-only, for what the binary cache workflow
#   (cache.yml) built from main. No token: a PR never writes to it.
# - The Nix store (cache-nix-action), keyed by the flake, for the devshell,
#   the toolchain and the design checks' Qt.
# - sccache's directory and cargo's downloads, keyed by Cargo.lock and
#   flake.lock, for the crates' builds. Incremental builds are off, so
#   sccache caches every crate.
# Only the run on each push to main saves the two Actions caches, and every PR
# starts from them: a PR saving its own would push main's out of the
# repository's 10 GB. The compile cache's key ends in the run, so each push to
# main saves a newer one and GitHub drops the oldest.
#
# Actions are pinned to a commit, with the release in the comment beside it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 3G
    steps:
      # The runner image's preinstalled SDKs leave too little of the disk for
      # Qt, the toolchain and the crates' builds.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            max-jobs = auto

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'qml/specimen/package.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          save: ${{ github.event_name == 'push' }}

      # No auth token: the cache is only read.
      - name: Read the kuba-os Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kuba-os
          skipPush: true

      - name: Restore the compile cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            cargo-${{ runner.os }}-

      - name: Flake check
        run: nix flake check --no-build

      - name: Build the devshell
        run: nix develop --command true

      - name: Format
        run: nix develop --command just fmt-check

      - name: Clippy
        run: nix develop --command just lint

      - name: Tests
        run: nix develop --command just nextest

      - name: Design checks
        run: nix develop --command just design-check

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}
