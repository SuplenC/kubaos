# A pull request's checks on x86_64: `just check` in the flake's devshell, and
# `nix flake check --no-build`, which only evaluates. `just shots` stays out:
# its screenshots are for a person to look at, not a check.
#
# The checks run as parallel jobs, each on its own runner, one step per recipe
# so a failure names what failed:
# - flake: `nix flake check --no-build`.
# - fmt and lint: `just fmt-check`, `just lint`.
# - nextest and nextest (slow): `just nextest`, split in two by `SLOW_TEST`.
# - qml: `just qml-test`.
# - design: `just design-check`, with QML's parity and the mockups' check.
# - system files: `just system-files-check`'s two scripts, run straight on the
#   runner: they need only bash and git, so the job sets up no Nix. It checks
#   out the whole history, for the merge base with main.
# `check (x86_64-linux)` needs them all and fails unless every one passed. It
# is the one check branch protection requires, so a job added here goes in its
# `needs`.
#
# Fast through three caches, which .github/actions/setup restores:
# - Cachix (kuba-os.cachix.org), read-only, for what the binary cache workflow
#   (cache.yml) built from main. No token: a PR never writes to it.
# - The Nix store (cache-nix-action), keyed by the flake and by what the job
#   builds, for the devshell, the toolchain and the design checks' Qt.
# - sccache's directory and cargo's downloads, keyed by the job, Cargo.lock
#   and flake.lock, for the crates' builds. Incremental builds are off, so
#   sccache caches every crate.
# Only the run on each push to main saves the Actions caches.
#
# Actions are pinned to a commit, with the release in the comment beside it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 3G
  # Kōbō's every screen at every scale, about three minutes alone, longer than
  # every other test together: `nextest (slow)` runs it beside `nextest`,
  # which runs the rest. One filter, negated in one of them, so every test
  # runs in exactly one. Renamed, the test matches nothing, and nextest
  # fails `nextest (slow)` for running no test.
  SLOW_TEST: package(kubaos-kobo) & test(=shots::every_screen_keeps_to_the_grid)

jobs:
  flake:
    name: flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          name: flake

      - name: Flake check
        run: nix flake check --no-build

  lint:
    name: fmt and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: lint
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Format
        run: nix develop --command just fmt-check

      - name: Clippy
        run: nix develop --command just lint

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  nextest:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: nextest
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Tests
        run: nix develop --command just nextest -E "not ($SLOW_TEST)"

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  nextest-slow:
    name: nextest (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: nextest-slow
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      # Only Kōbō's tests build, not the workspace's.
      - name: Tests
        run: nix develop --command cargo nextest run -p kubaos-kobo -E "$SLOW_TEST"

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  qml:
    name: qml
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          name: qml

      - name: Build the devshell
        run: nix develop --command true

      - name: QML logic tests
        run: nix develop --command just qml-test

  design:
    name: design
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: design
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Screenshot harness tests
        run: nix develop --command just shots-test

      - name: Design checks
        run: nix develop --command just design-check

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  system-files:
    name: system files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check's tests
        run: test/system-files/check-test .

      - name: System files
        run: test/system-files/check --base origin/main .

  # Always runs: a required check that is skipped counts as passed, so this
  # one runs on the others' failure or cancellation too, and fails.
  check:
    name: check (x86_64-linux)
    needs: [flake, lint, nextest, nextest-slow, qml, design, system-files]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n $failed ]]; then
            printf '%s\n' "$failed" >&2
            exit 1
          fi
