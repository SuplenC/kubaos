# The checks of a pull request into main, and of each push to main, on
# x86_64: `just check` in the flake's devshell, and `nix flake check
# --no-build`, which only evaluates. A pull request into another branch (a
# piece of a feature landing on its parent branch) runs none: its checks run
# when the parent's pull request into main does. `just shots` stays out: its
# screenshots are for a person to look at, not a check.
#
# The checks run as parallel jobs, each on its own runner, one step per recipe
# so a failure names what failed:
# - changes: which of the gated jobs below a pull request needs, from the
#   files it changes since its merge base with main. A push to main needs all.
# - flake: `nix flake check --no-build`.
# - fmt and lint: `just fmt-check`, `just lint`.
# - nextest and nextest (slow): `just nextest`, split in two by `SLOW_TEST`.
# - qml: `just qml-test`.
# - design: `just shots-test`, `just design-check-ui` (the lint, contrast,
#   the specimen's geometry and QML's parity).
# - mockups, gated: `just mockups-checked`, when the mockups' inputs change.
# - apps verify, gated: `just apps-verify` on the apps a pull request changes
#   (their folders, or their vendor repositories' pins), against the vendors'
#   servers; every app when the check itself changes. Not on a push to main.
# - shellcheck: `just shellcheck`.
# - system files: `just system-files-check`'s two scripts, run straight on the
#   runner: they need only bash and git, so the job sets up no Nix. It checks
#   out the whole history, for the merge base with main.
# A gated job a change doesn't need still runs, skipping its steps, so it
# reports success under its own name. `check (x86_64-linux)` needs them all
# and fails unless every one passed. It is the one check branch protection
# requires, so a job added here goes in its `needs`.
#
# Fast through three caches, which .github/actions/setup restores:
# - Cachix (kuba-os.cachix.org), read-only, for what the binary cache workflow
#   (cache.yml) built from main. No token: a PR never writes to it.
# - The Nix store (cache-nix-action), keyed by the flake and by what the job
#   builds, for the devshell, the toolchain and the design checks' Qt.
# - sccache's directory and cargo's downloads, keyed by the job, Cargo.lock
#   and flake.lock, for the crates' builds. Incremental builds are off, so
#   sccache caches every crate.
# Only the run on each push to main saves the Actions caches.
#
# Actions are pinned to a commit, with the release in the comment beside it.
name: Check

on:
  # `edited` is for a pull request retargeted onto main, which fires nothing
  # else; the jobs skip an edit that left the base alone.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# An edit that skips every job takes a group of its own, so it never cancels
# a real run of the same pull request.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 3G
  # Kōbō's every screen at every scale, about three minutes alone, longer than
  # every other test together: `nextest (slow)` runs it beside `nextest`,
  # which runs the rest. One filter, negated in one of them, so every test
  # runs in exactly one. Renamed, the test matches nothing, and nextest
  # fails `nextest (slow)` for running no test.
  SLOW_TEST: package(kubaos-kobo) & test(=shots::every_screen_keeps_to_the_grid)

jobs:
  changes:
    name: changes
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mockups: ${{ steps.paths.outputs.mockups }}
      apps: ${{ steps.paths.outputs.apps }}
      apps-all: ${{ steps.paths.outputs.apps-all }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The mockups' inputs: the site and the tokens (design/), the shell
      # whose surfaces it mocks, the crates its check builds and compares
      # with, the pictures it reads (branding/, Kōbō's assets, the boot
      # splash and GRUB theme), the workspace's manifests and toolchain, the
      # recipes, the flake that pins Node and Chromium, the setup action and
      # this workflow. A path names a folder with its slash, a file whole.
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            printf '%s\n' mockups=true apps=false apps-all=false >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE...HEAD")"
          printf '%s\n' "$changed"
          any() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          {
            echo "mockups=$(any '^(design/|config/quickshell/|crates/kubaos-(ui|tokens|specimen|geometry)/|crates/kubaos-kobo/assets/|branding/|system/files/(plymouth|grub)/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|justfile$|flake\.(nix|lock)$|\.github/actions/|\.github/workflows/check\.yml$)')"
            echo "apps=$(any '^(apps/|system/packages\.toml$|system/files/apt/sources\.list\.d/)')"
            echo "apps-all=$(any '^crates/kubaos-apps-verify/')"
          } >>"$GITHUB_OUTPUT"

  flake:
    name: flake
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          name: flake

      - name: Flake check
        run: nix flake check --no-build

  lint:
    name: fmt and lint
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: lint
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Format
        run: nix develop --command just fmt-check

      - name: Clippy
        run: nix develop --command just lint

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kubaos/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  nextest:
    name: nextest
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: nextest
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Tests
        run: nix develop --command just nextest -E "not ($SLOW_TEST)"

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kubaos/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  nextest-slow:
    name: nextest (slow)
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: nextest-slow
          store: devshell
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      # Only Kōbō's tests build, not the workspace's.
      - name: Tests
        run: nix develop --command cargo nextest run -p kubaos-kobo -E "$SLOW_TEST"

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kubaos/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  qml:
    name: qml
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          name: qml

      - name: Build the devshell
        run: nix develop --command true

      - name: QML logic tests
        run: nix develop --command just qml-test

  design:
    name: design
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          name: design
          cargo: true

      - name: Build the devshell
        run: nix develop --command true

      - name: Screenshot harness tests
        run: nix develop --command just shots-test

      - name: Design checks
        run: nix develop --command just design-check-ui

      - name: Compile cache stats
        if: ${{ !cancelled() }}
        run: nix develop --command sccache --show-stats

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kubaos/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

  mockups:
    name: mockups
    if: github.event.action != 'edited' || github.event.changes.base
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEEDED: ${{ needs.changes.outputs.mockups }}
    steps:
      - name: Check out
        if: env.NEEDED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The design job's caches: the same devshell, and the crates the
      # mockups' check builds are a part of the design job's.
      - name: Set up
        if: env.NEEDED == 'true'
        uses: ./.github/actions/setup
        with:
          name: design
          cargo: true

      - name: Mockup pages
        if: env.NEEDED == 'true'
        run: nix develop --command just mockups-checked

      - name: Not needed
        if: env.NEEDED != 'true'
        run: echo "No input of the mockups' check changed."

  apps-verify:
    name: apps verify
    if: github.event.action != 'edited' || github.event.changes.base
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEEDED: ${{ needs.changes.outputs.apps == 'true' || needs.changes.outputs.apps-all == 'true' }}
      ALL: ${{ needs.changes.outputs.apps-all }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      # A push to main checks no app, but builds the verifier and saves its
      # compile cache, so a pull request's run starts from its own.
      - name: Check out
        if: env.NEEDED == 'true' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up
        id: setup
        if: env.NEEDED == 'true' || github.event_name == 'push'
        uses: ./.github/actions/setup
        with:
          name: apps-verify
          store: devshell
          cargo: true

      # The token lifts GitHub's limit on the release lookups to 1,000 an
      # hour; it only reads public releases.
      - name: Apps against their upstreams
        if: env.NEEDED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ $ALL == true ]]; then
            nix develop --command just apps-verify
          else
            nix develop --command just apps-verify --changed "origin/$BASE"
          fi

      - name: Build the verifier
        if: github.event_name == 'push'
        run: nix develop --command cargo build -q -p kubaos-apps-verify

      - name: Save the compile cache
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kubaos/sccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-key }}

      - name: Not needed
        if: env.NEEDED != 'true' && github.event_name != 'push'
        run: echo "No app or vendor repository changed."

  shellcheck:
    name: shellcheck
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          name: shellcheck
          store: devshell

      - name: Shellcheck
        run: nix develop --command just shellcheck

  system-files:
    name: system files
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check's tests
        run: test/system-files/check-test .

      - name: System files
        run: test/system-files/check --base origin/main .

  # Always runs: a required check that is skipped counts as passed, so this
  # one runs on the others' failure or cancellation too, and fails.
  check:
    name: check (x86_64-linux)
    needs: [changes, flake, lint, nextest, nextest-slow, qml, design, mockups, apps-verify, shellcheck, system-files]
    if: always() && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n $failed ]]; then
            printf '%s\n' "$failed" >&2
            exit 1
          fi
